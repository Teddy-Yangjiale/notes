<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">SE：压缩空间统计 → 预测通道门 → 缩放原特征</title><desc id="desc">通道门依赖当前输入；空间位置共享同通道gate，并不等于token self-attention。</desc><rect width="1200" height="650" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">SE：压缩空间统计 → 预测通道门 → 缩放原特征</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">通道门依赖当前输入；空间位置共享同通道gate，并不等于token self-attention。</text><rect x="55" y="180" width="230" height="170" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="220" font-size="28" fill="#26372f" text-anchor="start">特征U</text><text x="75" y="262" font-size="22" fill="#26372f" text-anchor="start">C×H×W</text><text x="75" y="294" font-size="22" fill="#26372f" text-anchor="start">保留原空间特征</text><line x1="300" y1="260" x2="345" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 334 253 L 345 260 L 334 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="360" y="180" width="230" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="380" y="220" font-size="28" fill="#26372f" text-anchor="start">GAP</text><text x="380" y="262" font-size="22" fill="#26372f" text-anchor="start">每通道平均</text><text x="380" y="294" font-size="22" fill="#26372f" text-anchor="start">得到C维z</text><line x1="605" y1="260" x2="650" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 639 253 L 650 260 L 639 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="665" y="180" width="230" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="685" y="220" font-size="28" fill="#26372f" text-anchor="start">小MLP</text><text x="685" y="262" font-size="22" fill="#26372f" text-anchor="start">C → hidden → C</text><text x="685" y="294" font-size="22" fill="#26372f" text-anchor="start">sigmoid门a</text><line x1="910" y1="260" x2="955" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 944 253 L 955 260 L 944 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="970" y="180" width="175" height="170" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="990" y="220" font-size="28" fill="#26372f" text-anchor="start">缩放</text><text x="990" y="262" font-size="22" fill="#26372f" text-anchor="start">V = a⊙U</text><text x="990" y="294" font-size="22" fill="#26372f" text-anchor="start">空间不变</text><line x1="175" y1="365" x2="175" y2="425" stroke="#26372f" stroke-width="3"/><line x1="175" y1="425" x2="1060" y2="425" stroke="#26372f" stroke-width="3"/><line x1="1060" y1="425" x2="1060" y2="365" stroke="#26372f" stroke-width="3"/><text x="470" y="410" font-size="25" fill="#26372f" text-anchor="start">原特征直接送到缩放处</text><text x="55" y="505" font-size="27" fill="#26372f" text-anchor="start">反传有两条路径：直接缩放 + 输入改变gate后的间接影响</text><text x="55" y="565" font-size="25" fill="#26372f" text-anchor="start">若把gate当常数，只乘a，会漏掉门预测网络返回的梯度。</text></g></svg>
