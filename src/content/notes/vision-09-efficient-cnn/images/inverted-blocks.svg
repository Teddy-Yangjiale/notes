<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">三种瓶颈：比较宽度与空间卷积的位置</title><desc id="desc">宽度数字为示例；MobileNet在展开空间做DW，ConvNeXt先做DW再扩展。</desc><rect width="1200" height="850" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">三种瓶颈：比较宽度与空间卷积的位置</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">宽度数字为示例；MobileNet在展开空间做DW，ConvNeXt先做DW再扩展。</text><text x="55" y="165" font-size="27" fill="#26372f" text-anchor="start">ResNet瓶颈：256 → 64 → 64 → 256</text><rect x="55" y="195" width="310" height="120" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="235" font-size="28" fill="#26372f" text-anchor="start">1×1降维</text><text x="75" y="277" font-size="22" fill="#26372f" text-anchor="start">256 → 64</text><rect x="445" y="195" width="310" height="120" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="465" y="235" font-size="28" fill="#26372f" text-anchor="start">3×3普通卷积</text><text x="465" y="277" font-size="22" fill="#26372f" text-anchor="start">64 → 64</text><rect x="835" y="195" width="310" height="120" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="855" y="235" font-size="28" fill="#26372f" text-anchor="start">1×1升维</text><text x="855" y="277" font-size="22" fill="#26372f" text-anchor="start">64 → 256</text><text x="55" y="370" font-size="27" fill="#26372f" text-anchor="start">MobileNetV2：24 → 144 → 144 → 24</text><rect x="55" y="400" width="310" height="120" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="440" font-size="28" fill="#26372f" text-anchor="start">1×1扩展</text><text x="75" y="482" font-size="22" fill="#26372f" text-anchor="start">24 → 144</text><rect x="445" y="400" width="310" height="120" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="465" y="440" font-size="28" fill="#26372f" text-anchor="start">3×3 depthwise</text><text x="465" y="482" font-size="22" fill="#26372f" text-anchor="start">144通道各自处理</text><rect x="835" y="400" width="310" height="120" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="855" y="440" font-size="28" fill="#26372f" text-anchor="start">线性投影</text><text x="855" y="482" font-size="22" fill="#26372f" text-anchor="start">144 → 24</text><text x="55" y="575" font-size="27" fill="#26372f" text-anchor="start">ConvNeXt：96 → DW96 → LN → MLP384 → 96</text><rect x="55" y="605" width="310" height="120" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="645" font-size="28" fill="#26372f" text-anchor="start">7×7 depthwise</text><text x="75" y="687" font-size="22" fill="#26372f" text-anchor="start">96通道各自处理</text><rect x="445" y="605" width="310" height="120" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="465" y="645" font-size="28" fill="#26372f" text-anchor="start">LN与线性扩展</text><text x="465" y="687" font-size="22" fill="#26372f" text-anchor="start">96 → 384，GELU</text><rect x="835" y="605" width="310" height="120" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="855" y="645" font-size="28" fill="#26372f" text-anchor="start">线性投影</text><text x="855" y="687" font-size="22" fill="#26372f" text-anchor="start">384 → 96</text><text x="55" y="785" font-size="25" fill="#26372f" text-anchor="start">shortcut对齐各块的长期状态；同尺寸/通道条件满足时才可恒等相加。</text></g></svg>
