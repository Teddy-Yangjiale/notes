<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">复合缩放：同一资源预算怎样分配三条轴</title><desc id="desc">近似成本 d×w²×r²；DW、SE、首尾层和整数取整使真实计算偏离近似。</desc><rect width="1200" height="680" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">复合缩放：同一资源预算怎样分配三条轴</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">近似成本 d×w²×r²；DW、SE、首尾层和整数取整使真实计算偏离近似。</text><rect x="55" y="180" width="310" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="220" font-size="28" fill="#26372f" text-anchor="start">深度d = α^φ</text><text x="75" y="262" font-size="22" fill="#26372f" text-anchor="start">增加block重复数</text><text x="75" y="294" font-size="22" fill="#26372f" text-anchor="start">计算近似一次方</text><text x="75" y="326" font-size="22" fill="#26372f" text-anchor="start">参数也随深度增加</text><rect x="445" y="180" width="310" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="465" y="220" font-size="28" fill="#26372f" text-anchor="start">宽度w = β^φ</text><text x="465" y="262" font-size="22" fill="#26372f" text-anchor="start">增加通道数</text><text x="465" y="294" font-size="22" fill="#26372f" text-anchor="start">PW计算近似平方</text><text x="465" y="326" font-size="22" fill="#26372f" text-anchor="start">DW计算只按一次方</text><rect x="835" y="180" width="310" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="855" y="220" font-size="28" fill="#26372f" text-anchor="start">边长r = γ^φ</text><text x="855" y="262" font-size="22" fill="#26372f" text-anchor="start">提高图像分辨率</text><text x="855" y="294" font-size="22" fill="#26372f" text-anchor="start">计算、激活近似平方</text><text x="855" y="326" font-size="22" fill="#26372f" text-anchor="start">卷积权重数量不变</text><text x="55" y="470" font-size="28" fill="#26372f" text-anchor="start">α=1.2，β=1.1，γ=1.15：一档近似成本 ×1.92027</text><text x="55" y="530" font-size="27" fill="#26372f" text-anchor="start">各轴连续公式 → 通道/层数/分辨率取整 → 真实逐层账本</text><text x="55" y="590" font-size="25" fill="#26372f" text-anchor="start">最佳比例依赖模型、任务、数据与设备；近似成本不是精确全网计数。</text></g></svg>
