<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">空间混合与通道混合：普通卷积 vs DW+PW</title><desc id="desc">DW每通道独立过滤，PW在每位置混合通道；两者合起来才能同时完成两类混合。</desc><rect width="1200" height="650" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">空间混合与通道混合：普通卷积 vs DW+PW</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">DW每通道独立过滤，PW在每位置混合通道；两者合起来才能同时完成两类混合。</text><rect x="55" y="170" width="300" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">普通3×3卷积</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">每输出读全部输入通道</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">权重9×Cᵢ×Cₒ</text><rect x="470" y="170" width="310" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="490" y="210" font-size="28" fill="#26372f" text-anchor="start">Depthwise 3×3</text><text x="490" y="252" font-size="22" fill="#26372f" text-anchor="start">每输入通道一张核</text><text x="490" y="284" font-size="22" fill="#26372f" text-anchor="start">权重9×Cᵢ</text><line x1="795" y1="255" x2="845" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 834 248 L 845 255 L 834 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="860" y="170" width="285" height="170" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="880" y="210" font-size="28" fill="#26372f" text-anchor="start">Pointwise 1×1</text><text x="880" y="252" font-size="22" fill="#26372f" text-anchor="start">通道Cᵢ → Cₒ</text><text x="880" y="284" font-size="22" fill="#26372f" text-anchor="start">权重Cᵢ×Cₒ</text><line x1="55" y1="400" x2="1145" y2="400" stroke="#95a99b" stroke-width="3" stroke-dasharray="9 7"/><text x="55" y="455" font-size="26" fill="#26372f" text-anchor="start">32输入、64输出：普通18432权重；DW288 + PW2048 = 2336</text><text x="55" y="515" font-size="27" fill="#26372f" text-anchor="start">输出56×56：普通57.80M MAC；可分离7.33M MAC</text><text x="55" y="575" font-size="25" fill="#26372f" text-anchor="start">减少计算也限制核的结构；实际速度还取决于访存、布局和算子实现。</text></g></svg>
