<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">单阶段检测：密集预测之后仍需解码、排序与去重</title><desc id="desc">YOLO把候选分类回归放进一次整图前向；经典版本仍使用NMS。</desc><rect width="1200" height="815" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">单阶段检测：密集预测之后仍需解码、排序与去重</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">YOLO把候选分类回归放进一次整图前向；经典版本仍使用NMS。</text><rect x="45" y="145" width="280" height="225" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">密集输出</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">网格/金字塔位置</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">每位置多个框或anchor</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">objectness、类别、offset</text><line x1="340" y1="255" x2="410" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 399 248 L 410 255 L 399 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="435" y="145" width="280" height="225" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="185" font-size="28" fill="#26372f" text-anchor="start">解码与打分</text><text x="455" y="227" font-size="22" fill="#26372f" text-anchor="start">offset→图像框</text><text x="455" y="259" font-size="22" fill="#26372f" text-anchor="start">score组合规则固定</text><text x="455" y="291" font-size="22" fill="#26372f" text-anchor="start">阈值过滤低分框</text><line x1="730" y1="255" x2="800" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 789 248 L 800 255 L 789 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="825" y="145" width="320" height="225" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="185" font-size="28" fill="#26372f" text-anchor="start">class-aware NMS</text><text x="845" y="227" font-size="22" fill="#26372f" text-anchor="start">每类按分数降序</text><text x="845" y="259" font-size="22" fill="#26372f" text-anchor="start">保留最高分</text><text x="845" y="291" font-size="22" fill="#26372f" text-anchor="start">删IoU超过阈值的同类框</text><rect x="45" y="480" width="520" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="520" font-size="28" fill="#26372f" text-anchor="start">训练侧不平衡</text><text x="65" y="562" font-size="22" fill="#26372f" text-anchor="start">密集位置多数是容易背景</text><text x="65" y="594" font-size="22" fill="#26372f" text-anchor="start">采样、objectness或focal loss处理</text><text x="65" y="626" font-size="22" fill="#26372f" text-anchor="start">责任分配决定谁回归</text><rect x="625" y="480" width="520" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="645" y="520" font-size="28" fill="#26372f" text-anchor="start">评价侧排序</text><text x="645" y="562" font-size="22" fill="#26372f" text-anchor="start">按最终score全数据集排序</text><text x="645" y="594" font-size="22" fill="#26372f" text-anchor="start">一对一匹配GT</text><text x="645" y="626" font-size="22" fill="#26372f" text-anchor="start">PR曲线积分得到AP</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">one-stage描述网络预测路径；它不意味着零后处理或只输出一个框。</text></g></svg>
