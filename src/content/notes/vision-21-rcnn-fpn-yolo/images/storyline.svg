width="3"/><path d="M 899 253 L 910 260 L 899 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="915" y="155" width="250" height="215" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="935" y="195" font-size="24" fill="#26372f" text-anchor="start">YOLO 密集预测</text><text x="935" y="237" font-size="18" fill="#26372f" text-anchor="start">整图一次预测多个位置</text><text x="935" y="267" font-size="18" fill="#26372f" text-anchor="start">最后统一定义 AP</text><rect x="45" y="430" width="1115" height="125" rx="13" fill="#ffffff" stroke="#95a99b" stroke-width="2"/><text x="65" y="470" font-size="28" fill="#26372f" text-anchor="start">阅读方式</text><text x="65" y="512" font-size="22" fill="#26372f" text-anchor="start">沿箭头追问：上一步解决了什么？留下什么限制？</text><text x="65" y="544" font-size="22" fill="#26372f" text-anchor="start">下一篇论文改动的是目标、结构、数据，还是训练过程？</text></g></svg>
