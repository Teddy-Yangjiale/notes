<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">RPN的张量契约：每个位置k个anchor，两类输出头</title><desc id="desc">以H×W特征图、k=9为例；回归只对正anchor生效。</desc><rect width="1200" height="790" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">RPN的张量契约：每个位置k个anchor，两类输出头</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">以H×W特征图、k=9为例；回归只对正anchor生效。</text><rect x="45" y="155" width="280" height="205" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="195" font-size="28" fill="#26372f" text-anchor="start">共享特征 H×W×D</text><text x="65" y="237" font-size="22" fill="#26372f" text-anchor="start">3×3滑动卷积</text><text x="65" y="269" font-size="22" fill="#26372f" text-anchor="start">每个位置同一套参数</text><text x="65" y="301" font-size="22" fill="#26372f" text-anchor="start">anchor只是参考框</text><line x1="340" y1="255" x2="410" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 399 248 L 410 255 L 399 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="435" y="115" width="315" height="175" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="155" font-size="28" fill="#26372f" text-anchor="start">objectness头</text><text x="455" y="197" font-size="22" fill="#26372f" text-anchor="start">H×W×2k logits</text><text x="455" y="229" font-size="22" fill="#26372f" text-anchor="start">前景/背景</text><text x="455" y="261" font-size="22" fill="#26372f" text-anchor="start">训练含正负anchor</text><rect x="435" y="350" width="315" height="175" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="455" y="390" font-size="28" fill="#26372f" text-anchor="start">box头</text><text x="455" y="432" font-size="22" fill="#26372f" text-anchor="start">H×W×4k offsets</text><text x="455" y="464" font-size="22" fill="#26372f" text-anchor="start">tx,ty,tw,th</text><text x="455" y="496" font-size="22" fill="#26372f" text-anchor="start">只监督正anchor</text><line x1="765" y1="255" x2="830" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 819 248 L 830 255 L 819 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="850" y="155" width="295" height="265" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="870" y="195" font-size="28" fill="#26372f" text-anchor="start">proposal生成</text><text x="870" y="237" font-size="22" fill="#26372f" text-anchor="start">decode到图像坐标</text><text x="870" y="269" font-size="22" fill="#26372f" text-anchor="start">clip并删极小框</text><text x="870" y="301" font-size="22" fill="#26372f" text-anchor="start">按score排序</text><text x="870" y="333" font-size="22" fill="#26372f" text-anchor="start">NMS后取top-N</text><text x="45" y="655" font-size="24" fill="#26372f" text-anchor="start">原论文k=3尺度×3宽高比=9；约60×40位置产生约21600个原始anchor。</text><text x="45" y="710" font-size="24" fill="#26372f" text-anchor="start">anchor是固定回归参考；proposal是网络解码后的候选框。</text></g></svg>
