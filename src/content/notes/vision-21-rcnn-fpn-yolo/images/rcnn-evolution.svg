<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc"><title id="title">R-CNN家族：昂贵计算逐步从区域移到共享特征图</title><desc id="desc">“两阶段”指proposal后再分类回归，不等于整条训练流程只有两个脚本。</desc><rect width="1200" height="805" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">R-CNN家族：昂贵计算逐步从区域移到共享特征图</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">“两阶段”指proposal后再分类回归，不等于整条训练流程只有两个脚本。</text><rect x="45" y="155" width="315" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="65" y="195" font-size="28" fill="#26372f" text-anchor="start">R-CNN</text><text x="65" y="237" font-size="22" fill="#26372f" text-anchor="start">Selective Search约2000框</text><text x="65" y="269" font-size="22" fill="#26372f" text-anchor="start">逐框warp并跑CNN</text><text x="65" y="301" font-size="22" fill="#26372f" text-anchor="start">SVM与回归器分开训练</text><line x1="375" y1="260" x2="435" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 424 253 L 435 260 L 424 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="455" y="155" width="315" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="475" y="195" font-size="28" fill="#26372f" text-anchor="start">Fast R-CNN</text><text x="475" y="237" font-size="22" fill="#26372f" text-anchor="start">整图CNN只跑一次</text><text x="475" y="269" font-size="22" fill="#26372f" text-anchor="start">RoI Pooling抽固定尺寸</text><text x="475" y="301" font-size="22" fill="#26372f" text-anchor="start">仍依赖外部proposal</text><line x1="785" y1="260" x2="845" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 834 253 L 845 260 L 834 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="865" y="155" width="290" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="885" y="195" font-size="28" fill="#26372f" text-anchor="start">Faster R-CNN</text><text x="885" y="237" font-size="22" fill="#26372f" text-anchor="start">共享特征上的RPN</text><text x="885" y="269" font-size="22" fill="#26372f" text-anchor="start">anchor→proposal</text><text x="885" y="301" font-size="22" fill="#26372f" text-anchor="start">检测head二次判别</text><rect x="45" y="470" width="1100" height="155" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="510" font-size="28" fill="#26372f" text-anchor="start">不变的核心任务</text><text x="65" y="552" font-size="22" fill="#26372f" text-anchor="start">候选位置覆盖真值 → 每个候选分类 → 正样本回归 → 抑制重复框。</text><text x="65" y="584" font-size="22" fill="#26372f" text-anchor="start">变化的是候选如何产生、特征是否共享、几何是否量化以及损失如何归约。</text><text x="45" y="725" font-size="24" fill="#26372f" text-anchor="start">RoIAlign后来替换RoI Pooling的坐标量化，但不改变两阶段定义。</text></g></svg>
