<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc"><title id="title">检测框的共同语言：坐标、交并集与责任分配</title><desc id="desc">所有检测器都要先把几何约定说清；IoU只量重叠，不量类别与置信度。</desc><rect width="1200" height="805" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">检测框的共同语言：坐标、交并集与责任分配</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">所有检测器都要先把几何约定说清；IoU只量重叠，不量类别与置信度。</text><rect x="45" y="155" width="300" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="195" font-size="28" fill="#26372f" text-anchor="start">框A = (10,20,50,60)</text><text x="65" y="237" font-size="22" fill="#26372f" text-anchor="start">宽40，高40，面积1600</text><text x="65" y="269" font-size="22" fill="#26372f" text-anchor="start">连续坐标：右下边界不加1</text><text x="65" y="301" font-size="22" fill="#26372f" text-anchor="start">中心(30,40)</text><rect x="450" y="155" width="300" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="470" y="195" font-size="28" fill="#26372f" text-anchor="start">框B = (30,40,70,80)</text><text x="470" y="237" font-size="22" fill="#26372f" text-anchor="start">交集20×20=400</text><text x="470" y="269" font-size="22" fill="#26372f" text-anchor="start">并集1600+1600−400</text><text x="470" y="301" font-size="22" fill="#26372f" text-anchor="start">IoU=400/2800=1/7</text><rect x="855" y="155" width="290" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="875" y="195" font-size="28" fill="#26372f" text-anchor="start">IoU阈值的三种用途</text><text x="875" y="237" font-size="22" fill="#26372f" text-anchor="start">训练：分正/负/忽略</text><text x="875" y="269" font-size="22" fill="#26372f" text-anchor="start">NMS：删除重复预测</text><text x="875" y="301" font-size="22" fill="#26372f" text-anchor="start">评价：判定TP/FP</text><rect x="45" y="470" width="1100" height="155" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="510" font-size="28" fill="#26372f" text-anchor="start">同一个0.5不代表同一个操作</text><text x="65" y="552" font-size="22" fill="#26372f" text-anchor="start">匹配阈值决定监督标签；NMS阈值比较预测与预测；AP阈值比较预测与真值。</text><text x="65" y="584" font-size="22" fill="#26372f" text-anchor="start">坐标闭区间、半开区间或连续边界必须全链路一致。</text><text x="45" y="725" font-size="24" fill="#26372f" text-anchor="start">先定义框与坐标，再讨论anchor、proposal、回归和后处理。</text></g></svg>
