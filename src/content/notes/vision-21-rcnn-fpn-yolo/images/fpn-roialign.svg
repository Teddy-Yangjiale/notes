<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">FPN与RoIAlign：先补语义，再保留连续几何</title><desc id="desc">FPN解决尺度上的语义强度；RoIAlign解决每个RoI内部的采样对齐。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">FPN与RoIAlign：先补语义，再保留连续几何</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">FPN解决尺度上的语义强度；RoIAlign解决每个RoI内部的采样对齐。</text><rect x="45" y="130" width="280" height="260" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="170" font-size="28" fill="#26372f" text-anchor="start">Bottom-up C2…C5</text><text x="65" y="212" font-size="22" fill="#26372f" text-anchor="start">分辨率逐层降低</text><text x="65" y="244" font-size="22" fill="#26372f" text-anchor="start">语义逐层增强</text><text x="65" y="276" font-size="22" fill="#26372f" text-anchor="start">stride约4,8,16,32</text><line x1="340" y1="260" x2="405" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 394 253 L 405 260 L 394 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="430" y="130" width="320" height="260" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="450" y="170" font-size="28" fill="#26372f" text-anchor="start">Top-down + lateral</text><text x="450" y="212" font-size="22" fill="#26372f" text-anchor="start">高层上采样2×</text><text x="450" y="244" font-size="22" fill="#26372f" text-anchor="start">同尺度1×1 lateral相加</text><text x="450" y="276" font-size="22" fill="#26372f" text-anchor="start">3×3平滑得P2…P5</text><line x1="765" y1="260" x2="830" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 819 253 L 830 260 L 819 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="855" y="130" width="290" height="260" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="875" y="170" font-size="28" fill="#26372f" text-anchor="start">按RoI尺度选层</text><text x="875" y="212" font-size="22" fill="#26372f" text-anchor="start">k=k0+floor(log2(s/224))</text><text x="875" y="244" font-size="22" fill="#26372f" text-anchor="start">小框去高分辨率层</text><text x="875" y="276" font-size="22" fill="#26372f" text-anchor="start">各层head共享参数</text><rect x="45" y="485" width="1100" height="150" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="525" font-size="28" fill="#26372f" text-anchor="start">RoIAlign在选定层内工作</text><text x="65" y="567" font-size="22" fill="#26372f" text-anchor="start">边界、bin和采样点均不取整；用邻近四点双线性插值，再按bin聚合。</text><text x="65" y="599" font-size="22" fill="#26372f" text-anchor="start">FPN层选择仍是离散决策；它与RoIAlign的连续采样是两个步骤。</text><text x="45" y="730" font-size="24" fill="#26372f" text-anchor="start">多尺度不等于把每个RoI送遍所有层；原FPN Fast R-CNN为每个RoI选择一层。</text></g></svg>
