<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">降采样混叠：高频变化可能消失</title><desc id="desc">同一条交替信号，以不同采样相位得到全0或全1。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">降采样混叠：高频变化可能消失</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">同一条交替信号，以不同采样相位得到全0或全1。</text><text x="55" y="190" font-size="27" fill="#26372f" text-anchor="start">原信号</text><rect x="250" y="145" width="87" height="87" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="293" y="198" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="340" y="145" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="383" y="198" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="430" y="145" width="87" height="87" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="473" y="198" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="520" y="145" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="563" y="198" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="610" y="145" width="87" height="87" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="653" y="198" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="700" y="145" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="743" y="198" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="790" y="145" width="87" height="87" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="833" y="198" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="880" y="145" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="923" y="198" font-size="23" fill="#26372f" text-anchor="middle">1</text><text x="55" y="335" font-size="27" fill="#26372f" text-anchor="start">偶数位置</text><rect x="250" y="290" width="87" height="87" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="293" y="343" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="340" y="290" width="87" height="87" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="383" y="343" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="430" y="290" width="87" height="87" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="473" y="343" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="520" y="290" width="87" height="87" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="563" y="343" font-size="23" fill="#26372f" text-anchor="middle">0</text><text x="55" y="480" font-size="27" fill="#26372f" text-anchor="start">奇数位置</text><rect x="250" y="435" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="293" y="488" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="340" y="435" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="383" y="488" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="430" y="435" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="473" y="488" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="520" y="435" width="87" height="87" rx="4" fill="#c8d9ce" stroke="#89998f" stroke-width="2"/><text x="563" y="488" font-size="23" fill="#26372f" text-anchor="middle">1</text><text x="55" y="585" font-size="25" fill="#26372f" text-anchor="start">抗混叠先抑制不能表示的高频，再降采样；它也会削弱细节。</text></g></svg>
