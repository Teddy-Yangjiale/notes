<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">局部相关手算：滑动窗口与核逐项相乘求和</title><desc id="desc">不补边，stride=1；3×3输入与2×2核得到2×2输出。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">局部相关手算：滑动窗口与核逐项相乘求和</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">不补边，stride=1；3×3输入与2×2核得到2×2输出。</text><rect x="70" y="155" width="67" height="67" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="103" y="198" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="140" y="155" width="67" height="67" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="173" y="198" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="210" y="155" width="67" height="67" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="243" y="198" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="70" y="225" width="67" height="67" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="103" y="268" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="140" y="225" width="67" height="67" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="173" y="268" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="210" y="225" width="67" height="67" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="243" y="268" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="70" y="295" width="67" height="67" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="103" y="338" font-size="23" fill="#26372f" text-anchor="middle">7</text><rect x="140" y="295" width="67" height="67" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="173" y="338" font-size="23" fill="#26372f" text-anchor