<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">crop与resize：模型坐标必须映回原图</title><desc id="desc">原图1000×800，crop原点(200,100)，尺寸400×300，缩放s=2。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">crop与resize：模型坐标必须映回原图</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">原图1000×800，crop原点(200,100)，尺寸400×300，缩放s=2。</text><rect x="65" y="150" width="475" height="345" rx="13" fill="#e6ece6" stroke="#95a99b" stroke-width="2"/><rect x="160" y="210" width="230" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="180" y="245" font-size="26" fill="#26372f" text-anchor="start">crop区域</text><text x="90" y="530" font-size="26" fill="#26372f" text-anchor="start">原点(200,100)</text><text x="90" y="570" font-size="26" fill="#26372f" text-anchor="start">原图点(350,220)</text><circle cx="245" cy="300" r="8" fill="#a34435"/><line x1="570" y1="310" x2="660" y2="310" stroke="#26372f" stroke-width="3"/><path d="M 649 303 L 660 310 L 649 317" fill="none" stroke="#26372f" stroke-width="3"/><rect x="705" y="180" width="405" height="305" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="730" y="225" font-size="27" fill="#26372f" text-anchor="start">resize后800×600</text><circle cx="857" cy="302" r="8" fill="#a34435"/><text x="760" y="355" font-size="27" fill="#26372f" text-anchor="start">新坐标(300,240)</text><text x="715" y="530" font-size="24" fill="#26372f" text-anchor="start">x′=2(x−200)</text><text x="715" y="568" font-size="24" fill="#26372f" text-anchor="start">逆变换x=x′/2+200</text></g></svg>
