<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">两个监督最终在共享参数处相加</title><desc id="desc">局部方向可以同向、冲突或抵消；额外头不代表额外独立骨干。</desc><rect width="1200" height="715" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">两个监督最终在共享参数处相加</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">局部方向可以同向、冲突或抵消；额外头不代表额外独立骨干。</text><rect x="60" y="155" width="420" height="165" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="80" y="195" font-size="28" fill="#26372f" text-anchor="start">标签分支</text><text x="80" y="237" font-size="22" fill="#26372f" text-anchor="start">g_c=(1−α)(p_c−r)</text><text x="80" y="269" font-size="22" fill="#26372f" text-anchor="start">特征梯度：g_c W_cᵀ</text><rect x="720" y="155" width="420" height="165" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="740" y="195" font-size="28" fill="#26372f" text-anchor="start">教师分支</text><text x="740" y="237" font-size="22" fill="#26372f" text-anchor="start">hard：g_d=α(p_d−e_teacher)</text><text x="740" y="269" font-size="22" fill="#26372f" text-anchor="start">特征梯度：g_d W_dᵀ</text><line x1="270" y1="330" x2="270" y2="385" stroke="#26372f" stroke-width="3"/><line x1="930" y1="330" x2="930" y2="385" stroke="#26372f" stroke-width="3"/><line x1="270" y1="385" x2="930" y2="385" stroke="#26372f" stroke-width="3"/><rect x="300" y="425" width="600" height="145" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="320" y="465" font-size="28" fill="#26372f" text-anchor="start">attention / FFN / patch投影</text><text x="320" y="507" font-size="22" fill="#26372f" text-anchor="start">共同参数梯度 = 两条反传贡献之和</text><text x="60" y="635" font-size="24" fill="#26372f" text-anchor="start">输出头只取两行，不表示patch没有梯度：attention会把依赖传回图像。</text></g></svg>
