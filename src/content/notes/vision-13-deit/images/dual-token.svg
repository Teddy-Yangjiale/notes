<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">CLS与DIST：共享骨干，分别接收直接监督</title><desc id="desc">特殊token是输入参数，教师类别通过loss进入；教师无需成为学生推理输入。</desc><rect width="1200" height="700" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">CLS与DIST：共享骨干，分别接收直接监督</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">特殊token是输入参数，教师类别通过loss进入；教师无需成为学生推理输入。</text><rect x="55" y="160" width="310" height="145" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="200" font-size="28" fill="#26372f" text-anchor="start">图像 → patch投影</text><text x="75" y="242" font-size="22" fill="#26372f" text-anchor="start">N个patch，宽D</text><rect x="55" y="350" width="310" height="145" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="390" font-size="28" fill="#26372f" text-anchor="start">输入特殊位置</text><text x="75" y="432" font-size="22" fill="#26372f" text-anchor="start">CLS c / DIST d</text><text x="75" y="464" font-size="22" fill="#26372f" text-anchor="start">拼接后T=N+2</text><line x1="385" y1="255" x2="455" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 444 248 L 455 255 L 444 262" fill="none" stroke="#26372f" stroke-width="3"/><line x1="385" y1="425" x2="455" y2="425" stroke="#26372f" stroke-width="3"/><path d="M 444 418 L 455 425 L 444 432" fill="none" stroke="#26372f" stroke-width="3"/><rect x="480" y="240" width="270" height="245" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="500" y="280" font-size="28" fill="#26372f" text-anchor="start">共享Transformer</text><text x="500" y="322" font-size="22" fill="#26372f" text-anchor="start">所有token交换信息</text><text x="500" y="354" font-size="22" fill="#26372f" text-anchor="start">最终LN</text><text x="500" y="386" font-size="22" fill="#26372f" text-anchor="start">取位置0、位置1</text><line x1="765" y1="285" x2="820" y2="285" stroke="#26372f" stroke-width="3"/><path d="M 809 278 L 820 285 L 809 292" fill="none" stroke="#26372f" stroke-width="3"/><line x1="765" y1="430" x2="820" y2="430" stroke="#26372f" stroke-width="3"/><path d="M 809 423 L 820 430 L 809 437" fill="none" stroke="#26372f" stroke-width="3"/><rect x="845" y="180" width="305" height="135" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="865" y="220" font-size="28" fill="#26372f" text-anchor="start">CLS分类头</text><text x="865" y="262" font-size="22" fill="#26372f" text-anchor="start">真实标签/混合软目标</text><rect x="845" y="380" width="305" height="135" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="865" y="420" font-size="28" fill="#26372f" text-anchor="start">DIST分类头</text><text x="865" y="462" font-size="22" fill="#26372f" text-anchor="start">固定教师hard/soft目标</text><text x="55" y="610" font-size="26" fill="#26372f" text-anchor="start">部署：只执行学生骨干和两头，按指定政策融合输出。</text></g></svg>
