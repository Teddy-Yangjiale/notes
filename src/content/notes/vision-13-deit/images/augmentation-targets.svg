<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title desc"><title id="title">混合输入与两个目标不是同一对象</title><desc id="desc">Mixup/CutMix作用于输入和真实目标；在线教师在当前增强输入上重新预测。</desc><rect width="1200" height="725" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">混合输入与两个目标不是同一对象</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">Mixup/CutMix作用于输入和真实目标；在线教师在当前增强输入上重新预测。</text><rect x="55" y="155" width="290" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="195" font-size="28" fill="#26372f" text-anchor="start">两张原图</text><text x="75" y="237" font-size="22" fill="#26372f" text-anchor="start">x_i，x_j</text><text x="75" y="269" font-size="22" fill="#26372f" text-anchor="start">标签 r_i，r_j</text><line x1="365" y1="240" x2="425" y2="240" stroke="#26372f" stroke-width="3"/><path d="M 414 233 L 425 240 L 414 247" fill="none" stroke="#26372f" stroke-width="3"/><rect x="450" y="155" width="330" height="180" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="470" y="195" font-size="28" fill="#26372f" text-anchor="start">产生增强输入</text><text x="470" y="237" font-size="22" fill="#26372f" text-anchor="start">Mixup像素线性混合</text><text x="470" y="269" font-size="22" fill="#26372f" text-anchor="start">CutMix复制实际区域</text><line x1="800" y1="240" x2="860" y2="240" stroke="#26372f" stroke-width="3"/><path d="M 849 233 L 860 240 L 849 247" fill="none" stroke="#26372f" stroke-width="3"/><rect x="885" y="155" width="265" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="905" y="195" font-size="28" fill="#26372f" text-anchor="start">当前图 x̃</text><text x="905" y="237" font-size="22" fill="#26372f" text-anchor="start">学生、教师均读取</text><text x="905" y="269" font-size="22" fill="#26372f" text-anchor="start">类别顺序要对应</text><rect x="55" y="405" width="500" height="185" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="445" font-size="28" fill="#26372f" text-anchor="start">真实标签分支</text><text x="75" y="487" font-size="22" fill="#26372f" text-anchor="start">目标：λ r_i + (1−λ)r_j</text><text x="75" y="519" font-size="22" fill="#26372f" text-anchor="start">CutMix λ使用裁剪后的实际面积</text><rect x="640" y="405" width="510" height="185" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="660" y="445" font-size="28" fill="#26372f" text-anchor="start">教师分支</text><text x="660" y="487" font-size="22" fill="#26372f" text-anchor="start">目标来自g_teacher(x̃)</text><text x="660" y="519" font-size="22" fill="#26372f" text-anchor="start">一般不等于两原图教师输出的线性混合</text><text x="55" y="655" font-size="26" fill="#26372f" text-anchor="start">缓存原图logits再混合，是不同监督协议，需独立验证。</text></g></svg>
