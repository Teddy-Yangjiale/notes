<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">学生参数增量、教师训练与部署分账</title><desc id="desc">固定教师省去其反向更新，仍有前向计算；学生推理通常不需要教师。</desc><rect width="1200" height="700" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">学生参数增量、教师训练与部署分账</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">固定教师省去其反向更新，仍有前向计算；学生推理通常不需要教师。</text><rect x="55" y="155" width="500" height="205" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="195" font-size="28" fill="#26372f" text-anchor="start">学生新增参数</text><text x="75" y="237" font-size="22" fill="#26372f" text-anchor="start">DIST向量：D</text><text x="75" y="269" font-size="22" fill="#26372f" text-anchor="start">一行位置：D</text><text x="75" y="301" font-size="22" fill="#26372f" text-anchor="start">第二头：(D+1)K</text><rect x="640" y="155" width="510" height="205" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="660" y="195" font-size="28" fill="#26372f" text-anchor="start">Base / 1000类增量</text><text x="660" y="237" font-size="22" fill="#26372f" text-anchor="start">768 + 768 + 769,000</text><text x="660" y="269" font-size="22" fill="#26372f" text-anchor="start">总新增：770,536</text><text x="660" y="301" font-size="22" fill="#26372f" text-anchor="start">蒸馏学生：87,338,192</text><rect x="55" y="410" width="500" height="205" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="450" font-size="28" fill="#26372f" text-anchor="start">蒸馏训练每批</text><text x="75" y="492" font-size="22" fill="#26372f" text-anchor="start">学生前向 + 学生反向</text><text x="75" y="524" font-size="22" fill="#26372f" text-anchor="start">教师前向；另记录教师来源/训练成本</text><rect x="640" y="410" width="510" height="205" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="660" y="450" font-size="28" fill="#26372f" text-anchor="start">部署学生</text><text x="660" y="492" font-size="22" fill="#26372f" text-anchor="start">学生骨干 + 两分类头</text><text x="660" y="524" font-size="22" fill="#26372f" text-anchor="start">指定CLS/DIST/融合政策</text><text x="660" y="556" font-size="22" fill="#26372f" text-anchor="start">MAC不直接等于实测延迟</text></g></svg>
