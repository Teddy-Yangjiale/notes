<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">融合顺序改变概率，甚至改变top-1</title><desc id="desc">p=(0.8,0.1,0.1)，q=(0.01,0.495,0.495)；所有数字为教学构造。</desc><rect width="1200" height="700" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">融合顺序改变概率，甚至改变top-1</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">p=(0.8,0.1,0.1)，q=(0.01,0.495,0.495)；所有数字为教学构造。</text><rect x="60" y="160" width="500" height="215" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="80" y="200" font-size="28" fill="#26372f" text-anchor="start">先softmax，再平均概率</text><text x="80" y="242" font-size="22" fill="#26372f" text-anchor="start">算术平均： (p+q)/2</text><text x="80" y="274" font-size="22" fill="#26372f" text-anchor="start">(0.405, 0.2975, 0.2975)</text><text x="80" y="306" font-size="22" fill="#26372f" text-anchor="start">第1类最大</text><rect x="640" y="160" width="500" height="215" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="660" y="200" font-size="28" fill="#26372f" text-anchor="start">先平均logits，再softmax</text><text x="660" y="242" font-size="22" fill="#26372f" text-anchor="start">归一化几何平均：sqrt(p×q)</text><text x="660" y="274" font-size="22" fill="#26372f" text-anchor="start">(0.1674, 0.4163, 0.4163)</text><text x="660" y="306" font-size="22" fill="#26372f" text-anchor="start">第2/3类并列最大</text><rect x="60" y="425" width="1080" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="85" y="465" font-size="25" fill="#26372f" text-anchor="start">softmax是非线性，两个操作一般不交换。</text><text x="85" y="513" font-size="25" fill="#26372f" text-anchor="start">论文文字和实际代码路径分别核对；评价记录采用哪一种融合。</text><text x="85" y="561" font-size="25" fill="#26372f" text-anchor="start">两头单独质量接近，也不保证融合必定改善。</text></g></svg>
