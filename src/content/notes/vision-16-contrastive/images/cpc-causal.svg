<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">CPC：上下文不读取未来，未来仍参加训练</title><desc id="desc">教学三步递归；未来正项与两个负项使用同一可导encoder。</desc><rect width="1200" height="770" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">CPC：上下文不读取未来，未来仍参加训练</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">教学三步递归；未来正项与两个负项使用同一可导encoder。</text><rect x="55" y="165" width="200" height="135" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="205" font-size="28" fill="#26372f" text-anchor="start">历史x₀</text><text x="75" y="247" font-size="22" fill="#26372f" text-anchor="start">共享encoder → z</text><rect x="280" y="165" width="200" height="135" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="300" y="205" font-size="28" fill="#26372f" text-anchor="start">历史x₁</text><text x="300" y="247" font-size="22" fill="#26372f" text-anchor="start">共享encoder → z</text><rect x="505" y="165" width="200" height="135" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="525" y="205" font-size="28" fill="#26372f" text-anchor="start">历史x₂</text><text x="525" y="247" font-size="22" fill="#26372f" text-anchor="start">共享encoder → z</text><rect x="730" y="165" width="200" height="135" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="750" y="205" font-size="28" fill="#26372f" text-anchor="start">未来正x₃</text><text x="750" y="247" font-size="22" fill="#26372f" text-anchor="start">共享encoder → z</text><rect x="955" y="165" width="200" height="135" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="975" y="205" font-size="28" fill="#26372f" text-anchor="start">负x₄/x₅</text><text x="975" y="247" font-size="22" fill="#26372f" text-anchor="start">共享encoder → z</text><rect x="55" y="410" width="570" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="450" font-size="28" fill="#26372f" text-anchor="start">causal context</text><text x="75" y="492" font-size="22" fill="#26372f" text-anchor="start">c₂只汇总z₀ / z₁ / z₂</text><text x="75" y="524" font-size="22" fill="#26372f" text-anchor="start">未来改变：c₂不变，target与loss可变</text><line x1="645" y1="490" x2="725" y2="490" stroke="#26372f" stroke-width="3"/><path d="M 714 483 L 725 490 L 714 497" fill="none" stroke="#26372f" stroke-width="3"/><rect x="755" y="410" width="390" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="775" y="450" font-size="28" fill="#26372f" text-anchor="start">预测与候选比较</text><text x="775" y="492" font-size="22" fill="#26372f" text-anchor="start">q = 预测头(context)</text><text x="775" y="524" font-size="22" fill="#26372f" text-anchor="start">q读取正/负z，分类正项</text><text x="775" y="556" font-size="22" fill="#26372f" text-anchor="start">梯度回到context与所有候选</text><text x="55" y="690" font-size="25" fill="#26372f" text-anchor="start">因果前向边界与stop-gradient是不同机制；原CPC目标支路可以回传。</text></g></svg>
