<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">SimCLR：一个embedding参与自己的行与别人的列</title><desc id="desc">两图双视图、交错次序；对角×排除self，+为positive，其余−为negative。</desc><rect width="1200" height="950" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">SimCLR：一个embedding参与自己的行与别人的列</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">两图双视图、交错次序；对角×排除self，+为positive，其余−为negative。</text><rect x="55" y="190" width="92" height="92" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="100.5" y="245.5" font-size="23" fill="#26372f" text-anchor="middle">×</text><rect x="150" y="190" width="92" height="92" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="195.5" y="245.5" font-size="23" fill="#26372f" text-anchor="middle">+</text><rect x="245" y="190" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="290.5" y="245.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="340" y="190" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="385.5" y="245.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="55" y="285" width="92" height="92" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="100.5" y="340.5" font-size="23" fill="#26372f" text-anchor="middle">+</text><rect x="150" y="285" width="92" height="92" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="195.5" y="340.5" font-size="23" fill="#26372f" text-anchor="middle">×</text><rect x="245" y="285" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="290.5" y="340.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="340" y="285" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="385.5" y="340.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="55" y="380" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="100.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="150" y="380" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="195.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="245" y="380" width="92" height="92" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="290.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">×</text><rect x="340" y="380" width="92" height="92" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="385.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">+</text><rect x="55" y="475" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="100.5" y="530.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="150" y="475" width="92" height="92" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="195.5" y="530.5" font-size="23" fill="#26372f" text-anchor="middle">−</text><rect x="245" y="475" width="92" height="92" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="290.5" y="530.5" font-size="23" fill="#26372f" text-anchor="middle">+</text><rect x="340" y="475" width="92" height="92" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="385.5" y="530.5" font-size="23" fill="#26372f" text-anchor="middle">×</text><rect x="525" y="190" width="620" height="150" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="545" y="230" font-size="28" fill="#26372f" text-anchor="start">anchor路径：第i行</text><text x="545" y="272" font-size="22" fill="#26372f" text-anchor="start">uᵢ与候选uⱼ点积，收到Eᵢⱼ贡献。</text><rect x="525" y="395" width="620" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="545" y="435" font-size="28" fill="#26372f" text-anchor="start">candidate路径：第i列</text><text x="545" y="477" font-size="22" fill="#26372f" text-anchor="start">其他anchor读取uᵢ，收到Eⱼᵢ贡献；不能漏掉。</text><rect x="55" y="650" width="1090" height="135" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="690" font-size="28" fill="#26372f" text-anchor="start">完整梯度回到同一个共享encoder</text><text x="75" y="732" font-size="22" fill="#26372f" text-anchor="start">G(uᵢ) = Σⱼ(Eᵢⱼ + Eⱼᵢ)uⱼ / τ，随后通过L2 norm与投影头。</text><text x="55" y="870" font-size="24" fill="#26372f" text-anchor="start">microbatch分开loss缺少跨批候选；普通no-grad gather也不自动恢复远端梯度。</text></g></svg>
