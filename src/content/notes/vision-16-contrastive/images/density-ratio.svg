<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">抽样实验决定posterior：条件项与边缘负项</title><desc id="desc">公平二进制C，X以0.8概率等于C；图示C=0，候选值[0,1]。</desc><rect width="1200" height="800" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">抽样实验决定posterior：条件项与边缘负项</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">公平二进制C，X以0.8概率等于C；图示C=0，候选值[0,1]。</text><rect x="55" y="170" width="330" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">条件分布</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">p(X=0|C=0) = 0.8</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">p(X=1|C=0) = 0.2</text><text x="75" y="316" font-size="22" fill="#26372f" text-anchor="start">一个正项来自此分布</text><rect x="435" y="170" width="330" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="210" font-size="28" fill="#26372f" text-anchor="start">边缘分布</text><text x="455" y="252" font-size="22" fill="#26372f" text-anchor="start">p(X=0) = 0.5</text><text x="455" y="284" font-size="22" fill="#26372f" text-anchor="start">p(X=1) = 0.5</text><text x="455" y="316" font-size="22" fill="#26372f" text-anchor="start">其他项独立来自边缘</text><rect x="815" y="170" width="330" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="210" font-size="28" fill="#26372f" text-anchor="start">密度比与posterior</text><text x="835" y="252" font-size="22" fill="#26372f" text-anchor="start">比值：(1.6, 0.4)</text><text x="835" y="284" font-size="22" fill="#26372f" text-anchor="start">归一化：(0.8, 0.2)</text><text x="835" y="316" font-size="22" fill="#26372f" text-anchor="start">不直接只用条件概率</text><rect x="55" y="480" width="1090" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="520" font-size="28" fill="#26372f" text-anchor="start">下界有抽样与期望条件</text><text x="75" y="562" font-size="22" fill="#26372f" text-anchor="start">log(M) − E[loss] ≤ I(C;X)；M包含positive。</text><text x="75" y="594" font-size="22" fill="#26372f" text-anchor="start">改变负proposal后比值变成p(x|c)/ν(x)，不能直接沿用边缘下界解释。</text><text x="55" y="725" font-size="26" fill="#26372f" text-anchor="start">二进制真MI约0.192745 nat；M4枚举下界约0.145801 nat。</text></g></svg>
