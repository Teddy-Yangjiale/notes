<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">MoCo：本步query梯度、EMA key与旧字典快照</title><desc id="desc">图示本章核对的历史builder顺序；每步只做约定的一次EMA。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">MoCo：本步query梯度、EMA key与旧字典快照</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">图示本章核对的历史builder顺序；每步只做约定的一次EMA。</text><rect x="55" y="170" width="335" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">query encoder θq</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">增强1 → query q</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">本步loss梯度更新</text><text x="75" y="316" font-size="22" fill="#26372f" text-anchor="start">使用optimizer与scheduler</text><rect x="435" y="170" width="335" height="190" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="210" font-size="28" fill="#26372f" text-anchor="start">key encoder θk</text><text x="455" y="252" font-size="22" fill="#26372f" text-anchor="start">θk ← mθk + (1−m)θq</text><text x="455" y="284" font-size="22" fill="#26372f" text-anchor="start">增强2 → positive key</text><text x="455" y="316" font-size="22" fill="#26372f" text-anchor="start">本步key支路停止梯度</text><rect x="815" y="170" width="330" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="210" font-size="28" fill="#26372f" text-anchor="start">旧queue快照</text><text x="835" y="252" font-size="22" fill="#26372f" text-anchor="start">K个历史负key</text><text x="835" y="284" font-size="22" fill="#26372f" text-anchor="start">q·k+ 与 q·queue</text><text x="835" y="316" font-size="22" fill="#26372f" text-anchor="start">标签positive列0</text><rect x="55" y="460" width="520" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="500" font-size="28" fill="#26372f" text-anchor="start">先固定本步字典再入队</text><text x="75" y="542" font-size="22" fill="#26372f" text-anchor="start">loss与query梯度使用相同旧值</text><text x="75" y="574" font-size="22" fill="#26372f" text-anchor="start">当前keys入队、覆盖最旧项</text><text x="75" y="606" font-size="22" fill="#26372f" text-anchor="start">保存queue / pointer / 全部状态</text><rect x="625" y="460" width="520" height="180" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="645" y="500" font-size="28" fill="#26372f" text-anchor="start">不要交换职责</text><text x="645" y="542" font-size="22" fill="#26372f" text-anchor="start">EMA不是SGD momentum</text><text x="645" y="574" font-size="22" fill="#26372f" text-anchor="start">detach不复制旧queue数值</text><text x="645" y="606" font-size="22" fill="#26372f" text-anchor="start">大K同时增候选与历史年龄</text><text x="55" y="735" font-size="24" fill="#26372f" text-anchor="start">本文K5/B2演示一般环写；作者历史helper另要求K可被global batch整除。</text></g></svg>
