<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">同源视图 → 共享编码 → 投影 → 候选分类</title><desc id="desc">源图ID产生配对监督；loss空间z与迁移表示h是两个明确接口。</desc><rect width="1200" height="770" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">同源视图 → 共享编码 → 投影 → 候选分类</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">源图ID产生配对监督；loss空间z与迁移表示h是两个明确接口。</text><rect x="55" y="175" width="245" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">原图A / B</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">每图两次随机增强</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">生成A₁/A₂/B₁/B₂</text><line x1="315" y1="265" x2="370" y2="265" stroke="#26372f" stroke-width="3"/><path d="M 359 258 L 370 265 L 359 272" fill="none" stroke="#26372f" stroke-width="3"/><rect x="385" y="175" width="300" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="405" y="215" font-size="28" fill="#26372f" text-anchor="start">共享f与g</text><text x="405" y="257" font-size="22" fill="#26372f" text-anchor="start">h = encoder(view)</text><text x="405" y="289" font-size="22" fill="#26372f" text-anchor="start">z = projector(h)</text><text x="405" y="321" font-size="22" fill="#26372f" text-anchor="start">u = z / norm(z)</text><line x1="705" y1="265" x2="765" y2="265" stroke="#26372f" stroke-width="3"/><path d="M 754 258 L 765 265 L 754 272" fill="none" stroke="#26372f" stroke-width="3"/><rect x="785" y="175" width="360" height="180" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="805" y="215" font-size="28" fill="#26372f" text-anchor="start">每anchor选配对项</text><text x="805" y="257" font-size="22" fill="#26372f" text-anchor="start">排除self，保留positive</text><text x="805" y="289" font-size="22" fill="#26372f" text-anchor="start">分母含全部合法候选</text><text x="805" y="321" font-size="22" fill="#26372f" text-anchor="start">softmax + 交叉熵</text><rect x="55" y="450" width="1090" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="490" font-size="28" fill="#26372f" text-anchor="start">不要混淆三个数量</text><text x="75" y="532" font-size="22" fill="#26372f" text-anchor="start">B张原图，M=2B个视图；每行M−1候选，其中1正、M−2负。</text><text x="75" y="564" font-size="22" fill="#26372f" text-anchor="start">预训练通过g回传到f；linear probe常删除g，只训练新的标签head。</text><text x="55" y="690" font-size="25" fill="#26372f" text-anchor="start">无人工类别标签仍有明确监督关系；增强与候选采样共同定义任务。</text></g></svg>
