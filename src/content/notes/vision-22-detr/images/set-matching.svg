<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">DETR集合匹配：先一对一指派，再逐槽计算损失</title><desc id="desc">N=5示意；3个真值补2个∅，匈牙利算法在整张代价矩阵上选最小和。</desc><rect width="1200" height="815" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DETR集合匹配：先一对一指派，再逐槽计算损失</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">N=5示意；3个真值补2个∅，匈牙利算法在整张代价矩阵上选最小和。</text><rect x="45" y="150" width="270" height="250" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="190" font-size="28" fill="#26372f" text-anchor="start">真值集合</text><text x="65" y="232" font-size="22" fill="#26372f" text-anchor="start">猫 g₁</text><text x="65" y="264" font-size="22" fill="#26372f" text-anchor="start">人 g₂</text><text x="65" y="296" font-size="22" fill="#26372f" text-anchor="start">车 g₃</text><text x="65" y="328" font-size="22" fill="#26372f" text-anchor="start">∅</text><text x="65" y="360" font-size="22" fill="#26372f" text-anchor="start">∅</text><line x1="330" y1="275" x2="400" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 389 268 L 400 275 L 389 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="425" y="115" width="350" height="320" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="445" y="155" font-size="28" fill="#26372f" text-anchor="start">5×5匹配代价</text><text x="445" y="197" font-size="22" fill="#26372f" text-anchor="start">类别代价 + 框L1 + GIoU</text><text x="445" y="229" font-size="22" fill="#26372f" text-anchor="start">∅行只含类别代价</text><text x="445" y="261" font-size="22" fill="#26372f" text-anchor="start">每行每列恰选一次</text><text x="445" y="293" font-size="22" fill="#26372f" text-anchor="start">全局最优，不逐行贪心</text><line x1="790" y1="275" x2="855" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 844 268 L 855 275 L 844 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="875" y="150" width="270" height="250" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="895" y="190" font-size="28" fill="#26372f" text-anchor="start">预测槽</text><text x="895" y="232" font-size="22" fill="#26372f" text-anchor="start">q₄→猫</text><text x="895" y="264" font-size="22" fill="#26372f" text-anchor="start">q₁→人</text><text x="895" y="296" font-size="22" fill="#26372f" text-anchor="start">q₅→车</text><text x="895" y="328" font-size="22" fill="#26372f" text-anchor="start">q₂→∅</text><text x="895" y="360" font-size="22" fill="#26372f" text-anchor="start">q₃→∅</text><rect x="45" y="505" width="1100" height="140" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="545" font-size="28" fill="#26372f" text-anchor="start">唯一匹配使重复预测付出代价</text><text x="65" y="587" font-size="22" fill="#26372f" text-anchor="start">同一物体附近的两个query不能都匹配同一GT；一个成为正槽，另一个通常被监督为∅。</text><text x="65" y="619" font-size="22" fill="#26372f" text-anchor="start">去重压力来自全局集合损失，因此标准DETR推理不依赖NMS。</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">匹配是离散选择；网络梯度通过选中后的分类与框损失传播。</text></g></svg>
