<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">Deformable attention：围绕reference稀疏采样多尺度特征</title><desc id="desc">每个query、head、level只预测K个offset与权重；采样点用双线性插值。</desc><rect width="1200" height="815" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Deformable attention：围绕reference稀疏采样多尺度特征</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">每个query、head、level只预测K个offset与权重；采样点用双线性插值。</text><rect x="45" y="155" width="275" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="195" font-size="28" fill="#26372f" text-anchor="start">query + reference</text><text x="65" y="237" font-size="22" fill="#26372f" text-anchor="start">encoder：像素自身</text><text x="65" y="269" font-size="22" fill="#26372f" text-anchor="start">decoder：预测参考点/框</text><text x="65" y="301" font-size="22" fill="#26372f" text-anchor="start">归一化到[0,1]</text><line x1="335" y1="265" x2="405" y2="265" stroke="#26372f" stroke-width="3"/><path d="M 394 258 L 405 265 L 394 272" fill="none" stroke="#26372f" stroke-width="3"/><rect x="430" y="115" width="330" height="300" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="450" y="155" font-size="28" fill="#26372f" text-anchor="start">L层×M头×K点</text><text x="450" y="197" font-size="22" fill="#26372f" text-anchor="start">offset Δp可学习</text><text x="450" y="229" font-size="22" fill="#26372f" text-anchor="start">attention权重和为1</text><text x="450" y="261" font-size="22" fill="#26372f" text-anchor="start">默认M=8，K≤4</text><text x="450" y="293" font-size="22" fill="#26372f" text-anchor="start">不扫描全部HW keys</text><line x1="775" y1="265" x2="845" y2="265" stroke="#26372f" stroke-width="3"/><path d="M 834 258 L 845 265 L 834 272" fill="none" stroke="#26372f" stroke-width="3"/><rect x="870" y="155" width="275" height="220" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="890" y="195" font-size="28" fill="#26372f" text-anchor="start">聚合输出</text><text x="890" y="237" font-size="22" fill="#26372f" text-anchor="start">各层坐标按尺寸映射</text><text x="890" y="269" font-size="22" fill="#26372f" text-anchor="start">双线性读feature</text><text x="890" y="301" font-size="22" fill="#26372f" text-anchor="start">加权、投影、跨层融合</text><rect x="45" y="500" width="1100" height="140" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="540" font-size="28" fill="#26372f" text-anchor="start">归纳偏置与代价</text><text x="65" y="582" font-size="22" fill="#26372f" text-anchor="start">稀疏reference邻域让优化更像“从位置附近找证据”，并允许高分辨率多尺度输入。</text><text x="65" y="614" font-size="22" fill="#26372f" text-anchor="start">offset可把采样移到远处；“deformable”不等于固定局部窗口。</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">复杂度近似随query数×层数×头数×采样点数线性增长。</text></g></svg>
