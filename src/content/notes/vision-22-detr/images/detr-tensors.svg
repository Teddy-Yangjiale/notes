<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">原始DETR张量流：空间token与对象槽是两条轴</title><desc id="desc">以C5特征h×w、d=256、N=100为例；decoder并行输出固定100个槽。</desc><rect width="1200" height="815" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">原始DETR张量流：空间token与对象槽是两条轴</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">以C5特征h×w、d=256、N=100为例；decoder并行输出固定100个槽。</text><rect x="45" y="145" width="270" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">CNN feature</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">B×2048×h×w</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">1×1投影到d</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">flatten为B×hw×d</text><line x1="330" y1="255" x2="395" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 384 248 L 395 255 L 384 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="420" y="145" width="290" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="440" y="185" font-size="28" fill="#26372f" text-anchor="start">Encoder memory</text><text x="440" y="227" font-size="22" fill="#26372f" text-anchor="start">加2D位置编码</text><text x="440" y="259" font-size="22" fill="#26372f" text-anchor="start">全局self-attention</text><text x="440" y="291" font-size="22" fill="#26372f" text-anchor="start">shape B×hw×d</text><line x1="725" y1="255" x2="790" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 779 248 L 790 255 L 779 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="815" y="145" width="330" height="220" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="185" font-size="28" fill="#26372f" text-anchor="start">Decoder slots</text><text x="835" y="227" font-size="22" fill="#26372f" text-anchor="start">N个learned object queries</text><text x="835" y="259" font-size="22" fill="#26372f" text-anchor="start">self-attn + cross-attn</text><text x="835" y="291" font-size="22" fill="#26372f" text-anchor="start">shape B×N×d</text><rect x="45" y="480" width="520" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="520" font-size="28" fill="#26372f" text-anchor="start">每槽分类</text><text x="65" y="562" font-size="22" fill="#26372f" text-anchor="start">线性层→C+1 logits</text><text x="65" y="594" font-size="22" fill="#26372f" text-anchor="start">额外∅类</text><text x="65" y="626" font-size="22" fill="#26372f" text-anchor="start">softmax概率</text><rect x="625" y="480" width="520" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="645" y="520" font-size="28" fill="#26372f" text-anchor="start">每槽框</text><text x="645" y="562" font-size="22" fill="#26372f" text-anchor="start">MLP→4数 + sigmoid</text><text x="645" y="594" font-size="22" fill="#26372f" text-anchor="start">归一化(cx,cy,w,h)</text><text x="645" y="626" font-size="22" fill="#26372f" text-anchor="start">训练用L1+GIoU</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">object query不是裁剪图像，也不是一开始就绑定某个类别或固定物体。</text></g></svg>
