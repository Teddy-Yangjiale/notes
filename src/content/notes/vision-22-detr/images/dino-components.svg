<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">检测版DINO：三项改动放在训练与query初始化的不同位置</title><desc id="desc">它是DETR检测器，不是第19—20讲的自监督DINO视觉表征。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">检测版DINO：三项改动放在训练与query初始化的不同位置</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">它是DETR检测器，不是第19—20讲的自监督DINO视觉表征。</text><rect x="45" y="145" width="330" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">Contrastive DN</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">近GT小噪声→重建GT</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">更远噪声→∅</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">训练query选择与拒绝</text><rect x="435" y="145" width="330" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="185" font-size="28" fill="#26372f" text-anchor="start">Mixed query selection</text><text x="455" y="227" font-size="22" fill="#26372f" text-anchor="start">encoder top-k初始化4D anchor</text><text x="455" y="259" font-size="22" fill="#26372f" text-anchor="start">content query仍可学习</text><text x="455" y="291" font-size="22" fill="#26372f" text-anchor="start">只增强位置部分</text><rect x="825" y="145" width="320" height="220" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="185" font-size="28" fill="#26372f" text-anchor="start">Look forward twice</text><text x="845" y="227" font-size="22" fill="#26372f" text-anchor="start">当前层box供下层refine</text><text x="845" y="259" font-size="22" fill="#26372f" text-anchor="start">后一层loss的框梯度</text><text x="845" y="291" font-size="22" fill="#26372f" text-anchor="start">也回流前一层box参数</text><rect x="45" y="485" width="1100" height="145" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="525" font-size="28" fill="#26372f" text-anchor="start">共同基座</text><text x="65" y="567" font-size="22" fill="#26372f" text-anchor="start">multi-scale deformable attention + dynamic anchor box + iterative refinement + Hungarian matching。</text><text x="65" y="599" font-size="22" fill="#26372f" text-anchor="start">CDN只在训练存在；matching queries仍决定推理输出，标准路线仍无需NMS。</text><text x="45" y="730" font-size="24" fill="#26372f" text-anchor="start">DINO论文常用900 matching queries；query数是输出容量和decoder成本的显式上限。</text></g></svg>
