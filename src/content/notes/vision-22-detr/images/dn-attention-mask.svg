<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">DN-DETR：训练时增加有答案的噪声query，并用mask防泄漏</title><desc id="desc">每个denoising group含整套GT的一个噪声版本；推理时整个DN部分移除。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DN-DETR：训练时增加有答案的噪声query，并用mask防泄漏</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">每个denoising group含整套GT的一个噪声版本；推理时整个DN部分移除。</text><rect x="45" y="145" width="330" height="205" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">Denoising queries</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">GT label/box加噪</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">直接重建原GT</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">绕过匈牙利匹配</text><rect x="45" y="435" width="330" height="205" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="475" font-size="28" fill="#26372f" text-anchor="start">Matching queries</text><text x="65" y="517" font-size="22" fill="#26372f" text-anchor="start">普通learned/anchor queries</text><text x="65" y="549" font-size="22" fill="#26372f" text-anchor="start">仍做一对一匹配</text><text x="65" y="581" font-size="22" fill="#26372f" text-anchor="start">构成真实推理路径</text><rect x="450" y="120" width="695" height="520" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="470" y="160" font-size="28" fill="#26372f" text-anchor="start">Decoder self-attention mask</text><text x="470" y="202" font-size="22" fill="#26372f" text-anchor="start">DN group 1：可看本组，屏蔽其他DN组</text><text x="470" y="234" font-size="22" fill="#26372f" text-anchor="start">DN group 2：可看本组，屏蔽其他DN组</text><text x="470" y="266" font-size="22" fill="#26372f" text-anchor="start">…</text><text x="470" y="298" font-size="22" fill="#26372f" text-anchor="start">matching部分不能看DN答案</text><text x="470" y="330" font-size="22" fill="#26372f" text-anchor="start">是否允许DN看matching依具体掩码方向</text><text x="45" y="730" font-size="24" fill="#26372f" text-anchor="start">没有mask，matching query可抄noisy GT；多个DN组也可互相泄露同一真值。</text></g></svg>
