<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">数据引擎：模型、标注与质量验证构成可审计闭环</title><desc id="desc">规模来自逐步提高自动化，而不是把所有候选都当作同等质量的人工GT。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">数据引擎：模型、标注与质量验证构成可审计闭环</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">规模来自逐步提高自动化，而不是把所有候选都当作同等质量的人工GT。</text><rect x="45" y="145" width="270" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">采样媒体与任务</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">覆盖新域/长尾概念</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">定义提示与标注单位</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">准备真实负例</text><line x1="330" y1="255" x2="395" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 384 248 L 395 255 L 384 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="420" y="145" width="270" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="440" y="185" font-size="28" fill="#26372f" text-anchor="start">模型辅助标注</text><text x="440" y="227" font-size="22" fill="#26372f" text-anchor="start">初始mask/轨迹提议</text><text x="440" y="259" font-size="22" fill="#26372f" text-anchor="start">人类点击、brush、修正</text><text x="440" y="291" font-size="22" fill="#26372f" text-anchor="start">记录失败类型</text><line x1="705" y1="255" x2="770" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 759 248 L 770 255 L 759 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="795" y="145" width="360" height="220" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="815" y="185" font-size="28" fill="#26372f" text-anchor="start">质量与穷举性验证</text><text x="815" y="227" font-size="22" fill="#26372f" text-anchor="start">mask边界质量</text><text x="815" y="259" font-size="22" fill="#26372f" text-anchor="start">概念是否完整穷举</text><text x="815" y="291" font-size="22" fill="#26372f" text-anchor="start">hard negative与空集合</text><text x="815" y="323" font-size="22" fill="#26372f" text-anchor="start">抽检和独立基准</text><line x1="975" y1="390" x2="600" y2="470" stroke="#26372f" stroke-width="3"/><path d="M 589 463 L 600 470 L 589 477" fill="none" stroke="#26372f" stroke-width="3"/><rect x="245" y="505" width="700" height="125" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="265" y="545" font-size="28" fill="#26372f" text-anchor="start">训练新版本并回灌</text><text x="265" y="587" font-size="22" fill="#26372f" text-anchor="start">只在验证通过后扩大自动阶段；保留人工复核和分布审计。</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">模型提升可降低标注成本，但也可能把当前偏差规模化。</text></g></svg>
