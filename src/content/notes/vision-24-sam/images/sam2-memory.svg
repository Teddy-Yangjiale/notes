<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc"><title id="title">SAM 2：当前帧用有限历史memory预测mask，并把结果写回队列</title><desc id="desc">空间记忆保存对象区域，object pointer提供轻量对象线索。</desc><rect width="1200" height="805" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">SAM 2：当前帧用有限历史memory预测mask，并把结果写回队列</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">空间记忆保存对象区域，object pointer提供轻量对象线索。</text><rect x="45" y="145" width="250" height="230" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">当前frame</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">image encoder</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">当前prompt（可选）</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">feature Fₜ</text><line x1="310" y1="260" x2="380" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 369 253 L 380 260 L 369 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="405" y="105" width="335" height="310" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="425" y="145" font-size="28" fill="#26372f" text-anchor="start">Memory attention</text><text x="425" y="187" font-size="22" fill="#26372f" text-anchor="start">读最近N帧空间memory</text><text x="425" y="219" font-size="22" fill="#26372f" text-anchor="start">读提示帧与pointer</text><text x="425" y="251" font-size="22" fill="#26372f" text-anchor="start">得到条件化feature</text><line x1="755" y1="260" x2="820" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 809 253 L 820 260 L 809 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="845" y="145" width="310" height="230" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="865" y="185" font-size="28" fill="#26372f" text-anchor="start">mask decoder + encoder</text><text x="865" y="227" font-size="22" fill="#26372f" text-anchor="start">输出mₜ与presence</text><text x="865" y="259" font-size="22" fill="#26372f" text-anchor="start">mₜ+feature写成memory</text><text x="865" y="291" font-size="22" fill="#26372f" text-anchor="start">FIFO保留首帧/近期帧</text><rect x="45" y="500" width="1110" height="145" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="540" font-size="28" fill="#26372f" text-anchor="start">交互修正</text><text x="65" y="582" font-size="22" fill="#26372f" text-anchor="start">任意帧追加点/框/mask可成为新条件；对象遮挡时应允许无对象。</text><text x="65" y="614" font-size="22" fill="#26372f" text-anchor="start">短期运动、长期重现、误差累积和ID切换需分别评测。</text><text x="45" y="730" font-size="24" fill="#26372f" text-anchor="start">流式只限制计算方式；离线设置仍可能有来自未来帧的用户提示。</text></g></svg>
