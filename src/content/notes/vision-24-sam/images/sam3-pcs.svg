<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">SAM 3：概念检测器找全实例，视频跟踪器保持每个masklet身份</title><desc id="desc">presence token单独判断概念是否存在，减少开放词汇假阳性。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">SAM 3：概念检测器找全实例，视频跟踪器保持每个masklet身份</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">presence token单独判断概念是否存在，减少开放词汇假阳性。</text><rect x="45" y="135" width="280" height="245" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="175" font-size="28" fill="#26372f" text-anchor="start">Concept prompts</text><text x="65" y="217" font-size="22" fill="#26372f" text-anchor="start">短名词短语</text><text x="65" y="249" font-size="22" fill="#26372f" text-anchor="start">正/负image exemplar</text><text x="65" y="281" font-size="22" fill="#26372f" text-anchor="start">text + exemplar token</text><line x1="340" y1="255" x2="405" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 394 248 L 405 255 L 394 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="430" y="100" width="335" height="315" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="450" y="140" font-size="28" fill="#26372f" text-anchor="start">DETR-like detector</text><text x="450" y="182" font-size="22" fill="#26372f" text-anchor="start">视觉/提示融合</text><text x="450" y="214" font-size="22" fill="#26372f" text-anchor="start">object queries → 框+mask</text><text x="450" y="246" font-size="22" fill="#26372f" text-anchor="start">presence token → 是否存在</text><line x1="780" y1="255" x2="845" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 834 248 L 845 255 L 834 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="870" y="135" width="280" height="245" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="890" y="175" font-size="28" fill="#26372f" text-anchor="start">SAM 2 tracker</text><text x="890" y="217" font-size="22" fill="#26372f" text-anchor="start">传播已有masklet</text><text x="890" y="249" font-size="22" fill="#26372f" text-anchor="start">新对象由detector加入</text><text x="890" y="281" font-size="22" fill="#26372f" text-anchor="start">高置信检测可重提示</text><rect x="45" y="500" width="1110" height="150" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="540" font-size="28" fill="#26372f" text-anchor="start">PCS边界</text><text x="65" y="582" font-size="22" fill="#26372f" text-anchor="start">目标是概念的所有匹配实例，并在视频保持ID；不是任意复杂长指令。</text><text x="65" y="614" font-size="22" fill="#26372f" text-anchor="start">hard negative概念、穷举性验证与空集合校准决定开放词汇可靠性。</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">检测身份无关，跟踪身份相关；拆分可减少目标冲突。</text></g></svg>
