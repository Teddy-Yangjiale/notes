<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc"><title id="title">SAM家族：提示从单图对象扩展到视频身份与概念实例</title><desc id="desc">同名不代表同一任务；先判断提示类型、实例数量和时间范围。</desc><rect width="1200" height="805" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">SAM家族：提示从单图对象扩展到视频身份与概念实例</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">同名不代表同一任务；先判断提示类型、实例数量和时间范围。</text><rect x="45" y="160" width="320" height="230" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="200" font-size="28" fill="#26372f" text-anchor="start">SAM（图像）</text><text x="65" y="242" font-size="22" fill="#26372f" text-anchor="start">点 / 框 / mask</text><text x="65" y="274" font-size="22" fill="#26372f" text-anchor="start">一个提示的有效区域</text><text x="65" y="306" font-size="22" fill="#26372f" text-anchor="start">多候选解决歧义</text><line x1="380" y1="275" x2="445" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 434 268 L 445 275 L 434 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="470" y="160" width="320" height="230" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="490" y="200" font-size="28" fill="#26372f" text-anchor="start">SAM 2（视频）</text><text x="490" y="242" font-size="22" fill="#26372f" text-anchor="start">视觉提示 + 任意帧修正</text><text x="490" y="274" font-size="22" fill="#26372f" text-anchor="start">同一对象的masklet</text><text x="490" y="306" font-size="22" fill="#26372f" text-anchor="start">流式记忆与遮挡</text><line x1="805" y1="275" x2="870" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 859 268 L 870 275 L 859 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="895" y="160" width="260" height="230" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="915" y="200" font-size="28" fill="#26372f" text-anchor="start">SAM 3（概念）</text><text x="915" y="242" font-size="22" fill="#26372f" text-anchor="start">短名词 / exemplar</text><text x="915" y="274" font-size="22" fill="#26372f" text-anchor="start">所有匹配实例</text><text x="915" y="306" font-size="22" fill="#26372f" text-anchor="start">检测 + 跟踪</text><rect x="45" y="500" width="1110" height="145" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="540" font-size="28" fill="#26372f" text-anchor="start">输出合同</text><text x="65" y="582" font-size="22" fill="#26372f" text-anchor="start">单图mask：不要求命名类别；视频masklet：需要跨帧身份；PCS：需要概念存在判断和多实例穷举。</text><text x="65" y="614" font-size="22" fill="#26372f" text-anchor="start">模型、数据和指标必须随合同变化。</text><text x="45" y="730" font-size="24" fill="#26372f" text-anchor="start">把SAM 1的视觉提示能力与SAM 3的概念检索能力分开评价。</text></g></svg>
