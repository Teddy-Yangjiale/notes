<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc"><title id="title">SAM：缓存图像embedding，提示token与空间feature在双向Transformer交互</title><desc id="desc">同图新增点击只重跑prompt encoder和mask decoder。</desc><rect width="1200" height="805" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">SAM：缓存图像embedding，提示token与空间feature在双向Transformer交互</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">同图新增点击只重跑prompt encoder和mask decoder。</text><rect x="45" y="145" width="280" height="230" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">图像编码器</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">图像 → H′×W′×D</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">一次较重的计算</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">可缓存</text><line x1="340" y1="260" x2="405" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 394 253 L 405 260 L 394 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="430" y="105" width="330" height="310" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="450" y="145" font-size="28" fill="#26372f" text-anchor="start">Two-way decoder</text><text x="450" y="187" font-size="22" fill="#26372f" text-anchor="start">点/框：位置+类型token</text><text x="450" y="219" font-size="22" fill="#26372f" text-anchor="start">mask：dense embedding</text><text x="450" y="251" font-size="22" fill="#26372f" text-anchor="start">prompt读图，图也读prompt</text><text x="450" y="283" font-size="22" fill="#26372f" text-anchor="start">mask token与IoU token</text><line x1="775" y1="260" x2="840" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 829 253 L 840 260 L 829 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="865" y="145" width="290" height="230" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="885" y="185" font-size="28" fill="#26372f" text-anchor="start">输出</text><text x="885" y="227" font-size="22" fill="#26372f" text-anchor="start">多个mask logits</text><text x="885" y="259" font-size="22" fill="#26372f" text-anchor="start">预测IoU质量</text><text x="885" y="291" font-size="22" fill="#26372f" text-anchor="start">上采样回原图</text><rect x="45" y="500" width="1110" height="145" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="540" font-size="28" fill="#26372f" text-anchor="start">歧义不是噪声</text><text x="65" y="582" font-size="22" fill="#26372f" text-anchor="start">单点可能指衣服、人或局部；多个候选避免平均成不连贯mask。</text><text x="65" y="614" font-size="22" fill="#26372f" text-anchor="start">预测IoU是候选质量估计，不是类别概率。</text><text x="45" y="730" font-size="24" fill="#26372f" text-anchor="start">自动全图mask是网格提示、筛选和去重组成的上层流程。</text></g></svg>
