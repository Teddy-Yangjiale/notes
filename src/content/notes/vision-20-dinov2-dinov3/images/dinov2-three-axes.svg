<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc"><title id="title">DINOv2扩展的三条轴：目标、数据与系统</title><desc id="desc">“更大模型”只有三分之一；公平复现需同时锁定三条轴。</desc><rect width="1200" height="835" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DINOv2扩展的三条轴：目标、数据与系统</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">“更大模型”只有三分之一；公平复现需同时锁定三条轴。</text><rect x="55" y="165" width="330" height="260" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="205" font-size="28" fill="#26372f" text-anchor="start">训练目标</text><text x="75" y="247" font-size="22" fill="#26372f" text-anchor="start">DINO：跨视图CLS</text><text x="75" y="279" font-size="22" fill="#26372f" text-anchor="start">iBOT：masked patch</text><text x="75" y="311" font-size="22" fill="#26372f" text-anchor="start">Sinkhorn teacher分配</text><text x="75" y="343" font-size="22" fill="#26372f" text-anchor="start">KoLeo展开CLS feature</text><rect x="435" y="165" width="330" height="260" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="205" font-size="28" fill="#26372f" text-anchor="start">数据策展</text><text x="455" y="247" font-size="22" fill="#26372f" text-anchor="start">1.2B池过滤 / 去重</text><text x="455" y="279" font-size="22" fill="#26372f" text-anchor="start">seed检索 + cluster采样</text><text x="455" y="311" font-size="22" fill="#26372f" text-anchor="start">LVD-142M</text><text x="455" y="343" font-size="22" fill="#26372f" text-anchor="start">移除评价集近重复</text><rect x="815" y="165" width="330" height="260" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="205" font-size="28" fill="#26372f" text-anchor="start">规模化系统</text><text x="835" y="247" font-size="22" fill="#26372f" text-anchor="start">packing + block mask</text><text x="835" y="279" font-size="22" fill="#26372f" text-anchor="start">跳过式stochastic depth</text><text x="835" y="311" font-size="22" fill="#26372f" text-anchor="start">FSDP混合精度</text><text x="835" y="343" font-size="22" fill="#26372f" text-anchor="start">短高分辨率适配</text><rect x="55" y="520" width="1090" height="145" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="560" font-size="28" fill="#26372f" text-anchor="start">输出接口分别评价</text><text x="75" y="602" font-size="22" fill="#26372f" text-anchor="start">CLS：分类/检索；patch：分割/深度/对应；数据与probe协议决定结论边界。</text><text x="55" y="755" font-size="24" fill="#26372f" text-anchor="start">DINO与iBOT head在DINOv2中分离；与原iBOT默认共享不同。</text></g></svg>
