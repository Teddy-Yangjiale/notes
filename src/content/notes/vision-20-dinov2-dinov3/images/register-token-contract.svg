<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Registers：给内部全局计算专用槽，保持patch空间接口</title><desc id="desc">R=4示意；下游patch从索引1+R开始，register输出默认丢弃。</desc><rect width="1200" height="730" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Registers：给内部全局计算专用槽，保持patch空间接口</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">R=4示意；下游patch从索引1+R开始，register输出默认丢弃。</text><rect x="55" y="170" width="102" height="102" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="105.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">CLS</text><rect x="160" y="170" width="102" height="102" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="210.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">R₁</text><rect x="265" y="170" width="102" height="102" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="315.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">R₂</text><rect x="370" y="170" width="102" height="102" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="420.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">R₃</text><rect x="475" y="170" width="102" height="102" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="525.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">R₄</text><rect x="580" y="170" width="102" height="102" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="630.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">P₀</text><rect x="685" y="170" width="102" height="102" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="735.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">P₁</text><rect x="790" y="170" width="102" height="102" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="840.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">…</text><rect x="895" y="170" width="102" height="102" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="945.5" y="230.5" font-size="23" fill="#26372f" text-anchor="middle">P₁₉₅</text><rect x="55" y="350" width="330" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="390" font-size="28" fill="#26372f" text-anchor="start">CLS</text><text x="75" y="432" font-size="22" fill="#26372f" text-anchor="start">图像级输出</text><text x="75" y="464" font-size="22" fill="#26372f" text-anchor="start">承受global目标</text><text x="75" y="496" font-size="22" fill="#26372f" text-anchor="start">下游可读取</text><rect x="435" y="350" width="330" height="190" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="390" font-size="28" fill="#26372f" text-anchor="start">Registers</text><text x="455" y="432" font-size="22" fill="#26372f" text-anchor="start">无像素/二维坐标</text><text x="455" y="464" font-size="22" fill="#26372f" text-anchor="start">供模型存取中间全局量</text><text x="455" y="496" font-size="22" fill="#26372f" text-anchor="start">输出通常丢弃</text><rect x="815" y="350" width="330" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="835" y="390" font-size="28" fill="#26372f" text-anchor="start">Patch tokens</text><text x="835" y="432" font-size="22" fill="#26372f" text-anchor="start">严格对应空间网格</text><text x="835" y="464" font-size="22" fill="#26372f" text-anchor="start">避免被挪作scratch</text><text x="835" y="496" font-size="22" fill="#26372f" text-anchor="start">dense下游读取</text><text x="55" y="650" font-size="25" fill="#26372f" text-anchor="start">总长度1+4+196=201；错误切片1:197会混入4个register并漏4个patch。</text></g></svg>
