<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc"><title id="title">DINOv3：长预训练、Gram refinement与三类后训练</title><desc id="desc">主teacher、Gram teacher和固定蒸馏teacher是三个不同状态对象。</desc><rect width="1200" height="825" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DINOv3：长预训练、Gram refinement与三类后训练</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">主teacher、Gram teacher和固定蒸馏teacher是三个不同状态对象。</text><rect x="45" y="150" width="330" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="190" font-size="28" fill="#26372f" text-anchor="start">阶段1：长程SSL</text><text x="65" y="232" font-size="22" fill="#26372f" text-anchor="start">DINO + iBOT + 0.1 DKoLeo</text><text x="65" y="264" font-size="22" fill="#26372f" text-anchor="start">EMA teacher；常数schedule</text><text x="65" y="296" font-size="22" fill="#26372f" text-anchor="start">global升，dense可能后期降</text><line x1="390" y1="255" x2="455" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 444 248 L 455 255 L 444 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="475" y="150" width="330" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="495" y="190" font-size="28" fill="#26372f" text-anchor="start">阶段2：Gram refinement</text><text x="495" y="232" font-size="22" fill="#26372f" text-anchor="start">早期dense优质teacher快照</text><text x="495" y="264" font-size="22" fill="#26372f" text-anchor="start">global crop关系矩阵匹配</text><text x="495" y="296" font-size="22" fill="#26372f" text-anchor="start">可用2×分辨率teacher下采样</text><line x1="820" y1="255" x2="880" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 869 248 L 880 255 L 869 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="900" y="150" width="255" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="920" y="190" font-size="28" fill="#26372f" text-anchor="start">旗舰7B</text><text x="920" y="232" font-size="22" fill="#26372f" text-anchor="start">patch关系修复</text><text x="920" y="264" font-size="22" fill="#26372f" text-anchor="start">保留global质量</text><text x="920" y="296" font-size="22" fill="#26372f" text-anchor="start">形成冻结视觉encoder</text><rect x="45" y="480" width="330" height="165" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="520" font-size="28" fill="#26372f" text-anchor="start">高分辨率适配</text><text x="65" y="562" font-size="22" fill="#26372f" text-anchor="start">混合global/local尺寸</text><text x="65" y="594" font-size="22" fill="#26372f" text-anchor="start">继续Gram；额外10k步</text><rect x="435" y="480" width="330" height="165" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="455" y="520" font-size="28" fill="#26372f" text-anchor="start">小模型蒸馏</text><text x="455" y="562" font-size="22" fill="#26372f" text-anchor="start">固定7B teacher</text><text x="455" y="594" font-size="22" fill="#26372f" text-anchor="start">不使用EMA teacher更新</text><text x="455" y="626" font-size="22" fill="#26372f" text-anchor="start">论文未用Gram</text><rect x="825" y="480" width="330" height="165" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="520" font-size="28" fill="#26372f" text-anchor="start">dino.txt文本对齐</text><text x="845" y="562" font-size="22" fill="#26372f" text-anchor="start">冻结视觉backbone</text><text x="845" y="594" font-size="22" fill="#26372f" text-anchor="start">训练文本侧与顶层适配</text><text x="845" y="626" font-size="22" fill="#26372f" text-anchor="start">获得开放词汇接口</text><text x="45" y="745" font-size="24" fill="#26372f" text-anchor="start">checkpoint名称必须标注阶段；基础视觉权重不自动具备文本零样本分类。</text></g></svg>
