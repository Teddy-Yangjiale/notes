<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">两种dense故障，两种修复层级</title><desc id="desc">无高范数outlier不代表patch关系长期稳定。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">两种dense故障，两种修复层级</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">无高范数outlier不代表patch关系长期稳定。</text><rect x="55" y="160" width="480" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="200" font-size="28" fill="#26372f" text-anchor="start">故障A：patch范数outlier</text><text x="75" y="242" font-size="22" fill="#26372f" text-anchor="start">低信息背景patch被挪作全局scratch</text><text x="75" y="274" font-size="22" fill="#26372f" text-anchor="start">局部probe差、全局probe强</text><text x="75" y="306" font-size="22" fill="#26372f" text-anchor="start">Registers提供专用工作槽</text><rect x="665" y="160" width="480" height="190" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="685" y="200" font-size="28" fill="#26372f" text-anchor="start">故障B：patch关系退化</text><text x="685" y="242" font-size="22" fill="#26372f" text-anchor="start">norm稳定但无关位置cosine升高</text><text x="685" y="274" font-size="22" fill="#26372f" text-anchor="start">global指标升、dense指标降</text><text x="685" y="306" font-size="22" fill="#26372f" text-anchor="start">Gram锚定两两相似结构</text><line x1="295" y1="370" x2="295" y2="440" stroke="#26372f" stroke-width="3"/><path d="M 284 433 L 295 440 L 284 447" fill="none" stroke="#26372f" stroke-width="3"/><line x1="905" y1="370" x2="905" y2="440" stroke="#26372f" stroke-width="3"/><path d="M 894 433 L 905 440 L 894 447" fill="none" stroke="#26372f" stroke-width="3"/><rect x="55" y="465" width="480" height="165" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="505" font-size="28" fill="#26372f" text-anchor="start">输出：干净patch接口</text><text x="75" y="547" font-size="22" fill="#26372f" text-anchor="start">special token与空间token分离</text><text x="75" y="579" font-size="22" fill="#26372f" text-anchor="start">仍需dense任务验证</text><rect x="665" y="465" width="480" height="165" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="685" y="505" font-size="28" fill="#26372f" text-anchor="start">输出：稳定局部关系</text><text x="685" y="547" font-size="22" fill="#26372f" text-anchor="start">XsXsᵀ匹配早期teacher</text><text x="685" y="579" font-size="22" fill="#26372f" text-anchor="start">允许共同正交旋转</text><text x="55" y="730" font-size="24" fill="#26372f" text-anchor="start">Registers与Gram Anchoring互补，不是前后版本对同一bug的重复命名。</text></g></svg>
