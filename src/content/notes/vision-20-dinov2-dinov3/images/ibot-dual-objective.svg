<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">iBOT：全局CLS与局部patch的两种蒸馏关系</title><desc id="desc">CLS跨随机视图；patch在同一视图、同一网格位置只对masked项计分。</desc><rect width="1200" height="790" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">iBOT：全局CLS与局部patch的两种蒸馏关系</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">CLS跨随机视图；patch在同一视图、同一网格位置只对masked项计分。</text><rect x="45" y="160" width="255" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="200" font-size="28" fill="#26372f" text-anchor="start">视图u</text><text x="65" y="242" font-size="22" fill="#26372f" text-anchor="start">student看masked û</text><text x="65" y="274" font-size="22" fill="#26372f" text-anchor="start">teacher看原始u</text><text x="65" y="306" font-size="22" fill="#26372f" text-anchor="start">patch坐标一一对应</text><rect x="45" y="410" width="255" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="450" font-size="28" fill="#26372f" text-anchor="start">视图v</text><text x="65" y="492" font-size="22" fill="#26372f" text-anchor="start">student看masked v̂</text><text x="65" y="524" font-size="22" fill="#26372f" text-anchor="start">teacher看原始v</text><text x="65" y="556" font-size="22" fill="#26372f" text-anchor="start">各自生成mask</text><line x1="315" y1="245" x2="390" y2="245" stroke="#26372f" stroke-width="3"/><path d="M 379 238 L 390 245 L 379 252" fill="none" stroke="#26372f" stroke-width="3"/><rect x="415" y="145" width="325" height="205" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="435" y="185" font-size="28" fill="#26372f" text-anchor="start">Patch MIM</text><text x="435" y="227" font-size="22" fill="#26372f" text-anchor="start">qᵤ,i → p_û,i</text><text x="435" y="259" font-size="22" fill="#26372f" text-anchor="start">qᵥ,i → p_v̂,i</text><text x="435" y="291" font-size="22" fill="#26372f" text-anchor="start">只计mᵢ=1；同视图同位置</text><line x1="315" y1="500" x2="390" y2="500" stroke="#26372f" stroke-width="3"/><path d="M 379 493 L 390 500 L 379 507" fill="none" stroke="#26372f" stroke-width="3"/><rect x="415" y="405" width="325" height="205" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="435" y="445" font-size="28" fill="#26372f" text-anchor="start">CLS跨视图</text><text x="435" y="487" font-size="22" fill="#26372f" text-anchor="start">qᵥ,CLS → p_û,CLS</text><text x="435" y="519" font-size="22" fill="#26372f" text-anchor="start">qᵤ,CLS → p_v̂,CLS</text><text x="435" y="551" font-size="22" fill="#26372f" text-anchor="start">获得全局语义</text><rect x="805" y="245" width="340" height="260" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="825" y="285" font-size="28" fill="#26372f" text-anchor="start">两套状态</text><text x="825" y="327" font-size="22" fill="#26372f" text-anchor="start">CLS / patch可有不同center</text><text x="825" y="359" font-size="22" fill="#26372f" text-anchor="start">teacher温度可不同</text><text x="825" y="391" font-size="22" fill="#26372f" text-anchor="start">总loss = CLS + MIM</text><text x="825" y="423" font-size="22" fill="#26372f" text-anchor="start">teacher均停止梯度并EMA</text><text x="45" y="710" font-size="24" fill="#26372f" text-anchor="start">在线tokenizer = teacher backbone + patch head；不是固定离散ID表。</text></g></svg>
