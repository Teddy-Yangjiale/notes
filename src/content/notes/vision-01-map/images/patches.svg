<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">图像切块 → 展平 → 可学习投影 → token序列</title><desc id="desc">图中仅示意4块；224×224图配16×16 patch实际有196块。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">图像切块 → 展平 → 可学习投影 → token序列</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">图中仅示意4块；224×224图配16×16 patch实际有196块。</text><rect x="70" y="180" width="102" height="102" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="120.5" y="240.5" font-size="23" fill="#26372f" text-anchor="middle">块1</text><rect x="175" y="180" width="102" height="102" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="225.5" y="240.5" font-size="23" fill="#26372f" text-anchor="middle">块2</text><rect x="70" y="285" width="102" height="102" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="120.5" y="345.5" font-size="23" fill="#26372f" text-anchor="middle">块3</text><rect x="175" y="285" width="102" height="102" rx="4" fill="#e8d8ed" stroke="#89998f" stroke-width="2"/><text x="225.5" y="345.5" font-size="23" fill="#26372f" text-anchor="middle">块4</text><line x1="310" y1="280" x2="395" y2="280" stroke="#26372f" stroke-width="3"/><path d="M 384 273 L 395 280 L 384 287" fill="none" stroke="#26372f" stroke-width="3"/><rect x="420" y="180" width="230" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="440" y="220" font-size="28" fill="#26372f" text-anchor="start">每块展平</text><text x="440" y="262" font-size="22" fill="#26372f" text-anchor="start">16×16×3</text><text x="440" y="294" font-size="22" fill="#26372f" text-anchor="start">768个输入值</text><line x1="660" y1="280" x2="725" y2="280" stroke="#26372f" stroke-width="3"/><path d="M 714 273 L 725 280 L 714 287" fill="none" stroke="#26372f" stroke-width="3"/><rect x="750" y="180" width="380" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="770" y="220" font-size="28" fill="#26372f" text-anchor="start">共享权重W：768×D</text><text x="770" y="262" font-size="22" fill="#26372f" text-anchor="start">每块输出D维向量</text><text x="770" y="294" font-size="22" fill="#26372f" text-anchor="start">输出shape：196×D</text><text x="70" y="500" font-size="27" fill="#26372f" text-anchor="start">块1   →   块2   →   块3   →   块4   →   …</text><text x="70" y="555" font-size="24" fill="#26372f" text-anchor="start">序列次序与空间位置表示需要明确；连续视觉token不必先变成文字。</text></g></svg>
