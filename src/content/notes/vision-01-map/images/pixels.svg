<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">像素位置、RGB通道与数值</title><desc id="desc">2×2图有4个位置，每位置3个通道，共12个标量。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">像素位置、RGB通道与数值</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">2×2图有4个位置，每位置3个通道，共12个标量。</text><rect x="70" y="170" width="117" height="117" rx="4" fill="#f4b8ae" stroke="#89998f" stroke-width="2"/><text x="128" y="238" font-size="23" fill="#26372f" text-anchor="middle">红</text><rect x="190" y="170" width="117" height="117" rx="4" fill="#b9dcb5" stroke="#89998f" stroke-width="2"/><text x="248" y="238" font-size="23" fill="#26372f" text-anchor="middle">绿</text><rect x="70" y="290" width="117" height="117" rx="4" fill="#b8cbed" stroke="#89998f" stroke-width="2"/><text x="128" y="358" font-size="23" fill="#26372f" text-anchor="middle">蓝</text><rect x="190" y="290" width="117" height="117" rx="4" fill="#fff" stroke="#89998f" stroke-width="2"/><text x="248" y="358" font-size="23" fill="#26372f" text-anchor="middle">白</text><line x1="330" y1="270" x2="420" y2="270" stroke="#26372f" stroke-width="3"/><path d="M 409 263 L 420 270 L 409 277" fill="none" stroke="#26372f" stroke-width="3"/><rect x="460" y="150" width="205" height="250" rx="13" fill="#f4d4cb" stroke="#95a99b" stroke-width="2"/><text x="480" y="190" font-size="28" fill="#26372f" text-anchor="start">R 红通道</text><text x="480" y="232" font-size="22" fill="#26372f" text-anchor="start">255       0</text><text x="480" y="264" font-size="22" fill="#26372f" text-anchor="start">  0     255</text><rect x="700" y="150" width="205" height="250" rx="13" fill="#d9ebd6" stroke="#95a99b" stroke-width="2"/><text x="720" y="190" font-size="28" fill="#26372f" text-anchor="start">G 绿通道</text><text x="720" y="232" font-size="22" fill="#26372f" text-anchor="start">  0     255</text><text x="720" y="264" font-size="22" fill="#26372f" text-anchor="start">  0     255</text><rect x="940" y="150" width="205" height="250" rx="13" fill="#d9e5f3" stroke="#95a99b" stroke-width="2"/><text x="960" y="190" font-size="28" fill="#26372f" text-anchor="start">B 蓝通道</text><text x="960" y="232" font-size="22" fill="#26372f" text-anchor="start">  0       0</text><text x="960" y="264" font-size="22" fill="#26372f" text-anchor="start">255     255</text><text x="70" y="490" font-size="27" fill="#26372f" text-anchor="start">空间轴：H=2、W=2</text><text x="460" y="490" font-size="26" fill="#26372f" text-anchor="start">通道轴：C=3；RGB顺序必须与模型协议一致</text><text x="70" y="550" font-size="24" fill="#26372f" text-anchor="start">增加batch轴只是组织多张图，不把它们的空间内容混成一张图。</text></g></svg>
