<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">把感知、证据与推理分开诊断</title><desc id="desc">原图、替图、人工描述和工具结果是不同对照，不可忽略任务简化或答案泄露。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">把感知、证据与推理分开诊断</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">原图、替图、人工描述和工具结果是不同对照，不可忽略任务简化或答案泄露。</text><rect x="60" y="180" width="275" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="80" y="220" font-size="28" fill="#26372f" text-anchor="start">输入对照</text><text x="80" y="262" font-size="22" fill="#26372f" text-anchor="start">原图 / 反事实替图</text><text x="80" y="294" font-size="22" fill="#26372f" text-anchor="start">正确事实描述</text><text x="80" y="326" font-size="22" fill="#26372f" text-anchor="start">工具产生的证据</text><line x1="355" y1="280" x2="425" y2="280" stroke="#26372f" stroke-width="3"/><path d="M 414 273 L 425 280 L 414 287" fill="none" stroke="#26372f" stroke-width="3"/><rect x="450" y="180" width="275" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="470" y="220" font-size="28" fill="#26372f" text-anchor="start">中间过程</text><text x="470" y="262" font-size="22" fill="#26372f" text-anchor="start">是否看清？</text><text x="470" y="294" font-size="22" fill="#26372f" text-anchor="start">是否对应正确区域？</text><text x="470" y="326" font-size="22" fill="#26372f" text-anchor="start">是否使用相关证据？</text><line x1="745" y1="280" x2="815" y2="280" stroke="#26372f" stroke-width="3"/><path d="M 804 273 L 815 280 L 804 287" fill="none" stroke="#26372f" stroke-width="3"/><rect x="840" y="180" width="290" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="860" y="220" font-size="28" fill="#26372f" text-anchor="start">输出评价</text><text x="860" y="262" font-size="22" fill="#26372f" text-anchor="start">事实正确性</text><text x="860" y="294" font-size="22" fill="#26372f" text-anchor="start">推理正确性</text><text x="860" y="326" font-size="22" fill="#26372f" text-anchor="start">成本与不确定性</text><text x="60" y="480" font-size="23" fill="#26372f" text-anchor="start">描述答对、原图答错：提示视觉路径可能有问题，但尚不能唯一归因于encoder。</text><text x="60" y="540" font-size="25" fill="#26372f" text-anchor="start">控制问题、样本、预算、描述信息量；报告失败类型与统计波动。</text></g></svg>
