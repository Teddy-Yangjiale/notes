<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">DINO：两类视图、两条参数路径、一个跨视图目标</title><desc id="desc">teacher只读两个全局视图；student读全部视图；同索引全局pair排除。</desc><rect width="1200" height="770" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DINO：两类视图、两条参数路径、一个跨视图目标</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">teacher只读两个全局视图；student读全部视图；同索引全局pair排除。</text><rect x="45" y="165" width="240" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="205" font-size="28" fill="#26372f" text-anchor="start">同一原图</text><text x="65" y="247" font-size="22" fill="#26372f" text-anchor="start">g₀ / g₁：224全局</text><text x="65" y="279" font-size="22" fill="#26372f" text-anchor="start">l₀…l₇：96局部</text><text x="65" y="311" font-size="22" fill="#26372f" text-anchor="start">随机外观增强</text><line x1="300" y1="220" x2="365" y2="220" stroke="#26372f" stroke-width="3"/><path d="M 354 213 L 365 220 L 354 227" fill="none" stroke="#26372f" stroke-width="3"/><rect x="390" y="135" width="300" height="225" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="410" y="175" font-size="28" fill="#26372f" text-anchor="start">student θs</text><text x="410" y="217" font-size="22" fill="#26372f" text-anchor="start">读取10个视图</text><text x="410" y="249" font-size="22" fill="#26372f" text-anchor="start">梯度下降更新</text><text x="410" y="281" font-size="22" fill="#26372f" text-anchor="start">产生p₀…p₉</text><line x1="300" y1="420" x2="365" y2="420" stroke="#26372f" stroke-width="3"/><path d="M 354 413 L 365 420 L 354 427" fill="none" stroke="#26372f" stroke-width="3"/><rect x="390" y="390" width="300" height="185" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="410" y="430" font-size="28" fill="#26372f" text-anchor="start">teacher θt</text><text x="410" y="472" font-size="22" fill="#26372f" text-anchor="start">只读取g₀ / g₁</text><text x="410" y="504" font-size="22" fill="#26372f" text-anchor="start">target停止梯度</text><text x="410" y="536" font-size="22" fill="#26372f" text-anchor="start">产生q₀ / q₁</text><rect x="760" y="155" width="385" height="205" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="780" y="195" font-size="28" fill="#26372f" text-anchor="start">18个合法交叉熵项</text><text x="780" y="237" font-size="22" fill="#26372f" text-anchor="start">q₀→p₁,p₂…p₉</text><text x="780" y="269" font-size="22" fill="#26372f" text-anchor="start">q₁→p₀,p₂…p₉</text><text x="780" y="301" font-size="22" fill="#26372f" text-anchor="start">排除q₀→p₀、q₁→p₁</text><rect x="760" y="430" width="385" height="150" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="780" y="470" font-size="28" fill="#26372f" text-anchor="start">状态更新</text><text x="780" y="512" font-size="22" fill="#26372f" text-anchor="start">optimizer先更新θs</text><text x="780" y="544" font-size="22" fill="#26372f" text-anchor="start">再做θt ← mθt+(1−m)θs</text><text x="45" y="690" font-size="24" fill="#26372f" text-anchor="start">多裁剪沿batch分别前向，不把十个crop拼成一个attention序列。</text></g></svg>
