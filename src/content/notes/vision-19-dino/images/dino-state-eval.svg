<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">DINO训练状态与冻结评价：对象不能串线</title><desc id="desc">上半是每步可变状态；下半是训练完成后冻结特征的独立协议。</desc><rect width="1200" height="830" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DINO训练状态与冻结评价：对象不能串线</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">上半是每步可变状态；下半是训练完成后冻结特征的独立协议。</text><rect x="45" y="155" width="245" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="195" font-size="28" fill="#26372f" text-anchor="start">student</text><text x="65" y="237" font-size="22" fill="#26372f" text-anchor="start">10视图forward</text><text x="65" y="269" font-size="22" fill="#26372f" text-anchor="start">loss反传</text><text x="65" y="301" font-size="22" fill="#26372f" text-anchor="start">optimizer / lr / wd</text><line x1="305" y1="250" x2="365" y2="250" stroke="#26372f" stroke-width="3"/><path d="M 354 243 L 365 250 L 354 257" fill="none" stroke="#26372f" stroke-width="3"/><rect x="385" y="155" width="245" height="190" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="405" y="195" font-size="28" fill="#26372f" text-anchor="start">teacher</text><text x="405" y="237" font-size="22" fill="#26372f" text-anchor="start">2全局forward</text><text x="405" y="269" font-size="22" fill="#26372f" text-anchor="start">停止梯度</text><text x="405" y="301" font-size="22" fill="#26372f" text-anchor="start">参数EMA m(t)</text><line x1="645" y1="250" x2="705" y2="250" stroke="#26372f" stroke-width="3"/><path d="M 694 243 L 705 250 L 694 257" fill="none" stroke="#26372f" stroke-width="3"/><rect x="725" y="155" width="420" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="745" y="195" font-size="28" fill="#26372f" text-anchor="start">target状态</text><text x="745" y="237" font-size="22" fill="#26372f" text-anchor="start">center EMA：raw teacher logits</text><text x="745" y="269" font-size="22" fill="#26372f" text-anchor="start">teacher softmax：center + τt</text><text x="745" y="301" font-size="22" fill="#26372f" text-anchor="start">18项跨视图CE</text><line x1="45" y1="410" x2="1145" y2="410" stroke="#96a69b" stroke-width="3" stroke-dasharray="9 7"/><rect x="45" y="485" width="330" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="525" font-size="28" fill="#26372f" text-anchor="start">冻结CLS feature</text><text x="65" y="567" font-size="22" fill="#26372f" text-anchor="start">L2 normalize</text><text x="65" y="599" font-size="22" fill="#26372f" text-anchor="start">weighted k-NN / linear probe</text><text x="65" y="631" font-size="22" fill="#26372f" text-anchor="start">评价使用类别标签</text><rect x="435" y="485" width="330" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="525" font-size="28" fill="#26372f" text-anchor="start">冻结patch feature</text><text x="455" y="567" font-size="22" fill="#26372f" text-anchor="start">视频标签传播 / 稠密匹配</text><text x="455" y="599" font-size="22" fill="#26372f" text-anchor="start">DAVIS使用首帧mask</text><rect x="825" y="485" width="320" height="170" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="525" font-size="28" fill="#26372f" text-anchor="start">最后层attention</text><text x="845" y="567" font-size="22" fill="#26372f" text-anchor="start">固定head与阈值规则</text><text x="845" y="599" font-size="22" fill="#26372f" text-anchor="start">定性图 + mask指标</text><text x="845" y="631" font-size="22" fill="#26372f" text-anchor="start">展示随机样本与失败例</text><text x="45" y="750" font-size="24" fill="#26372f" text-anchor="start">checkpoint续训需保存student、teacher、optimizer、scheduler位置、scaler与center。</text></g></svg>
