<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">Centering与sharpening：相反倾向共同约束teacher目标</title><desc id="desc">三种分布都是K=4示意；箭头表示动力学倾向，不是一步后的精确数值。</desc><rect width="1200" height="815" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Centering与sharpening：相反倾向共同约束teacher目标</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">三种分布都是K=4示意；箭头表示动力学倾向，不是一步后的精确数值。</text><rect x="55" y="165" width="310" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="205" font-size="28" fill="#26372f" text-anchor="start">单坐标占优</text><text x="75" y="247" font-size="22" fill="#26372f" text-anchor="start">q≈[1,0,0,0]</text><text x="75" y="279" font-size="22" fill="#26372f" text-anchor="start">所有输入同一输出</text><text x="75" y="311" font-size="22" fill="#26372f" text-anchor="start">样本entropy≈0</text><line x1="375" y1="270" x2="455" y2="270" stroke="#3b7e57" stroke-width="3"/><path d="M 444 263 L 455 270 L 444 277" fill="none" stroke="#3b7e57" stroke-width="3"/><rect x="470" y="165" width="310" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="490" y="205" font-size="28" fill="#26372f" text-anchor="start">centering</text><text x="490" y="247" font-size="22" fill="#26372f" text-anchor="start">减历史逐坐标均值</text><text x="490" y="279" font-size="22" fill="#26372f" text-anchor="start">压低长期占优槽位</text><text x="490" y="311" font-size="22" fill="#26372f" text-anchor="start">单独使用倾向均匀</text><line x1="790" y1="270" x2="870" y2="270" stroke="#a34435" stroke-width="3"/><path d="M 859 263 L 870 270 L 859 277" fill="none" stroke="#a34435" stroke-width="3"/><rect x="885" y="165" width="260" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="905" y="205" font-size="28" fill="#26372f" text-anchor="start">均匀坍塌</text><text x="905" y="247" font-size="22" fill="#26372f" text-anchor="start">q≈[¼,¼,¼,¼]</text><text x="905" y="279" font-size="22" fill="#26372f" text-anchor="start">所有输入无区别</text><text x="905" y="311" font-size="22" fill="#26372f" text-anchor="start">entropy=log4</text><rect x="260" y="480" width="680" height="150" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="280" y="520" font-size="28" fill="#26372f" text-anchor="start">低温sharpening从均匀方向拉回尖锐目标</text><text x="280" y="562" font-size="22" fill="#26372f" text-anchor="start">q = softmax((z−c)/τt)；低τt放大已有logit差。</text><text x="280" y="594" font-size="22" fill="#26372f" text-anchor="start">配合momentum teacher与多裁剪；不构成任意设置下的收敛证明。</text><text x="55" y="735" font-size="24" fill="#26372f" text-anchor="start">诊断需同时看单样本entropy、batch边缘分布与样本间差异。</text></g></svg>
