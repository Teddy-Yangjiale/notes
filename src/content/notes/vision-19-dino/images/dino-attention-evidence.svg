<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">同一DINO模型的两种空间证据接口</title><desc id="desc">可视化attention与DAVIS标签传播读取不同tensor、使用不同监督信息。</desc><rect width="1200" height="815" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">同一DINO模型的两种空间证据接口</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">可视化attention与DAVIS标签传播读取不同tensor、使用不同监督信息。</text><rect x="55" y="160" width="300" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="200" font-size="28" fill="#26372f" text-anchor="start">CLS attention</text><text x="75" y="242" font-size="22" fill="#26372f" text-anchor="start">最后层：CLS query→patch keys</text><text x="75" y="274" font-size="22" fill="#26372f" text-anchor="start">按累计质量阈值成mask</text><text x="75" y="306" font-size="22" fill="#26372f" text-anchor="start">无需像素真值即可画图</text><line x1="370" y1="255" x2="445" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 434 248 L 445 255 L 434 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="470" y="160" width="300" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="490" y="200" font-size="28" fill="#26372f" text-anchor="start">定性 / mask评价</text><text x="490" y="242" font-size="22" fill="#26372f" text-anchor="start">可观察前景样结构</text><text x="490" y="274" font-size="22" fill="#26372f" text-anchor="start">插值不增加patch分辨率</text><text x="490" y="306" font-size="22" fill="#26372f" text-anchor="start">attention不等同因果贡献</text><rect x="55" y="445" width="300" height="190" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="485" font-size="28" fill="#26372f" text-anchor="start">patch features</text><text x="75" y="527" font-size="22" fill="#26372f" text-anchor="start">每个patch的D维表示</text><text x="75" y="559" font-size="22" fill="#26372f" text-anchor="start">跨帧相似度与局部邻域</text><text x="75" y="591" font-size="22" fill="#26372f" text-anchor="start">不是CLS attention数值</text><line x1="370" y1="540" x2="445" y2="540" stroke="#26372f" stroke-width="3"/><path d="M 434 533 L 445 540 L 434 547" fill="none" stroke="#26372f" stroke-width="3"/><rect x="470" y="445" width="300" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="490" y="485" font-size="28" fill="#26372f" text-anchor="start">DAVIS标签传播</text><text x="490" y="527" font-size="22" fill="#26372f" text-anchor="start">使用首帧ground-truth mask</text><text x="490" y="559" font-size="22" fill="#26372f" text-anchor="start">最近邻传播到后续帧</text><text x="490" y="591" font-size="22" fill="#26372f" text-anchor="start">报告J / F等定量指标</text><rect x="835" y="250" width="310" height="270" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="855" y="290" font-size="28" fill="#26372f" text-anchor="start">结论边界</text><text x="855" y="332" font-size="22" fill="#26372f" text-anchor="start">“像分割”是现象</text><text x="855" y="364" font-size="22" fill="#26372f" text-anchor="start">DAVIS分数属于传播协议</text><text x="855" y="396" font-size="22" fill="#26372f" text-anchor="start">预训练无标签</text><text x="855" y="428" font-size="22" fill="#26372f" text-anchor="start">不等于下游评价无标签</text><text x="55" y="735" font-size="24" fill="#26372f" text-anchor="start">先标出tensor与外部信息，再决定证据支持哪一个命题。</text></g></svg>
