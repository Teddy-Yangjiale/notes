<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">BEiT：同一训练图的输入patch与离散目标</title><desc id="desc">主干读取像素patch；固定tokenizer从未遮原图生成同坐标的类别ID。</desc><rect width="1200" height="780" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">BEiT：同一训练图的输入patch与离散目标</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">主干读取像素patch；固定tokenizer从未遮原图生成同坐标的类别ID。</text><rect x="55" y="170" width="300" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">训练图 x</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">224×224×3</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">共同crop / flip / color流程</text><line x1="370" y1="220" x2="450" y2="220" stroke="#26372f" stroke-width="3"/><path d="M 439 213 L 450 220 L 439 227" fill="none" stroke="#26372f" stroke-width="3"/><rect x="475" y="150" width="300" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="495" y="190" font-size="28" fill="#26372f" text-anchor="start">主干输入路径</text><text x="495" y="232" font-size="22" fill="#26372f" text-anchor="start">14×14个16×16 patch</text><text x="495" y="264" font-size="22" fill="#26372f" text-anchor="start">部分embedding换成[MASK]</text><text x="495" y="296" font-size="22" fill="#26372f" text-anchor="start">完整长度送入Transformer</text><line x1="370" y1="350" x2="450" y2="350" stroke="#26372f" stroke-width="3"/><path d="M 439 343 L 450 350 L 439 357" fill="none" stroke="#26372f" stroke-width="3"/><rect x="475" y="385" width="300" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="495" y="425" font-size="28" fill="#26372f" text-anchor="start">固定tokenizer路径</text><text x="495" y="467" font-size="22" fill="#26372f" text-anchor="start">原内容 → 14×14 token ID</text><text x="495" y="499" font-size="22" fill="#26372f" text-anchor="start">K = 8192；MIM不更新tokenizer</text><text x="495" y="531" font-size="22" fill="#26372f" text-anchor="start">只选择masked坐标作为标签</text><rect x="835" y="245" width="310" height="250" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="855" y="285" font-size="28" fill="#26372f" text-anchor="start">位置i必须对齐</text><text x="855" y="327" font-size="22" fill="#26372f" text-anchor="start">hidden hᵢ → K类logit</text><text x="855" y="359" font-size="22" fill="#26372f" text-anchor="start">target zᵢ来自同一网格</text><text x="855" y="391" font-size="22" fill="#26372f" text-anchor="start">CE只对i∈M取平均</text><text x="855" y="423" font-size="22" fill="#26372f" text-anchor="start">下游丢弃token分类head</text><text x="55" y="700" font-size="24" fill="#26372f" text-anchor="start">两个路径shape对齐仍可能转置或crop错位；人工坐标图应成为单元测试。</text></g></svg>
