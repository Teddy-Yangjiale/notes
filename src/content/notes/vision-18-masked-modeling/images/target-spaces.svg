<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">三类重建目标：单位、信息与损失不可直接比较</title><desc id="desc">相同masked坐标可接不同监督头；数值更小不表示表征更好。</desc><rect width="1200" height="840" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">三类重建目标：单位、信息与损失不可直接比较</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">相同masked坐标可接不同监督头；数值更小不表示表征更好。</text><rect x="55" y="175" width="335" height="250" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">离散视觉token</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">目标：整数ID，K类</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">loss：交叉熵</text><text x="75" y="321" font-size="22" fill="#26372f" text-anchor="start">依赖tokenizer与码本</text><text x="75" y="353" font-size="22" fill="#26372f" text-anchor="start">可过滤/继承其偏差</text><rect x="435" y="175" width="335" height="250" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="215" font-size="28" fill="#26372f" text-anchor="start">raw patch像素</text><text x="455" y="257" font-size="22" fill="#26372f" text-anchor="start">目标：Q个当前tensor值</text><text x="455" y="289" font-size="22" fill="#26372f" text-anchor="start">loss：逐元素MSE</text><text x="455" y="321" font-size="22" fill="#26372f" text-anchor="start">保留亮度/对比度尺度</text><text x="455" y="353" font-size="22" fill="#26372f" text-anchor="start">无需额外教师</text><rect x="815" y="175" width="330" height="250" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="215" font-size="28" fill="#26372f" text-anchor="start">patch-normalized像素</text><text x="835" y="257" font-size="22" fill="#26372f" text-anchor="start">每patch减均值/除std</text><text x="835" y="289" font-size="22" fill="#26372f" text-anchor="start">loss仍为Q维MSE</text><text x="835" y="321" font-size="22" fill="#26372f" text-anchor="start">常数patch目标为0</text><text x="835" y="353" font-size="22" fill="#26372f" text-anchor="start">variance政策要固定</text><rect x="55" y="520" width="1090" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="560" font-size="28" fill="#26372f" text-anchor="start">公平证据来自对齐下游与预算</text><text x="75" y="602" font-size="22" fill="#26372f" text-anchor="start">CE随K/entropy，MSE随像素scale/Q；预训练loss绝对值不能横向排名。</text><text x="75" y="634" font-size="22" fill="#26372f" text-anchor="start">同时报告额外tokenizer数据与计算、mask政策、decoder和迁移协议。</text><text x="55" y="760" font-size="24" fill="#26372f" text-anchor="start">目标空间、encoder可见内容、预测模块与loss位置共同定义方法。</text></g></svg>
