<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">MAE：随机排列选可见项，再用逆排列回原网格</title><desc id="desc">例中8项仅保留原位置6和3；restore满足restore[shuffle[j]]=j。</desc><rect width="1200" height="780" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">MAE：随机排列选可见项，再用逆排列回原网格</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">例中8项仅保留原位置6和3；restore满足restore[shuffle[j]]=j。</text><rect x="55" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="100.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">A</text><rect x="150" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="195.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">B</text><rect x="245" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="290.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">C</text><rect x="340" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="385.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">D</text><rect x="435" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="480.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">E</text><rect x="530" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="575.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">F</text><rect x="625" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="670.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">G</text><rect x="720" y="165" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="765.5" y="220.5" font-size="23" fill="#26372f" text-anchor="middle">H</text><text x="55" y="305" font-size="23" fill="#26372f" text-anchor="start">原位置：0  1  2  3  4  5  6  7</text><line x1="405" y1="335" x2="405" y2="390" stroke="#26372f" stroke-width="3"/><path d="M 394 383 L 405 390 L 394 397" fill="none" stroke="#26372f" stroke-width="3"/><rect x="55" y="420" width="92" height="92" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="100.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">G</text><rect x="150" y="420" width="92" height="92" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="195.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">D</text><rect x="245" y="420" width="92" height="92" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="290.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">B</text><rect x="340" y="420" width="92" height="92" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="385.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">A</text><rect x="435" y="420" width="92" height="92" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="480.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">F</text><rect x="530" y="420" width="92" height="92" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="575.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">H</text><rect x="625" y="420" width="92" height="92" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="670.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">E</text><rect x="720" y="420" width="92" height="92" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="765.5" y="475.5" font-size="23" fill="#26372f" text-anchor="middle">C</text><rect x="845" y="165" width="300" height="155" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="865" y="205" font-size="28" fill="#26372f" text-anchor="start">shuffle</text><text x="865" y="247" font-size="22" fill="#26372f" text-anchor="start">[6,3,1,0,5,7,4,2]</text><text x="865" y="279" font-size="22" fill="#26372f" text-anchor="start">前2项送入encoder</text><rect x="845" y="370" width="300" height="175" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="865" y="410" font-size="28" fill="#26372f" text-anchor="start">restore</text><text x="865" y="452" font-size="22" fill="#26372f" text-anchor="start">[3,2,7,1,6,4,0,5]</text><text x="865" y="484" font-size="22" fill="#26372f" text-anchor="start">补6个MASK后gather</text><text x="865" y="516" font-size="22" fill="#26372f" text-anchor="start">恢复到A…H原坐标</text><text x="55" y="610" font-size="25" fill="#26372f" text-anchor="start">decoder原顺序：MASK  MASK  MASK  D  MASK  MASK  G  MASK</text><text x="55" y="705" font-size="24" fill="#26372f" text-anchor="start">encoder位置编码随可见token同行；inverse不包含CLS。</text></g></svg>
