<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc"><title id="title">MAE非对称计算：重型encoder稀疏，轻decoder全长</title><desc id="desc">224/P16、mask75%示意；patch长度不含CLS，实际两侧各再加一个CLS。</desc><rect width="1200" height="825" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">MAE非对称计算：重型encoder稀疏，轻decoder全长</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">224/P16、mask75%示意；patch长度不含CLS，实际两侧各再加一个CLS。</text><rect x="55" y="175" width="285" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">196个patch</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">随机保留49，删除147</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">先添加原坐标位置编码</text><line x1="355" y1="275" x2="415" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 404 268 L 415 275 L 404 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="435" y="155" width="300" height="250" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="195" font-size="28" fill="#26372f" text-anchor="start">重型ViT encoder</text><text x="455" y="237" font-size="22" fill="#26372f" text-anchor="start">只处理49个可见patch</text><text x="455" y="269" font-size="22" fill="#26372f" text-anchor="start">无mask token</text><text x="455" y="301" font-size="22" fill="#26372f" text-anchor="start">Dₑ大、迁移时保留</text><line x1="750" y1="275" x2="810" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 799 268 L 810 275 L 799 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="835" y="155" width="310" height="250" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="855" y="195" font-size="28" fill="#26372f" text-anchor="start">轻量decoder</text><text x="855" y="237" font-size="22" fill="#26372f" text-anchor="start">投影到D_d，补147 MASK</text><text x="855" y="269" font-size="22" fill="#26372f" text-anchor="start">inverse恢复196位置</text><text x="855" y="301" font-size="22" fill="#26372f" text-anchor="start">全序列预测每patch Q值</text><rect x="55" y="500" width="1090" height="155" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="540" font-size="28" fill="#26372f" text-anchor="start">attention矩阵项与整block成本要分开</text><text x="75" y="582" font-size="22" fill="#26372f" text-anchor="start">49² / 196² = 1/16；但QKV/MLP的D²项约按49/196=1/4缩放。</text><text x="75" y="614" font-size="22" fill="#26372f" text-anchor="start">decoder、反向与硬件kernel另计；理论项数不是实测吞吐。</text><text x="55" y="745" font-size="24" fill="#26372f" text-anchor="start">预训练后丢decoder，但decoder的Jacobian已决定encoder收到的重建梯度。</text></g></svg>
