<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">mask定义允许信息：看清query行与key列</title><desc id="desc">绿格允许、灰格屏蔽。因果关系按真实时间定义，不能仅靠局部矩阵行号。</desc><rect width="1200" height="780" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">mask定义允许信息：看清query行与key列</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">绿格允许、灰格屏蔽。因果关系按真实时间定义，不能仅靠局部矩阵行号。</text><text x="55" y="160" font-size="28" fill="#26372f" text-anchor="start">双向有效位置</text><text x="450" y="160" font-size="28" fill="#26372f" text-anchor="start">方形因果（含对角）</text><text x="845" y="160" font-size="28" fill="#26372f" text-anchor="start">padding key</text><rect x="55" y="210" width="62" height="62" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="85.5" y="250.5" font-size="23" fill="#26372f" text-anchor="middle">✓</text><rect x="120" y="210" width="62" height="62" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="150.5" y="250.5" font-size="23" fill="#26372f" text-anchor="middle">✓</text><rect x="185" y="210" width="62" height="62" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="215.5" y="250.5" font-size="23" fill="#26372f" text-anchor="middle">✓</text><rect x="250" y="210" width="62" height="62" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="280.5" y="250.5" font-size="23" fill="#26372f" text-anchor="middle">✓</text><rect x="55" y="275" width="62" height="62" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="85.5" y="315.5" font-size="23" fill="#26372f" text-anchor="middle">✓</text><rect x="120" y="275" width="62" height="62" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="150.5" y="315.5" font-size="23" fill="#26372f" text-anchor="middle">✓</text><rect x="185" y="275" width="62" height="62" rx="