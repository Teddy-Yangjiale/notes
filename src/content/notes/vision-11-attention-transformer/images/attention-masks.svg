5a99b" stroke-width="2"/><text x="75" y="630" font-size="28" fill="#26372f" text-anchor="start">缓存例：4个旧key + 1个新key，只有1条新query</text><text x="75" y="672" font-size="22" fill="#26372f" text-anchor="start">query全局时间4，key时间0—4 → 五列都允许。1×5不能机械左上三角。</text></g></svg>
