<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">Attention：先匹配，再读取；两个求和轴不同</title><desc id="desc">行是位置，列是通道。查询数决定输出位置数；key与value的候选位置必须对应。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Attention：先匹配，再读取；两个求和轴不同</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">行是位置，列是通道。查询数决定输出位置数；key与value的候选位置必须对应。</text><rect x="55" y="160" width="320" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="200" font-size="28" fill="#26372f" text-anchor="start">查询输入 Xq</text><text x="75" y="242" font-size="22" fill="#26372f" text-anchor="start">Nq×Dq → Q：Nq×dk</text><text x="75" y="274" font-size="22" fill="#26372f" text-anchor="start">用WQ生成查询条件</text><rect x="440" y="160" width="320" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="460" y="200" font-size="28" fill="#26372f" text-anchor="start">记忆输入 Xm</text><text x="460" y="242" font-size="22" fill="#26372f" text-anchor="start">Nk×Dm → K：Nk×dk</text><text x="460" y="274" font-size="22" fill="#26372f" text-anchor="start">用WK生成匹配特征</text><rect x="825" y="160" width="320" height="160" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="200" font-size="28" fill="#26372f" text-anchor="start">同一记忆 Xm</text><text x="845" y="242" font-size="22" fill="#26372f" text-anchor="start">Nk×Dm → V：Nk×dv</text><text x="845" y="274" font-size="22" fill="#26372f" text-anchor="start">用WV生成读取内容</text><rect x="55" y="415" width="320" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="455" font-size="28" fill="#26372f" text-anchor="start">QKᵀ / √dk</text><text x="75" y="497" font-size="22" fill="#26372f" text-anchor="start">沿dk通道做点积</text><text x="75" y="529" font-size="22" fill="#26372f" text-anchor="start">输出Nq×Nk位置对</text><line x1="390" y1="500" x2="425" y2="500" stroke="#26372f" stroke-width="3"/><path d="M 414 493 L 425 500 L 414 507" fill="none" stroke="#26372f" stroke-width="3"/><rect x="440" y="415" width="320" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="460" y="455" font-size="28" fill="#26372f" text-anchor="start">mask + 行softmax</text><text x="460" y="497" font-size="22" fill="#26372f" text-anchor="start">沿Nk候选轴归一化</text><text x="460" y="529" font-size="22" fill="#26372f" text-anchor="start">每query分配读取权重</text><line x1="775" y1="500" x2="810" y2="500" stroke="#26372f" stroke-width="3"/><path d="M 799 493 L 810 500 L 799 507" fill="none" stroke="#26372f" stroke-width="3"/><rect x="825" y="415" width="320" height="180" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="455" font-size="28" fill="#26372f" text-anchor="start">A V</text><text x="845" y="497" font-size="22" fill="#26372f" text-anchor="start">沿Nk候选轴求和</text><text x="845" y="529" font-size="22" fill="#26372f" text-anchor="start">输出Nq×dv</text><line x1="215" y1="335" x2="215" y2="400" stroke="#26372f" stroke-width="3"/><line x1="600" y1="335" x2="600" y2="365" stroke="#26372f" stroke-width="3"/><line x1="215" y1="365" x2="600" y2="365" stroke="#26372f" stroke-width="3"/><line x1="985" y1="335" x2="985" y2="400" stroke="#26372f" stroke-width="3"/><text x="55" y="690" font-size="26" fill="#26372f" text-anchor="start">Q/K决定从哪里读；V决定读出什么；A不是最终任务类别概率。</text><text x="55" y="748" font-size="25" fill="#26372f" text-anchor="start">缩放、mask、softmax、value汇聚和输出投影各有独立计算角色。</text></g></svg>
