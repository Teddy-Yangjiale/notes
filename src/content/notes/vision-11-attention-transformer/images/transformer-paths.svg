<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="title desc"><title id="title">残差与来源：Pre/Post-LN、编码器与解码器</title><desc id="desc">F代表MHA或FFN；归一化位置改变梯度路径，cross的输出属于目标query位置。</desc><rect width="1200" height="875" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">残差与来源：Pre/Post-LN、编码器与解码器</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">F代表MHA或FFN；归一化位置改变梯度路径，cross的输出属于目标query位置。</text><rect x="55" y="160" width="510" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="200" font-size="28" fill="#26372f" text-anchor="start">Post-LN：LN(x + F(x))</text><text x="75" y="242" font-size="22" fill="#26372f" text-anchor="start">分支输出相加后，直达路径仍经过LN</text><text x="75" y="274" font-size="22" fill="#26372f" text-anchor="start">F=0时输出LN(x)</text><rect x="635" y="160" width="510" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="655" y="200" font-size="28" fill="#26372f" text-anchor="start">Pre-LN：x + F(LN(x))</text><text x="655" y="242" font-size="22" fill="#26372f" text-anchor="start">分支读归一化输入；直达x路径保留</text><text x="655" y="274" font-size="22" fill="#26372f" text-anchor="start">F=0时输出x</text><rect x="55" y="415" width="310" height="240" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="455" font-size="28" fill="#26372f" text-anchor="start">编码器</text><text x="75" y="497" font-size="22" fill="#26372f" text-anchor="start">源输入 → 源状态</text><text x="75" y="529" font-size="22" fill="#26372f" text-anchor="start">双向self-attention</text><text x="75" y="561" font-size="22" fill="#26372f" text-anchor="start">逐位置FFN</text><rect x="445" y="415" width="310" height="240" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="465" y="455" font-size="28" fill="#26372f" text-anchor="start">解码器self</text><text x="465" y="497" font-size="22" fill="#26372f" text-anchor="start">右移目标 → 目标状态</text><text x="465" y="529" font-size="22" fill="#26372f" text-anchor="start">因果self-attention</text><text x="465" y="561" font-size="22" fill="#26372f" text-anchor="start">只读取允许的前缀</text><rect x="835" y="415" width="310" height="240" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="855" y="455" font-size="28" fill="#26372f" text-anchor="start">解码器cross</text><text x="855" y="497" font-size="22" fill="#26372f" text-anchor="start">Q：目标状态</text><text x="855" y="529" font-size="22" fill="#26372f" text-anchor="start">K/V：编码器记忆</text><text x="855" y="561" font-size="22" fill="#26372f" text-anchor="start">输出仍是目标位置</text><line x1="770" y1="530" x2="820" y2="530" stroke="#26372f" stroke-width="3"/><path d="M 809 523 L 820 530 L 809 537" fill="none" stroke="#26372f" stroke-width="3"/><line x1="210" y1="675" x2="210" y2="720" stroke="#26372f" stroke-width="3"/><line x1="210" y1="720" x2="990" y2="720" stroke="#26372f" stroke-width="3"/><line x1="990" y1="720" x2="990" y2="675" stroke="#26372f" stroke-width="3"/><text x="330" y="758" font-size="25" fill="#26372f" text-anchor="start">编码器输出作为cross的记忆，不与目标行直接相加</text><text x="55" y="815" font-size="24" fill="#26372f" text-anchor="start">完整decoder常有self → cross → FFN；decoder-only可以没有独立cross。</text></g></svg>
