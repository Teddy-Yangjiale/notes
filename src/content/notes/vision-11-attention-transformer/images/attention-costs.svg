<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">三种账本：模型参数、位置对、历史K/V</title><desc id="desc">标准编码器M=4D的矩阵MAC：12ND² + 2N²D；参数与输入长度N无关。</desc><rect width="1200" height="750" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">三种账本：模型参数、位置对、历史K/V</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">标准编码器M=4D的矩阵MAC：12ND² + 2N²D；参数与输入长度N无关。</text><rect x="55" y="175" width="310" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">共享权重</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">Q/K/V/输出投影</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">FFN与归一化参数</text><text x="75" y="321" font-size="22" fill="#26372f" text-anchor="start">同权重用于各token</text><text x="75" y="353" font-size="22" fill="#26372f" text-anchor="start">总数不随N变</text><rect x="445" y="175" width="310" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="465" y="215" font-size="28" fill="#26372f" text-anchor="start">显式位置对A</text><text x="465" y="257" font-size="22" fill="#26372f" text-anchor="start">B×H×Nq×Nk</text><text x="465" y="289" font-size="22" fill="#26372f" text-anchor="start">self时随N平方</text><text x="465" y="321" font-size="22" fill="#26372f" text-anchor="start">一张A ≠ 全部显存</text><text x="465" y="353" font-size="22" fill="#26372f" text-anchor="start">内核可避免长期保存</text><rect x="835" y="175" width="310" height="220" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="855" y="215" font-size="28" fill="#26372f" text-anchor="start">KV cache</text><text x="855" y="257" font-size="22" fill="#26372f" text-anchor="start">每层旧K与旧V</text><text x="855" y="289" font-size="22" fill="#26372f" text-anchor="start">按缓存token数增长</text><text x="855" y="321" font-size="22" fill="#26372f" text-anchor="start">只在适用的信息图成立</text><text x="855" y="353" font-size="22" fill="#26372f" text-anchor="start">不是整张历史attention</text><text x="55" y="480" font-size="27" fill="#26372f" text-anchor="start">N → 2N：线性投影/FFN约×2；位置对核心约×4。</text><text x="55" y="540" font-size="26" fill="#26372f" text-anchor="start">图片边长×2、patch边长不变：token约×4，位置对约×16。</text><text x="55" y="600" font-size="25" fill="#26372f" text-anchor="start">单token增量读取n个key：核心约2nD MAC；仍需逐步生成。</text><text x="55" y="670" font-size="25" fill="#26372f" text-anchor="start">更少MAC、更多并行、更少外存读写与实测更快，是不同结论。</text></g></svg>
