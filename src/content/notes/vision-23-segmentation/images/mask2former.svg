<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">Mask2Former：query先预测mask，再用它限制下一层cross-attention</title><desc id="desc">pixel decoder提供多尺度空间feature；Transformer decoder产生区域集合。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Mask2Former：query先预测mask，再用它限制下一层cross-attention</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">pixel decoder提供多尺度空间feature；Transformer decoder产生区域集合。</text><rect x="45" y="135" width="285" height="245" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="175" font-size="28" fill="#26372f" text-anchor="start">Pixel decoder</text><text x="65" y="217" font-size="22" fill="#26372f" text-anchor="start">高/中/低分辨率feature</text><text x="65" y="249" font-size="22" fill="#26372f" text-anchor="start">per-pixel embedding</text><text x="65" y="281" font-size="22" fill="#26372f" text-anchor="start">多尺度轮流送入</text><line x1="345" y1="255" x2="410" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 399 248 L 410 255 L 399 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="435" y="105" width="330" height="305" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="145" font-size="28" fill="#26372f" text-anchor="start">Decoder layer l</text><text x="455" y="187" font-size="22" fill="#26372f" text-anchor="start">N个query cross-attend</text><text x="455" y="219" font-size="22" fill="#26372f" text-anchor="start">分类头 → C+1</text><text x="455" y="251" font-size="22" fill="#26372f" text-anchor="start">mask embedding · pixel embedding</text><text x="455" y="283" font-size="22" fill="#26372f" text-anchor="start">输出N张soft mask</text><line x1="780" y1="255" x2="845" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 834 248 L 845 255 L 834 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="870" y="135" width="275" height="245" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="890" y="175" font-size="28" fill="#26372f" text-anchor="start">Layer l+1</text><text x="890" y="217" font-size="22" fill="#26372f" text-anchor="start">上一层mask阈值化</text><text x="890" y="249" font-size="22" fill="#26372f" text-anchor="start">区域外加−∞</text><text x="890" y="281" font-size="22" fill="#26372f" text-anchor="start">区域内读取新feature</text><rect x="45" y="500" width="1100" height="150" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="540" font-size="28" fill="#26372f" text-anchor="start">训练与推理</text><text x="65" y="582" font-size="22" fill="#26372f" text-anchor="start">Hungarian matching：类别 + sampled BCE/Dice；各层aux loss。</text><text x="65" y="614" font-size="22" fill="#26372f" text-anchor="start">语义聚合、实例保留、全景竞争使用同一张量但不同解码规则。</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">若某query屏蔽全部位置，必须解除整行屏蔽，避免softmax NaN。</text></g></svg>
