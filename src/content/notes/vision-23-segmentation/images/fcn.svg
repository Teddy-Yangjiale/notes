<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">FCN：粗语义score与浅层位置score逐级融合</title><desc id="desc">FCN-32s只上采样最深层；16s/8s加入pool4/pool3的同类score。</desc><rect width="1200" height="790" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">FCN：粗语义score与浅层位置score逐级融合</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">FCN-32s只上采样最深层；16s/8s加入pool4/pool3的同类score。</text><rect x="45" y="155" width="260" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="65" y="195" font-size="28" fill="#26372f" text-anchor="start">深层score stride 32</text><text x="65" y="237" font-size="22" fill="#26372f" text-anchor="start">语义强、边界粗</text><text x="65" y="269" font-size="22" fill="#26372f" text-anchor="start">1×1 conv → C类</text><line x1="320" y1="260" x2="390" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 379 253 L 390 260 L 379 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="415" y="115" width="310" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="435" y="155" font-size="28" fill="#26372f" text-anchor="start">上采样2× + pool4</text><text x="435" y="197" font-size="22" fill="#26372f" text-anchor="start">先把pool4投影到C类</text><text x="435" y="229" font-size="22" fill="#26372f" text-anchor="start">坐标对齐后逐元素相加</text><rect x="415" y="355" width="310" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="435" y="395" font-size="28" fill="#26372f" text-anchor="start">再上采样2× + pool3</text><text x="435" y="437" font-size="22" fill="#26372f" text-anchor="start">得到stride 8 score</text><text x="435" y="469" font-size="22" fill="#26372f" text-anchor="start">仍为C个通道</text><line x1="740" y1="300" x2="815" y2="300" stroke="#26372f" stroke-width="3"/><path d="M 804 293 L 815 300 L 804 307" fill="none" stroke="#26372f" stroke-width="3"/><rect x="840" y="185" width="305" height="230" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="860" y="225" font-size="28" fill="#26372f" text-anchor="start">上采样8×到原图</text><text x="860" y="267" font-size="22" fill="#26372f" text-anchor="start">每像素C logits</text><text x="860" y="299" font-size="22" fill="#26372f" text-anchor="start">softmax/argmax</text><text x="860" y="331" font-size="22" fill="#26372f" text-anchor="start">输出H×W标签</text><text x="45" y="650" font-size="24" fill="#26372f" text-anchor="start">“相加”要求通道、尺寸和像素中心三者都对齐；拼接会改变通道数。</text><text x="45" y="705" font-size="24" fill="#26372f" text-anchor="start">插值恢复网格尺寸，浅层证据帮助恢复位置。</text></g></svg>
