<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">语义、实例与全景分割：同一图像的三种输出合同</title><desc id="desc">先确定像素是否要实例身份、是否要求完整且不重叠，再选择标签、损失与指标。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">语义、实例与全景分割：同一图像的三种输出合同</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">先确定像素是否要实例身份、是否要求完整且不重叠，再选择标签、损失与指标。</text><rect x="45" y="145" width="330" height="245" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">语义分割</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">每像素一个类别</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">两辆车共享car标签</text><text x="65" y="291" font-size="22" fill="#26372f" text-anchor="start">常用mIoU</text><rect x="435" y="145" width="330" height="245" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="185" font-size="28" fill="#26372f" text-anchor="start">实例分割</text><text x="455" y="227" font-size="22" fill="#26372f" text-anchor="start">每个thing独立mask</text><text x="455" y="259" font-size="22" fill="#26372f" text-anchor="start">同类实例ID不同</text><text x="455" y="291" font-size="22" fill="#26372f" text-anchor="start">常用mask AP</text><rect x="825" y="145" width="320" height="245" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="185" font-size="28" fill="#26372f" text-anchor="start">全景分割</text><text x="845" y="227" font-size="22" fill="#26372f" text-anchor="start">thing实例 + stuff区域</text><text x="845" y="259" font-size="22" fill="#26372f" text-anchor="start">全图唯一、不重叠</text><text x="845" y="291" font-size="22" fill="#26372f" text-anchor="start">常用PQ=SQ×RQ</text><rect x="45" y="500" width="1100" height="145" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="540" font-size="28" fill="#26372f" text-anchor="start">输出不是可互换的文件格式</text><text x="65" y="582" font-size="22" fill="#26372f" text-anchor="start">语义标签无法可靠恢复接触实例；实例输出不一定覆盖road/sky；全景需解决原始mask重叠。</text><text x="65" y="614" font-size="22" fill="#26372f" text-anchor="start">Ignore区域、thing/stuff表和空类别规则都属于数据合同。</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">先写任务合同，才能判断模型“做对了什么”。</text></g></svg>
