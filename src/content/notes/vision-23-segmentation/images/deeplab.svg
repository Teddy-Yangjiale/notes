<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">DeepLab：空洞卷积保分辨率，ASPP聚合多尺度上下文</title><desc id="desc">rate只有结合feature尺寸与output stride才有输入图像尺度意义。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DeepLab：空洞卷积保分辨率，ASPP聚合多尺度上下文</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">rate只有结合feature尺寸与output stride才有输入图像尺度意义。</text><rect x="45" y="140" width="275" height="230" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="180" font-size="28" fill="#26372f" text-anchor="start">Backbone OS=16</text><text x="65" y="222" font-size="22" fill="#26372f" text-anchor="start">后段stride改为1</text><text x="65" y="254" font-size="22" fill="#26372f" text-anchor="start">dilation补偿感受野</text><text x="65" y="286" font-size="22" fill="#26372f" text-anchor="start">feature更密</text><line x1="335" y1="255" x2="400" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 389 248 L 400 255 L 389 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="425" y="105" width="335" height="315" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="445" y="145" font-size="28" fill="#26372f" text-anchor="start">ASPP并行分支</text><text x="445" y="187" font-size="22" fill="#26372f" text-anchor="start">1×1</text><text x="445" y="219" font-size="22" fill="#26372f" text-anchor="start">3×3 rates 6/12/18</text><text x="445" y="251" font-size="22" fill="#26372f" text-anchor="start">image pooling</text><text x="445" y="283" font-size="22" fill="#26372f" text-anchor="start">对齐后concat + projection</text><line x1="775" y1="255" x2="840" y2="255" stroke="#26372f" stroke-width="3"/><path d="M 829 248 L 840 255 L 829 262" fill="none" stroke="#26372f" stroke-width="3"/><rect x="865" y="140" width="280" height="230" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="885" y="180" font-size="28" fill="#26372f" text-anchor="start">v3+ decoder</text><text x="885" y="222" font-size="22" fill="#26372f" text-anchor="start">上采样4×</text><text x="885" y="254" font-size="22" fill="#26372f" text-anchor="start">concat压缩后的低层feature</text><text x="885" y="286" font-size="22" fill="#26372f" text-anchor="start">卷积 + 最终上采样</text><rect x="45" y="510" width="1100" height="140" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="550" font-size="28" fill="#26372f" text-anchor="start">三个容易混淆的作用</text><text x="65" y="592" font-size="22" fill="#26372f" text-anchor="start">dilation扩大采样跨度；ASPP并行多个尺度；decoder补浅层边界。</text><text x="65" y="624" font-size="22" fill="#26372f" text-anchor="start">CRF属于早期DeepLab后处理，不是DeepLabv3/v3+的定义条件。</text><text x="45" y="735" font-size="24" fill="#26372f" text-anchor="start">降低output stride会让高宽变大，精度收益必须连同显存与计算报告。</text></g></svg>
