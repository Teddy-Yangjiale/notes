<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">U-Net：高分辨率encoder feature与decoder按通道拼接</title><desc id="desc">skip保存定位线索；decoder结合底部上下文决定哪些细节有用。</desc><rect width="1200" height="800" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">U-Net：高分辨率encoder feature与decoder按通道拼接</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">skip保存定位线索；decoder结合底部上下文决定哪些细节有用。</text><rect x="45" y="145" width="230" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#26372f" text-anchor="start">Encoder 128×128</text><text x="65" y="227" font-size="22" fill="#26372f" text-anchor="start">conv → feature E1</text><text x="65" y="259" font-size="22" fill="#26372f" text-anchor="start">pool ↓</text><rect x="45" y="400" width="230" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="440" font-size="28" fill="#26372f" text-anchor="start">Encoder 64×64</text><text x="65" y="482" font-size="22" fill="#26372f" text-anchor="start">conv → feature E2</text><text x="65" y="514" font-size="22" fill="#26372f" text-anchor="start">pool ↓</text><rect x="475" y="275" width="245" height="180" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="495" y="315" font-size="28" fill="#26372f" text-anchor="start">Bottleneck 32×32</text><text x="495" y="357" font-size="22" fill="#26372f" text-anchor="start">大感受野</text><text x="495" y="389" font-size="22" fill="#26372f" text-anchor="start">语义上下文</text><rect x="900" y="400" width="250" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="920" y="440" font-size="28" fill="#26372f" text-anchor="start">Decoder 64×64</text><text x="920" y="482" font-size="22" fill="#26372f" text-anchor="start">up + concat(E2)</text><text x="920" y="514" font-size="22" fill="#26372f" text-anchor="start">conv融合</text><rect x="900" y="145" width="250" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="920" y="185" font-size="28" fill="#26372f" text-anchor="start">Decoder 128×128</text><text x="920" y="227" font-size="22" fill="#26372f" text-anchor="start">up + concat(E1)</text><text x="920" y="259" font-size="22" fill="#26372f" text-anchor="start">输出mask</text><line x1="290" y1="480" x2="455" y2="380" stroke="#26372f" stroke-width="3"/><path d="M 444 373 L 455 380 L 444 387" fill="none" stroke="#26372f" stroke-width="3"/><line x1="735" y1="380" x2="880" y2="480" stroke="#26372f" stroke-width="3"/><path d="M 869 473 L 880 480 L 869 487" fill="none" stroke="#26372f" stroke-width="3"/><line x1="1020" y1="390" x2="1020" y2="325" stroke="#26372f" stroke-width="3"/><path d="M 1009 318 L 1020 325 L 1009 332" fill="none" stroke="#26372f" stroke-width="3"/><line x1="275" y1="470" x2="895" y2="470" stroke="#3b7e57" stroke-width="3" stroke-dasharray="9 7"/><line x1="275" y1="220" x2="895" y2="220" stroke="#3b7e57" stroke-width="3" stroke-dasharray="9 7"/><text x="45" y="660" font-size="24" fill="#26372f" text-anchor="start">valid卷积版本需裁剪encoder feature；same padding版本仍要检查奇偶尺寸。</text><text x="45" y="715" font-size="24" fill="#26372f" text-anchor="start">skip不能复活输入中本就没有的证据，也可能传入噪声。</text></g></svg>
