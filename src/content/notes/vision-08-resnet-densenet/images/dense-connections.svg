<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">DenseNet：读取旧特征列表，再追加新特征</title><desc id="desc">示意C₀=16、k=8；一个dense block内空间不变，transition再压缩和下采样。</desc><rect width="1200" height="690" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">DenseNet：读取旧特征列表，再追加新特征</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">示意C₀=16、k=8；一个dense block内空间不变，transition再压缩和下采样。</text><rect x="55" y="165" width="210" height="130" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="205" font-size="28" fill="#26372f" text-anchor="start">初始x₀</text><text x="75" y="247" font-size="22" fill="#26372f" text-anchor="start">16通道</text><rect x="310" y="165" width="195" height="130" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="330" y="205" font-size="28" fill="#26372f" text-anchor="start">新特征x1</text><text x="330" y="247" font-size="22" fill="#26372f" text-anchor="start">8通道</text><rect x="525" y="165" width="195" height="130" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="545" y="205" font-size="28" fill="#26372f" text-anchor="start">新特征x2</text><text x="545" y="247" font-size="22" fill="#26372f" text-anchor="start">8通道</text><rect x="740" y="165" width="195" height="130" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="760" y="205" font-size="28" fill="#26372f" text-anchor="start">新特征x3</text><text x="760" y="247" font-size="22" fill="#26372f" text-anchor="start">8通道</text><rect x="955" y="165" width="195" height="130" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="975" y="205" font-size="28" fill="#26372f" text-anchor="start">新特征x4</text><text x="975" y="247" font-size="22" fill="#26372f" text-anchor="start">8通道</text><text x="55" y="360" font-size="25" fill="#26372f" text-anchor="start">第1层读16</text><text x="310" y="360" font-size="25" fill="#26372f" text-anchor="start">第2层读24</text><text x="550" y="360" font-size="25" fill="#26372f" text-anchor="start">第3层读32</text><text x="790" y="360" font-size="25" fill="#26372f" text-anchor="start">第4层读40</text><line x1="55" y1="405" x2="1135" y2="405" stroke="#95a99b" stroke-width="3" stroke-dasharray="9 7"/><rect x="55" y="455" width="455" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="495" font-size="28" fill="#26372f" text-anchor="start">block输出：16+4×8=48通道</text><text x="75" y="537" font-size="22" fill="#26372f" text-anchor="start">concat保留旧通道与新增通道</text><text x="75" y="569" font-size="22" fill="#26372f" text-anchor="start">梯度按切片分开，再累加复用路径</text><line x1="525" y1="535" x2="610" y2="535" stroke="#26372f" stroke-width="3"/><path d="M 599 528 L 610 535 L 599 542" fill="none" stroke="#26372f" stroke-width="3"/><rect x="635" y="455" width="500" height="160" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="655" y="495" font-size="28" fill="#26372f" text-anchor="start">transition</text><text x="655" y="537" font-size="22" fill="#26372f" text-anchor="start">1×1压缩：48 → 24通道</text><text x="655" y="569" font-size="22" fill="#26372f" text-anchor="start">2×2平均池化：空间边长减半</text></g></svg>
