<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">残差路径：更新分支与直达参照</title><desc id="desc">同shape才能直接相加；投影会改变shortcut；加法后激活会门控梯度。</desc><rect width="1200" height="700" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">残差路径：更新分支与直达参照</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">同shape才能直接相加；投影会改变shortcut；加法后激活会门控梯度。</text><rect x="55" y="205" width="200" height="125" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="245" font-size="28" fill="#26372f" text-anchor="start">输入x</text><text x="75" y="287" font-size="22" fill="#26372f" text-anchor="start">C×H×W</text><line x1="270" y1="170" x2="270" y2="420" stroke="#26372f" stroke-width="3"/><line x1="255" y1="265" x2="270" y2="265" stroke="#26372f" stroke-width="3"/><line x1="270" y1="210" x2="330" y2="210" stroke="#26372f" stroke-width="3"/><path d="M 319 203 L 330 210 L 319 217" fill="none" stroke="#26372f" stroke-width="3"/><rect x="350" y="160" width="350" height="110" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="370" y="200" font-size="28" fill="#26372f" text-anchor="start">残差分支F(x)</text><text x="370" y="242" font-size="22" fill="#26372f" text-anchor="start">卷积、归一化、激活</text><line x1="270" y1="420" x2="825" y2="420" stroke="#26372f" stroke-width="3"/><line x1="825" y1="420" x2="825" y2="270" stroke="#26372f" stroke-width="3"/><text x="400" y="400" font-size="26" fill="#26372f" text-anchor="start">恒等shortcut：x</text><line x1="710" y1="210" x2="775" y2="210" stroke="#26372f" stroke-width="3"/><path d="M 764 203 L 775 210 L 764 217" fill="none" stroke="#26372f" stroke-width="3"/><rect x="790" y="165" width="155" height="105" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="810" y="205" font-size="28" fill="#26372f" text-anchor="start">相加</text><text x="810" y="247" font-size="22" fill="#26372f" text-anchor="start">x+F(x)</text><line x1="955" y1="210" x2="995" y2="210" stroke="#26372f" stroke-width="3"/><path d="M 984 203 L 995 210 L 984 217" fill="none" stroke="#26372f" stroke-width="3"/><rect x="1010" y="165" width="150" height="105" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="1030" y="205" font-size="28" fill="#26372f" text-anchor="start">输出</text><text x="1030" y="247" font-size="22" fill="#26372f" text-anchor="start">同shape</text><rect x="55" y="490" width="500" height="145" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="530" font-size="28" fill="#26372f" text-anchor="start">后激活：先相加，再ReLU</text><text x="75" y="572" font-size="22" fill="#26372f" text-anchor="start">直达路径仍经过加法后的ReLU</text><text x="75" y="604" font-size="22" fill="#26372f" text-anchor="start">负坐标可截断上游梯度</text><rect x="625" y="490" width="535" height="145" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="645" y="530" font-size="28" fill="#26372f" text-anchor="start">预激活：BN/ReLU放在分支内</text><text x="645" y="572" font-size="22" fill="#26372f" text-anchor="start">加法后不再加ReLU</text><text x="645" y="604" font-size="22" fill="#26372f" text-anchor="start">同shape路径可以严格保留x</text></g></svg>
