<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Swin V2：分支归一化、方向分数与连续bias</title><desc id="desc">版本变化作用在不同位置；不能仅凭同shape直接混装checkpoint。</desc><rect width="1200" height="800" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Swin V2：分支归一化、方向分数与连续bias</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">版本变化作用在不同位置；不能仅凭同shape直接混装checkpoint。</text><rect x="55" y="170" width="500" height="195" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">V1：Pre-LN</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">Z = X + Attn(LN(X))</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">Y = Z + FFN(LN(Z))</text><text x="75" y="316" font-size="22" fill="#26372f" text-anchor="start">merge：LN4C → reduce</text><rect x="645" y="170" width="500" height="195" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="665" y="210" font-size="28" fill="#26372f" text-anchor="start">V2：residual-post-norm</text><text x="665" y="252" font-size="22" fill="#26372f" text-anchor="start">Z = X + LN(Attn(X))</text><text x="665" y="284" font-size="22" fill="#26372f" text-anchor="start">Y = Z + LN(FFN(Z))</text><text x="665" y="316" font-size="22" fill="#26372f" text-anchor="start">merge：reduce → LN2C</text><rect x="55" y="450" width="500" height="185" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="490" font-size="28" fill="#26372f" text-anchor="start">cosine attention</text><text x="75" y="532" font-size="22" fill="#26372f" text-anchor="start">归一化Q/K方向，再乘每头尺度</text><text x="75" y="564" font-size="22" fill="#26372f" text-anchor="start">正幅度缩放不改变cosine</text><text x="75" y="596" font-size="22" fill="#26372f" text-anchor="start">epsilon与尺度clamp须核对</text><rect x="645" y="450" width="500" height="185" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="665" y="490" font-size="28" fill="#26372f" text-anchor="start">连续位置bias</text><text x="665" y="532" font-size="22" fill="#26372f" text-anchor="start">二维位移 → 有符号log坐标</text><text x="665" y="564" font-size="22" fill="#26372f" text-anchor="start">小MLP → 每头bias</text><text x="665" y="596" font-size="22" fill="#26372f" text-anchor="start">可求新位移值，不保证外推质量</text><text x="55" y="720" font-size="24" fill="#26372f" text-anchor="start">这里省略DropPath，实际训练需包含它；普通Post-LN是另一条公式。</text></g></svg>
