<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">三种attention：可见范围与证据粒度</title><desc id="desc">都可保持N个输出；不同的是每个query本层允许读取的key集合。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">三种attention：可见范围与证据粒度</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">都可保持N个输出；不同的是每个query本层允许读取的key集合。</text><rect x="55" y="170" width="335" height="245" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">全局attention</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">Q：N×d，K/V：N×d</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">每个位置读全部原key</text><text x="75" y="316" font-size="22" fill="#26372f" text-anchor="start">分数：N×N</text><text x="75" y="348" font-size="22" fill="#26372f" text-anchor="start">交互MAC：2N²C</text><rect x="435" y="170" width="335" height="245" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="210" font-size="28" fill="#26372f" text-anchor="start">窗口attention</text><text x="455" y="252" font-size="22" fill="#26372f" text-anchor="start">每窗M²个Q/K/V</text><text x="455" y="284" font-size="22" fill="#26372f" text-anchor="start">逐位置读取本窗证据</text><text x="455" y="316" font-size="22" fill="#26372f" text-anchor="start">分数总项：NM²</text><text x="455" y="348" font-size="22" fill="#26372f" text-anchor="start">交互MAC：2NM²C</text><rect x="815" y="170" width="330" height="245" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="210" font-size="28" fill="#26372f" text-anchor="start">普通SRA</text><text x="835" y="252" font-size="22" fill="#26372f" text-anchor="start">Q：N×d</text><text x="835" y="284" font-size="22" fill="#26372f" text-anchor="start">K/V：N/r²×d</text><text x="835" y="316" font-size="22" fill="#26372f" text-anchor="start">读取全图学习摘要</text><text x="835" y="348" font-size="22" fill="#26372f" text-anchor="start">交互MAC：2N²C/r²</text><rect x="55" y="495" width="1090" height="155" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="535" font-size="28" fill="#26372f" text-anchor="start">固定P×P摘要的LSRA</text><text x="75" y="577" font-size="22" fill="#26372f" text-anchor="start">K/V数量P²固定，交互MAC为2NP²C；softmax函数仍非线性。</text><text x="75" y="609" font-size="22" fill="#26372f" text-anchor="start">图像变大后一个摘要混合更多原位置，远处细节粒度需单独评价。</text><text x="55" y="735" font-size="24" fill="#26372f" text-anchor="start">上面只列交互项；完整预算还包括投影、reduction、FFN与数据组织。</text></g></svg>
