x="533" y="433" font-size="23" fill="#26372f" text-anchor="middle">7</text><rect x="565" y="395" width="57" height="57" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="593" y="433" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="625" y="395" width="57" height="57" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="653" y="433" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="815" y="215" width="325" height="235" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="835" y="255" font-size="28" fill="#26372f" text-anchor="start">可学习表：9×heads</text><text x="835" y="297" font-size="22" fill="#26372f" text-anchor="start">同位移共享表项</text><text x="835" y="329" font-size="22" fill="#26372f" text-anchor="start">索引矩阵是整数buffer</text><text x="835" y="361" font-size="22" fill="#26372f" text-anchor="start">每个block单独计表</text><rect x="55" y="545" width="1085" height="145" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="585" font-size="28" fill="#26372f" text-anchor="start">梯度不是reshape</text><text x="75" y="627" font-size="22" fill="#26372f" text-anchor="start">按索引scatter-add：对同一表项的全部位置对、全部图像与窗口求和。</text><text x="55" y="765" font-size="24" fill="#26372f" text-anchor="start">禁止位置对在精确mask下贡献0；所有分数同加常数不改变softmax。</text></g></svg>
