<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">相对bias：少量参数，多次引用，反传累加</title><desc id="desc">M2窗口：query−key；对角索引4，向右读索引3，向左读索引5。</desc><rect width="1200" height="840" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">相对bias：少量参数，多次引用，反传累加</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">M2窗口：query−key；对角索引4，向右读索引3，向左读索引5。</text><text x="55" y="170" font-size="27" fill="#26372f" text-anchor="start">窗内坐标与序列次序</text><rect x="55" y="215" width="132" height="132" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="120.5" y="290.5" font-size="23" fill="#26372f" text-anchor="middle">(0,0)</text><rect x="190" y="215" width="132" height="132" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="255.5" y="290.5" font-size="23" fill="#26372f" text-anchor="middle">(0,1)</text><rect x="55" y="350" width="132" height="132" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="120.5" y="425.5" font-size="23" fill="#26372f" text-anchor="middle">(1,0)</text><rect x="190" y="350" width="132" height="132" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="255.5" y="425.5" font-size="23" fill="#26372f" text-anchor="middle">(1,1)</text><text x="445" y="170" font-size="27" fill="#26372f" text-anchor="start">4×4位置对索引</text><rect x="445" y="215" width="57" height="57" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="473" y="253" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="505" y="215" width="57" height="57" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="533" y="253" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="565" y="215" width="57" height="57" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="593" y="25