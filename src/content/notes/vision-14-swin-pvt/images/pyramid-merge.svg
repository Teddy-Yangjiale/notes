<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">四stage与patch merging：空间减四倍、通道翻倍</title><desc id="desc">224输入、Swin-T宽96；取stage特征时说明merge前还是merge后。</desc><rect width="1200" height="780" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">四stage与patch merging：空间减四倍、通道翻倍</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">224输入、Swin-T宽96；取stage特征时说明merge前还是merge后。</text><rect x="55" y="165" width="245" height="155" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="205" font-size="28" fill="#26372f" text-anchor="start">stage 1</text><text x="75" y="247" font-size="22" fill="#26372f" text-anchor="start">56×56×96</text><text x="75" y="279" font-size="22" fill="#26372f" text-anchor="start">stride4 / 2 blocks</text><rect x="335" y="165" width="245" height="155" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="355" y="205" font-size="28" fill="#26372f" text-anchor="start">stage 2</text><text x="355" y="247" font-size="22" fill="#26372f" text-anchor="start">28×28×192</text><text x="355" y="279" font-size="22" fill="#26372f" text-anchor="start">stride8 / 2 blocks</text><rect x="615" y="165" width="245" height="155" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="635" y="205" font-size="28" fill="#26372f" text-anchor="start">stage 3</text><text x="635" y="247" font-size="22" fill="#26372f" text-anchor="start">14×14×384</text><text x="635" y="279" font-size="22" fill="#26372f" text-anchor="start">stride16 / 6 blocks</text><rect x="895" y="165" width="245" height="155" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="915" y="205" font-size="28" fill="#26372f" text-anchor="start">stage 4</text><text x="915" y="247" font-size="22" fill="#26372f" text-anchor="start">7×7×768</text><text x="915" y="279" font-size="22" fill="#26372f" text-anchor="start">stride32 / 2 blocks</text><rect x="55" y="430" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="100.5" y="485.5" font-size="23" fill="#26372f" text-anchor="middle">00</text><rect x="150" y="430" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="195.5" y="485.5" font-size="23" fill="#26372f" text-anchor="middle">01</text><rect x="55" y="525" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="100.5" y="580.5" font-size="23" fill="#26372f" text-anchor="middle">10</text><rect x="150" y="525" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="195.5" y="580.5" font-size="23" fill="#26372f" text-anchor="middle">11</text><line x1="285" y1="520" x2="375" y2="520" stroke="#26372f" stroke-width="3"/><path d="M 364 513 L 375 520 L 364 527" fill="none" stroke="#26372f" stroke-width="3"/><rect x="400" y="430" width="305" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="420" y="470" font-size="28" fill="#26372f" text-anchor="start">拼接顺序</text><text x="420" y="512" font-size="22" fill="#26372f" text-anchor="start">[00; 10; 01; 11]</text><text x="420" y="544" font-size="22" fill="#26372f" text-anchor="start">每组4C，先LN4C</text><line x1="725" y1="520" x2="795" y2="520" stroke="#26372f" stroke-width="3"/><path d="M 784 513 L 795 520 L 784 527" fill="none" stroke="#26372f" stroke-width="3"/><rect x="820" y="430" width="325" height="190" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="840" y="470" font-size="28" fill="#26372f" text-anchor="start">无bias线性4C→2C</text><text x="840" y="512" font-size="22" fill="#26372f" text-anchor="start">输出网格H/2 × W/2</text><text x="840" y="544" font-size="22" fill="#26372f" text-anchor="start">总标量降到原来1/2</text><text x="55" y="705" font-size="25" fill="#26372f" text-anchor="start">拼接可逆，完整merge不保证无损；Swin V2改为reduce以后LN2C。</text></g></svg>
