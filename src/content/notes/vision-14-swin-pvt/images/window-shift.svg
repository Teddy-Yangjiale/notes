0 / 11</text><text x="75" y="557" font-size="22" fill="#26372f" text-anchor="start">四项互见，跨过上一层旧窗边界</text><text x="75" y="589" font-size="22" fill="#26372f" text-anchor="start">不能用旧窗身份再次禁止它们。</text><rect x="635" y="475" width="510" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="655" y="515" font-size="28" fill="#26372f" text-anchor="start">右上容器：8 / 5 / 12 / 9</text><text x="655" y="557" font-size="22" fill="#26372f" text-anchor="start">标签1 / 2 / 1 / 2</text><text x="655" y="589" font-size="22" fill="#26372f" text-anchor="start">只允许8↔12、5↔9；排除边缘绕回。</text><text x="55" y="705" font-size="24" fill="#26372f" text-anchor="start">mask在softmax前排除禁止项；最后reverse并roll(+1,+1)放回原坐标。</text></g></svg>
