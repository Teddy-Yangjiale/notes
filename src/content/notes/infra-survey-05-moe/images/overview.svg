<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6C6157"/></marker>
  </defs>
  <rect width="1060" height="560" fill="#F6F2E8"/>
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#2E2822">MoE 系统：稀疏激活背后的通信与放置</text>
  <line x1="30" y1="56" x2="1030" y2="56" stroke="#CFC4AC" stroke-width="2"/>

  <!-- 路由 -->
  <rect x="30" y="85" width="220" height="70" rx="12" fill="#E9C97E"/>
  <text x="140" y="115" text-anchor="middle" font-size="17" font-weight="bold" fill="#2E2822">token 输入</text>
  <text x="140" y="140" text-anchor="middle" font-size="13" fill="#2E2822">671B 总参 · 37B 激活</text>
  <line x1="250" y1="120" x2="310" y2="120" stroke="#6C6157" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="310" y="85" width="220" height="70" rx="12" fill="#C98FA0"/>
  <text x="420" y="115" text-anchor="middle" font-size="17" font-weight="bold" fill="#2E2822">Router 门控</text>
  <text x="420" y="140" text-anchor="middle" font-size="13" fill="#2E2822">top-k 路由 · 负载均衡</text>

  <!-- 专家 -->
  <line x1="530" y1="120" x2="590" y2="80" stroke="#6C6157" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="530" y1="120" x2="590" y2="120" stroke="#6C6157" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="530" y1="120" x2="590" y2="160" stroke="#6C6157" stroke-width="2" marker-end="url(#arr5)"/>
  <rect x="590" y="52" width="180" height="52" rx="10" fill="#A8BE86"/>
  <text x="680" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E2822">专家 3（热）</text>
  <rect x="590" y="96" width="180" height="52" rx="10" fill="#A8BE86"/>
  <text x="680" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E2822">专家 17</text>
  <rect x="590" y="140" width="180" height="52" rx="10" fill="#A8BE86" opacity="0.5"/>
  <text x="680" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E2822">专家 42（冷）</text>

  <!-- 系统挑战 -->
  <text x="30" y="270" font-size="17" font-weight="bold" fill="#2E2822">四大系统挑战</text>
  <rect x="30" y="286" width="240" height="110" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="150" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0522E">all-to-all 通信</text>
  <text x="150" y="346" text-anchor="middle" font-size="13" fill="#2E2822">EP 专家并行</text>
  <text x="150" y="368" text-anchor="middle" font-size="13" fill="#2E2822">DeepEP 分层</text>
  <text x="150" y="388" text-anchor="middle" font-size="13" fill="#2E2822">NVLink+RDMA</text>
  <rect x="290" y="286" width="240" height="110" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="410" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0522E">负载不均</text>
  <text x="410" y="346" text-anchor="middle" font-size="13" fill="#2E2822">热门专家挤爆单卡</text>
  <text x="410" y="368" text-anchor="middle" font-size="13" fill="#2E2822">aux-loss-free 均衡</text>
  <text x="410" y="388" text-anchor="middle" font-size="13" fill="#2E2822">BLAZE 零开销路由</text>
  <rect x="550" y="286" width="240" height="110" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="670" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0522E">显存放不下</text>
  <text x="670" y="346" text-anchor="middle" font-size="13" fill="#2E2822">专家卸载 CPU/SSD</text>
  <text x="670" y="368" text-anchor="middle" font-size="13" fill="#2E2822">热驻留 + 冷按需取</text>
  <text x="670" y="388" text-anchor="middle" font-size="13" fill="#2E2822">预测式预取</text>
  <rect x="810" y="286" width="220" height="110" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="920" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0522E">训练-推理双效率</text>
  <text x="920" y="346" text-anchor="middle" font-size="13" fill="#2E2822">块稀疏 GEMM</text>
  <text x="920" y="368" text-anchor="middle" font-size="13" fill="#2E2822">FP8 dispatch</text>
  <text x="920" y="388" text-anchor="middle" font-size="13" fill="#2E2822">计算通信重叠</text>

  <!-- 消费级 -->
  <rect x="30" y="425" width="1000" height="105" rx="12" fill="#EDE7D9" stroke="#CFC4AC" stroke-width="2"/>
  <text x="55" y="457" font-size="16" font-weight="bold" fill="#C0522E">消费级前沿（2025–26）</text>
  <text x="55" y="487" font-size="14" fill="#2E2822">kTransformers：MoE 层放 CPU、attention 放 GPU —— 双路 CPU + 单卡跑 DeepSeek-R1 671B</text>
  <text x="55" y="513" font-size="14" fill="#2E2822">SSD-LLaMA：万亿参数 MoE 权重全在盘上，靠稀疏激活预测预取，SSD 原生推理 1+ token/s</text>
</svg>
