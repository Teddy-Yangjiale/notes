<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">同一张图，不同问题需要不同输出空间</title><desc id="desc">分类向量、对象集合、像素网格与时间身份不能直接互换；标签与指标也不同。</desc><rect width="1200" height="650" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">同一张图，不同问题需要不同输出空间</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">分类向量、对象集合、像素网格与时间身份不能直接互换；标签与指标也不同。</text><rect x="55" y="170" width="495" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">全局：分类 / 检索</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">整图K类分数，或D维embedding</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">标签对应图或查询与库的相关关系</text><rect x="645" y="170" width="495" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="665" y="210" font-size="28" fill="#26372f" text-anchor="start">对象：检测 / 实例</text><text x="665" y="252" font-size="22" fill="#26372f" text-anchor="start">可变数量的框、类别与mask</text><text x="665" y="284" font-size="22" fill="#26372f" text-anchor="start">匹配对象，处理重复与漏检</text><rect x="55" y="410" width="495" height="160" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="450" font-size="28" fill="#26372f" text-anchor="start">稠密：分割 / 光流 / 深度</text><text x="75" y="492" font-size="22" fill="#26372f" text-anchor="start">每位置类别、二维位移或距离</text><text x="75" y="524" font-size="22" fill="#26372f" text-anchor="start">坐标、单位与有效mask要一致</text><rect x="645" y="410" width="495" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="665" y="450" font-size="28" fill="#26372f" text-anchor="start">具名与时间：姿态 / 跟踪</text><text x="665" y="492" font-size="22" fill="#26372f" text-anchor="start">关键点部位顺序，跨帧track ID</text><text x="665" y="524" font-size="22" fill="#26372f" text-anchor="start">位置正确仍可能身份关联错误</text></g></svg>
