<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">HRNet：保留高路，逐步加入低路并反复交换</title><desc id="desc">水平为网络深度，垂直为分辨率；融合先对齐通道与网格，再求和。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">HRNet：保留高路，逐步加入低路并反复交换</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">水平为网络深度，垂直为分辨率；融合先对齐通道与网格，再求和。</text><text x="50" y="210" font-size="27" fill="#26372f" text-anchor="start">1/4</text><line x1="180" y1="200" x2="1130" y2="200" stroke="#28734c" stroke-width="3"/><rect x="180" y="165" width="180" height="70" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="270" y="210" font-size="23" fill="#26372f" text-anchor="middle">32通道</text><rect x="420" y="165" width="180" height="70" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="510" y="210" font-size="23" fill="#26372f" text-anchor="middle">32通道</text><rect x="660" y="165" width="180" height="70" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="750" y="210" font-size="23" fill="#26372f" text-anchor="middle">32通道</text><rect x="900" y="165" width="180" height="70" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="990" y="210" font-size="23" fill="#26372f" text-anchor="middle">32通道</text><text x="50" y="325" font-size="27" fill="#26372f" text-anchor="start">1/8</text><line x1="420" y1="315" x2="1130" y2="315" stroke="#386fa5" stroke-width="3"/><rect x="420" y="280" width="180" height="70" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="510" y="325" font-size="23" fill="#26372f" text-anchor="middle">64通道</text><rect x="660" y="280" width="180" height="70" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="750" y="325" font-size="23" fill="#26372f" text-anchor="middle">64通道</text><rect x="900" y="280" width="180" height="70" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="990" y="325" font-size="23" fill="#26372f" text-anchor="middle">64通道</text><text x="50" y="440" font-size="27" fill="#26372f" text-anchor="start">1/16</text><line x1="660" y1="430" x2="1130" y2="430" stroke="#28734c" stroke-width="3"/><rect x="660" y="395" width="180" height="70" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="750" y="440" font-size="23" fill="#26372f" text-anchor="middle">128通道</text><rect x="900" y="395" width="180" height="70" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="990" y="440" font-size="23" fill="#26372f" text-anchor="middle">128通道</text><text x="50" y="555" font-size="27" fill="#26372f" text-anchor="start">1/32</text><line x1="900" y1="545" x2="1130" y2="545" stroke="#386fa5" stroke-width="3"/><rect x="900" y="510" width="180" height="70" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="990" y="555" font-size="23" fill="#26372f" text-anchor="middle">256通道</text><line x1="630" y1="205" x2="630" y2="320" stroke="#a98554" stroke-width="3" stroke-dasharray="9 7"/><line x1="870" y1="205" x2="870" y2="435" stroke="#a98554" stroke-width="3" stroke-dasharray="9 7"/><line x1="1110" y1="205" x2="1110" y2="550" stroke="#a98554" stroke-width="3" stroke-dasharray="9 7"/><text x="50" y="700" font-size="26" fill="#26372f" text-anchor="start">低→高：1×1对齐通道再上采样；高→低：多次3×3 stride2</text><text x="50" y="755" font-size="24" fill="#26372f" text-anchor="start">示意W32后续宽度；stem/stage1的具体通道与块数由配置决定。</text></g></svg>
