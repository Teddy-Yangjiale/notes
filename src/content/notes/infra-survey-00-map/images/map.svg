<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" font-family="Microsoft YaHei, sans-serif">
  <rect width="1060" height="580" fill="#F6F2E8"/>
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#2E2822">AI Infra 十二方向地图：三条阅读路径</text>
  <line x1="30" y1="56" x2="1030" y2="56" stroke="#CFC4AC" stroke-width="2"/>

  <!-- 推理系统路径 -->
  <text x="30" y="96" font-size="17" font-weight="bold" fill="#C0522E">路径一 · 推理系统</text>
  <rect x="30" y="112" width="185" height="64" rx="10" fill="#92B7D1"/>
  <text x="122" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">01 服务与调度</text>
  <rect x="235" y="112" width="185" height="64" rx="10" fill="#92B7D1"/>
  <text x="327" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">02 KV Cache</text>
  <rect x="440" y="112" width="185" height="64" rx="10" fill="#92B7D1"/>
  <text x="532" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">04 PD 分离</text>
  <rect x="645" y="112" width="185" height="64" rx="10" fill="#92B7D1"/>
  <text x="737" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">03 投机解码</text>
  <rect x="850" y="112" width="180" height="64" rx="10" fill="#92B7D1"/>
  <text x="940" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">08 长上下文</text>

  <!-- 训练 RL 路径 -->
  <text x="30" y="240" font-size="17" font-weight="bold" fill="#C0522E">路径二 · 训练 / RL 系统</text>
  <rect x="30" y="256" width="185" height="64" rx="10" fill="#A8BE86"/>
  <text x="122" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">09 分布式训练</text>
  <rect x="235" y="256" width="185" height="64" rx="10" fill="#A8BE86"/>
  <text x="327" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">10 RL 后训练</text>
  <rect x="440" y="256" width="185" height="64" rx="10" fill="#A8BE86"/>
  <text x="532" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">05 MoE 系统</text>
  <rect x="645" y="256" width="185" height="64" rx="10" fill="#A8BE86"/>
  <text x="737" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">11 算子编译器</text>

  <!-- Agent 路径 -->
  <text x="30" y="384" font-size="17" font-weight="bold" fill="#C0522E">路径三 · Agent 系统</text>
  <rect x="30" y="400" width="185" height="64" rx="10" fill="#C98FA0"/>
  <text x="122" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">12 Agent 基础设施</text>
  <rect x="235" y="400" width="185" height="64" rx="10" fill="#C98FA0"/>
  <text x="327" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">01 服务与调度</text>
  <rect x="440" y="400" width="185" height="64" rx="10" fill="#C98FA0"/>
  <text x="532" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFDF7">02 KV Cache</text>

  <!-- 共同基座 -->
  <rect x="30" y="492" width="1000" height="62" rx="12" fill="#EDE7D9" stroke="#CFC4AC" stroke-width="2"/>
  <text x="55" y="520" font-size="15" font-weight="bold" fill="#C0522E">共同基座</text>
  <text x="180" y="520" font-size="14" fill="#2E2822">06 量化与低精度（所有方向都要用）</text>
  <text x="180" y="544" font-size="14" fill="#2E2822">07 显存卸载与异构推理（消费级/AI PC 的天然测试床）</text>
</svg>
