<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">顺序分解、平行分支与reduction的区别</title><desc id="desc">核名称相同也不代表计算图相同；concat必须对齐空间尺寸。</desc><rect width="1200" height="700" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">顺序分解、平行分支与reduction的区别</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">核名称相同也不代表计算图相同；concat必须对齐空间尺寸。</text><rect x="55" y="160" width="260" height="140" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="200" font-size="28" fill="#26372f" text-anchor="start">顺序</text><text x="75" y="242" font-size="22" fill="#26372f" text-anchor="start">输入 → 1×3 → 3×1</text><text x="75" y="274" font-size="22" fill="#26372f" text-anchor="start">单输出可看3×3</text><rect x="390" y="160" width="360" height="140" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="410" y="200" font-size="28" fill="#26372f" text-anchor="start">平行</text><text x="410" y="242" font-size="22" fill="#26372f" text-anchor="start">同一输入各做1×3和3×1</text><text x="410" y="274" font-size="22" fill="#26372f" text-anchor="start">输出拼接；分支各看一条线</text><rect x="825" y="160" width="310" height="140" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="845" y="200" font-size="28" fill="#26372f" text-anchor="start">结构约束</text><text x="845" y="242" font-size="22" fill="#26372f" text-anchor="start">单中间通道、线性时</text><text x="845" y="274" font-size="22" fill="#26372f" text-anchor="start">非对称分解为外积核</text><text x="55" y="365" font-size="28" fill="#26372f" text-anchor="start">下采样两条路径：输入空间35×35</text><rect x="55" y="405" width="455" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="445" font-size="28" fill="#26372f" text-anchor="start">3×3卷积，stride2，padding0</text><text x="75" y="487" font-size="22" fill="#26372f" text-anchor="start">输出17×17；通道可改变</text><rect x="620" y="405" width="515" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="640" y="445" font-size="28" fill="#26372f" text-anchor="start">3×3池化，stride2，padding0</text><text x="640" y="487" font-size="22" fill="#26372f" text-anchor="start">输出17×17；原通道保留</text><text x="55" y="635" font-size="25" fill="#26372f" text-anchor="start">两条路径可沿通道concat；若一条padding1变18×18，就不能直接拼接。</text></g></svg>
