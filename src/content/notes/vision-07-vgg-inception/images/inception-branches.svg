<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Inception 3a：降维再做大核，四个输出沿通道拼接</title><desc id="desc">输入192×28×28；四分支输出64、128、32、32通道，合计256。</desc><rect width="1200" height="750" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Inception 3a：降维再做大核，四个输出沿通道拼接</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">输入192×28×28；四分支输出64、128、32、32通道，合计256。</text><rect x="45" y="310" width="220" height="130" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="65" y="350" font-size="28" fill="#26372f" text-anchor="start">输入192通道</text><text x="65" y="392" font-size="22" fill="#26372f" text-anchor="start">空间28×28</text><line x1="280" y1="200" x2="280" y2="560" stroke="#26372f" stroke-width="3"/><line x1="265" y1="375" x2="280" y2="375" stroke="#26372f" stroke-width="3"/><line x1="280" y1="200" x2="335" y2="200" stroke="#26372f" stroke-width="3"/><path d="M 324 193 L 335 200 L 324 207" fill="none" stroke="#26372f" stroke-width="3"/><line x1="280" y1="320" x2="335" y2="320" stroke="#26372f" stroke-width="3"/><path d="M 324 313 L 335 320 L 324 327" fill="none" stroke="#26372f" stroke-width="3"/><line x1="280" y1="440" x2="335" y2="440" stroke="#26372f" stroke-width="3"/><path d="M 324 433 L 335 440 L 324 447" fill="none" stroke="#26372f" stroke-width="3"/><line x1="280" y1="560" x2="335" y2="560" stroke="#26372f" stroke-width="3"/><path d="M 324 553 L 335 560 L 324 567" fill="none" stroke="#26372f" stroke-width="3"/><rect x="350" y="160" width="510" height="80" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="375" y="210" font-size="27" fill="#26372f" text-anchor="start">1×1：192 → 64</text><rect x="350" y="280" width="210" height="80" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="367" y="330" font-size="24" fill="#26372f" text-anchor="start">1×1：192→96</text><line x1="575" y1="320" x2="635" y2="320" stroke="#26372f" stroke-width="3"/><path d="M 624 313 L 635 320 L 624 327" fill="none" stroke="#26372f" stroke-width="3"/><rect x="650" y="280" width="210" height="80" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="667" y="330" font-size="24" fill="#26372f" text-anchor="start">3×3：96→128</text><rect x="350" y="400" width="210" height="80" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="367" y="450" font-size="24" fill="#26372f" text-anchor="start">1×1：192→16</text><line x1="575" y1="440" x2="635" y2="440" stroke="#26372f" stroke-width="3"/><path d="M 624 433 L 635 440 L 624 447" fill="none" stroke="#26372f" stroke-width="3"/><rect x="650" y="400" width="210" height="80" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="667" y="450" font-size="24" fill="#26372f" text-anchor="start">5×5：16→32</text><rect x="350" y="520" width="210" height="80" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="367" y="570" font-size="25" fill="#26372f" text-anchor="start">3×3最大池化</text><line x1="575" y1="560" x2="635" y2="560" stroke="#26372f" stroke-width="3"/><path d="M 624 553 L 635 560 L 624 567" fill="none" stroke="#26372f" stroke-width="3"/><rect x="650" y="520" width="210" height="80" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="667" y="570" font-size="24" fill="#26372f" text-anchor="start">1×1：192→32</text><line x1="860" y1="200" x2="915" y2="200" stroke="#26372f" stroke-width="3"/><line x1="860" y1="320" x2="915" y2="320" stroke="#26372f" stroke-width="3"/><line x1="860" y1="440" x2="915" y2="440" stroke="#26372f" stroke-width="3"/><line x1="860" y1="560" x2="915" y2="560" stroke="#26372f" stroke-width="3"/><line x1="915" y1="200" x2="915" y2="560" stroke="#26372f" stroke-width="3"/><line x1="915" y1="375" x2="945" y2="375" stroke="#26372f" stroke-width="3"/><path d="M 934 368 L 945 375 L 934 382" fill="none" stroke="#26372f" stroke-width="3"/><rect x="960" y="300" width="200" height="160" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="980" y="340" font-size="28" fill="#26372f" text-anchor="start">concat</text><text x="980" y="382" font-size="22" fill="#26372f" text-anchor="start">256通道</text><text x="980" y="414" font-size="22" fill="#26372f" text-anchor="start">空间28×28</text><text x="45" y="680" font-size="26" fill="#26372f" text-anchor="start">96与16是分支中间通道；它们不重复加入最终256通道。</text></g></svg>
