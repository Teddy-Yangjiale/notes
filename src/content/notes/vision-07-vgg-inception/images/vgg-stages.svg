<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">VGG16：五组卷积、五次池化与大分类头</title><desc id="desc">卷积使用3×3、stride1、padding1；每个stage最后池化使空间边长减半。</desc><rect width="1200" height="700" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">VGG16：五组卷积、五次池化与大分类头</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">卷积使用3×3、stride1、padding1；每个stage最后池化使空间边长减半。</text><rect x="50" y="165" width="200" height="200" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="70" y="205" font-size="28" fill="#26372f" text-anchor="start">Stage1</text><text x="70" y="247" font-size="22" fill="#26372f" text-anchor="start">64通道</text><text x="70" y="279" font-size="22" fill="#26372f" text-anchor="start">224 → 112</text><text x="70" y="311" font-size="22" fill="#26372f" text-anchor="start">卷积 × 2</text><rect x="270" y="165" width="200" height="200" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="290" y="205" font-size="28" fill="#26372f" text-anchor="start">Stage2</text><text x="290" y="247" font-size="22" fill="#26372f" text-anchor="start">128通道</text><text x="290" y="279" font-size="22" fill="#26372f" text-anchor="start">112 → 56</text><text x="290" y="311" font-size="22" fill="#26372f" text-anchor="start">卷积 × 2</text><rect x="490" y="165" width="200" height="200" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="510" y="205" font-size="28" fill="#26372f" text-anchor="start">Stage3</text><text x="510" y="247" font-size="22" fill="#26372f" text-anchor="start">256通道</text><text x="510" y="279" font-size="22" fill="#26372f" text-anchor="start">56 → 28</text><text x="510" y="311" font-size="22" fill="#26372f" text-anchor="start">卷积 × 3</text><rect x="710" y="165" width="200" height="200" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="730" y="205" font-size="28" fill="#26372f" text-anchor="start">Stage4</text><text x="730" y="247" font-size="22" fill="#26372f" text-anchor="start">512通道</text><text x="730" y="279" font-size="22" fill="#26372f" text-anchor="start">28 → 14</text><text x="730" y="311" font-size="22" fill="#26372f" text-anchor="start">卷积 × 3</text><rect x="930" y="165" width="200" height="200" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="950" y="205" font-size="28" fill="#26372f" text-anchor="start">Stage5</text><text x="950" y="247" font-size="22" fill="#26372f" text-anchor="start">512通道</text><text x="950" y="279" font-size="22" fill="#26372f" text-anchor="start">14 → 7</text><text x="950" y="311" font-size="22" fill="#26372f" text-anchor="start">卷积 × 3</text><text x="50" y="430" font-size="28" fill="#26372f" text-anchor="start">13个卷积 + 3个全连接 = 16个带权重层</text><rect x="50" y="470" width="1090" height="160" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="70" y="510" font-size="28" fill="#26372f" text-anchor="start">最后表示512×7×7 → 展平25088维</text><text x="70" y="552" font-size="22" fill="#26372f" text-anchor="start">FC4096 → FC4096 → FC1000 → softmax</text><text x="70" y="584" font-size="22" fill="#26372f" text-anchor="start">大分类头占约89.36%的参数；卷积占绝大多数MAC。</text></g></svg>
