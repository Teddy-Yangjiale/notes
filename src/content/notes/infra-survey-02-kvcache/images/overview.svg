<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6C6157"/></marker>
  </defs>
  <rect width="1060" height="560" fill="#F6F2E8"/>
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#2E2822">KV Cache 管理：六个动作、三层存储</text>
  <line x1="30" y1="56" x2="1030" y2="56" stroke="#CFC4AC" stroke-width="2"/>

  <!-- 为什么 -->
  <rect x="30" y="78" width="1000" height="66" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="55" y="106" font-size="15" font-weight="bold" fill="#C0522E">为什么是主战场</text>
  <text x="240" y="106" font-size="15" fill="#2E2822">KV 大小 = 层数 × 2 × 头维 × 序列长 × batch × 精度字节</text>
  <text x="240" y="132" font-size="15" fill="#2E2822">长上下文 + 大 batch 时 KV cache 远超模型权重，是显存第一消耗者</text>

  <!-- 六个动作 -->
  <text x="30" y="185" font-size="17" font-weight="bold" fill="#2E2822">生命周期六动作</text>
  <rect x="30" y="200" width="155" height="72" rx="10" fill="#E9C97E"/>
  <text x="107" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E2822">分配</text>
  <text x="107" y="256" text-anchor="middle" font-size="12" fill="#2E2822">PagedAttention</text>
  <rect x="197" y="200" width="155" height="72" rx="10" fill="#A8BE86"/>
  <text x="274" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E2822">共享</text>
  <text x="274" y="256" text-anchor="middle" font-size="12" fill="#2E2822">Radix 前缀树</text>
  <rect x="364" y="200" width="155" height="72" rx="10" fill="#92B7D1"/>
  <text x="441" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E2822">压缩</text>
  <text x="441" y="256" text-anchor="middle" font-size="12" fill="#2E2822">H2O · MLA 低秩</text>
  <rect x="531" y="200" width="155" height="72" rx="10" fill="#DFA07C"/>
  <text x="608" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E2822">驱逐</text>
  <text x="608" y="256" text-anchor="middle" font-size="12" fill="#2E2822">Quest 按需取回</text>
  <rect x="698" y="200" width="155" height="72" rx="10" fill="#C98FA0"/>
  <text x="775" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E2822">卸载</text>
  <text x="775" y="256" text-anchor="middle" font-size="12" fill="#2E2822">LMCache 多级</text>
  <rect x="865" y="200" width="165" height="72" rx="10" fill="#AFA3CB"/>
  <text x="947" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E2822">恢复</text>
  <text x="947" y="256" text-anchor="middle" font-size="12" fill="#2E2822">CacheGen 比特流</text>
  <line x1="185" y1="236" x2="197" y2="236" stroke="#6C6157" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="352" y1="236" x2="364" y2="236" stroke="#6C6157" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="519" y1="236" x2="531" y2="236" stroke="#6C6157" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="686" y1="236" x2="698" y2="236" stroke="#6C6157" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="853" y1="236" x2="865" y2="236" stroke="#6C6157" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 三层存储 -->
  <text x="30" y="318" font-size="17" font-weight="bold" fill="#2E2822">多级存储（2024–25 主线）</text>
  <rect x="30" y="334" width="320" height="120" rx="12" fill="#92B7D1" opacity="0.85"/>
  <text x="190" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFDF7">GPU HBM</text>
  <text x="190" y="400" text-anchor="middle" font-size="13" fill="#FFFDF7">热 KV · 当前 batch 工作集</text>
  <text x="190" y="426" text-anchor="middle" font-size="13" fill="#FFFDF7">带宽最高、容量最小</text>
  <rect x="370" y="334" width="320" height="120" rx="12" fill="#A8BE86" opacity="0.85"/>
  <text x="530" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFDF7">CPU DRAM</text>
  <text x="530" y="400" text-anchor="middle" font-size="13" fill="#FFFDF7">温 KV · 前缀缓存池</text>
  <text x="530" y="426" text-anchor="middle" font-size="13" fill="#FFFDF7">Mooncake 统一 KV 存储层</text>
  <rect x="710" y="334" width="320" height="120" rx="12" fill="#DFA07C" opacity="0.85"/>
  <text x="870" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFDF7">NVMe SSD</text>
  <text x="870" y="400" text-anchor="middle" font-size="13" fill="#FFFDF7">冷 KV · 外部缓存</text>
  <text x="870" y="426" text-anchor="middle" font-size="13" fill="#FFFDF7">短前缀时重算可能更快</text>
  <line x1="350" y1="394" x2="370" y2="394" stroke="#2E2822" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="690" y1="394" x2="710" y2="394" stroke="#2E2822" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 2026 前沿 -->
  <rect x="30" y="474" width="1000" height="56" rx="12" fill="#EDE7D9" stroke="#CFC4AC" stroke-width="2"/>
  <text x="55" y="500" font-size="15" font-weight="bold" fill="#C0522E">2026 前沿</text>
  <text x="180" y="500" font-size="14" fill="#2E2822">外部缓存 break-even 刻画 · 恢复有界化 · Agent 感知 KV 驻留 · PIM 上的 KV 生命周期</text>
  <text x="180" y="522" font-size="14" fill="#2E2822">开放问题：缓存 vs 重算的统一成本模型、驱逐与模型行为的耦合、新低精度 KV 系统支持</text>
</svg>
