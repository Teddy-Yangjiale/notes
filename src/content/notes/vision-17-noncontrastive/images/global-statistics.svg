<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">全局统计：不能遗漏分片之间的均值差异</title><desc id="desc">第一维在两片各为常数，但全局有变化；其他维和外积也需正确合并。</desc><rect width="1200" height="840" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">全局统计：不能遗漏分片之间的均值差异</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">第一维在两片各为常数，但全局有变化；其他维和外积也需正确合并。</text><rect x="55" y="175" width="335" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">shard1：两行</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">第一维：[+1, +1]</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">局部均值 +1</text><text x="75" y="321" font-size="22" fill="#26372f" text-anchor="start">局部样本方差 0</text><text x="75" y="353" font-size="22" fill="#26372f" text-anchor="start">保存n、列和S、外积和Q</text><rect x="435" y="175" width="335" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="215" font-size="28" fill="#26372f" text-anchor="start">shard2：两行</text><text x="455" y="257" font-size="22" fill="#26372f" text-anchor="start">第一维：[−1, −1]</text><text x="455" y="289" font-size="22" fill="#26372f" text-anchor="start">局部均值 −1</text><text x="455" y="321" font-size="22" fill="#26372f" text-anchor="start">局部样本方差 0</text><text x="455" y="353" font-size="22" fill="#26372f" text-anchor="start">保存n、列和S、外积和Q</text><rect x="815" y="175" width="330" height="220" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="215" font-size="28" fill="#26372f" text-anchor="start">合并：四行</text><text x="835" y="257" font-size="22" fill="#26372f" text-anchor="start">第一维均值 0</text><text x="835" y="289" font-size="22" fill="#26372f" text-anchor="start">全局平方偏差和 4</text><text x="835" y="321" font-size="22" fill="#26372f" text-anchor="start">样本方差 4 / 3</text><text x="835" y="353" font-size="22" fill="#26372f" text-anchor="start">局部方差平均仍错误地为0</text><rect x="55" y="505" width="1090" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="545" font-size="28" fill="#26372f" text-anchor="start">合并统计，再构造目标</text><text x="75" y="587" font-size="22" fill="#26372f" text-anchor="start">N = Σn；S = ΣS；Q = ΣQ；Cov = [Q − SSᵀ/N] / (N−1)</text><text x="75" y="619" font-size="22" fill="#26372f" text-anchor="start">实际大均值/小方差宜用稳定中心化合并；保留可导路径与归约。</text><text x="55" y="760" font-size="24" fill="#26372f" text-anchor="start">SyncBN、embedding gather、DDP与梯度累积处理不同量，不能互相替代。</text></g></svg>
