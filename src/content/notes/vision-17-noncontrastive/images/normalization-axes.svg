<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="965" viewBox="0 0 1200 965" role="img" aria-labelledby="title desc"><title id="title">每行单位长度，与每列跨样本变化是两件事</title><desc id="desc">矩阵行是样本、列是feature维；图中两边都从raw矩阵开始。</desc><rect width="1200" height="965" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">每行单位长度，与每列跨样本变化是两件事</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">矩阵行是样本、列是feature维；图中两边都从raw矩阵开始。</text><rect x="55" y="190" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="103" y="248" font-size="23" fill="#26372f" text-anchor="middle">样本1</text><rect x="155" y="190" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="203" y="248" font-size="23" fill="#26372f" text-anchor="middle">维1</text><rect x="255" y="190" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="303" y="248" font-size="23" fill="#26372f" text-anchor="middle">维2</text><rect x="355" y="190" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="403" y="248" font-size="23" fill="#26372f" text-anchor="middle">维3</text><rect x="55" y="290" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="103" y="348" font-size="23" fill="#26372f" text-anchor="middle">样本2</text><rect x="155" y="290" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="203" y="348" font-size="23" fill="#26372f" text-anchor="middle">维1</text><rect x="255" y="290" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="303" y="348" font-size="23" fill="#26372f" text-anchor="middle">维2</text><rect x="355" y="290" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="403" y="348" font-size="23" fill="#26372f" text-anchor="middle">维3</text><rect x="55" y="390" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="103" y="448" font-size="23" fill="#26372f" text-anchor="middle">样本3</text><rect x="155" y="390" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="203" y="448" font-size="23" fill="#26372f" text-anchor="middle">维1</text><rect x="255" y="390" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="303" y="448" font-size="23" fill="#26372f" text-anchor="middle">维2</text><rect x="355" y="390" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="403" y="448" font-size="23" fill="#26372f" text-anchor="middle">维3</text><rect x="525" y="190" width="620" height="160" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="545" y="230" font-size="28" fill="#26372f" text-anchor="start">行L2：单样本各维平方和</text><text x="545" y="272" font-size="22" fill="#26372f" text-anchor="start">uₙ = zₙ / norm(zₙ)</text><text x="545" y="304" font-size="22" fill="#26372f" text-anchor="start">所有单位行仍可以完全同向、跨样本方差0</text><rect x="525" y="405" width="620" height="160" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="545" y="445" font-size="28" fill="#26372f" text-anchor="start">列标准化：多个样本的同一维</text><text x="545" y="487" font-size="22" fill="#26372f" text-anchor="start">μ / var按样本轴统计，再中心化并缩放</text><text x="545" y="519" font-size="22" fill="#26372f" text-anchor="start">均值与std也是可导函数，反向不能冻结</text><rect x="55" y="660" width="1090" height="140" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="700" font-size="28" fill="#26372f" text-anchor="start">VICReg直接读取raw embedding</text><text x="75" y="742" font-size="22" fill="#26372f" text-anchor="start">方差hinge要求每列足够变化；任意先做单位行L2会改变尺度可行性。</text><text x="55" y="885" font-size="24" fill="#26372f" text-anchor="start">BN、LN、L2的轴与状态不同；先明确接口，再讨论防坍塌。</text></g></svg>
