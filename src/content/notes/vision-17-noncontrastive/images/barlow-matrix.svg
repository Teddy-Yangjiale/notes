<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc"><title id="title">Barlow Twins：交叉矩阵保留两个feature轴</title><desc id="desc">C = UᵀV / N；每个元素把配对样本求和，矩阵不是样本候选表。</desc><rect width="1200" height="990" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">Barlow Twins：交叉矩阵保留两个feature轴</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">C = UᵀV / N；每个元素把配对样本求和，矩阵不是样本候选表。</text><rect x="55" y="205" width="122" height="122" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="115.5" y="275.5" font-size="23" fill="#26372f" text-anchor="middle">C₁₁</text><rect x="180" y="205" width="122" height="122" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="240.5" y="275.5" font-size="23" fill="#26372f" text-anchor="middle">C₁₂</text><rect x="305" y="205" width="122" height="122" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="365.5" y="275.5" font-size="23" fill="#26372f" text-anchor="middle">C₁₃</text><rect x="55" y="330" width="122" height="122" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="115.5" y="400.5" font-size="23" fill="#26372f" text-anchor="middle">C₂₁</text><rect x="180" y="330" width="122" height="122" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="240.5" y="400.5" font-size="23" fill="#26372f" text-anchor="middle">C₂₂</text><rect x="305" y="330" width="122" height="122" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="365.5" y="400.5" font-size="23" fill="#26372f" text-anchor="middle">C₂₃</text><rect x="55" y="455" width="122" height="122" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="115.5" y="525.5" font-size="23" fill="#26372f" text-anchor="middle">C₃₁</text><rect x="180" y="455" width="122" height="122" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="240.5" y="525.5" font-size="23" fill="#26372f" text-anchor="middle">C₃₂</text><rect x="305" y="455" width="122" height="122" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="365.5" y="525.5" font-size="23" fill="#26372f" text-anchor="middle">C₃₃</text><rect x="525" y="205" width="620" height="155" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="545" y="245" font-size="28" fill="#26372f" text-anchor="start">对角：同维跨视图贴近1</text><text x="545" y="287" font-size="22" fill="#26372f" text-anchor="start">Σᵢ(Cᵢᵢ−1)²；D个元素，采用sum。</text><rect x="525" y="415" width="620" height="155" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="545" y="455" font-size="28" fill="#26372f" text-anchor="start">非对角：减少维度间相关</text><text x="545" y="497" font-size="22" fill="#26372f" text-anchor="start">λ Σᵢ≠ⱼ Cᵢⱼ²；上下三角全部D(D−1)项</text><text x="545" y="529" font-size="22" fill="#26372f" text-anchor="start">两视图不同时，C一般不对称。</text><rect x="55" y="690" width="1090" height="140" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="730" font-size="28" fill="#26372f" text-anchor="start">完整反向还需经过列标准化</text><text x="75" y="772" font-size="22" fill="#26372f" text-anchor="start">E = ∂L/∂C；Gᵤ = VEᵀ/N，Gᵥ = UE/N；均值、尺度也回传。</text><text x="55" y="910" font-size="24" fill="#26372f" text-anchor="start">中心化rank至多N−1；D&gt;N−1时，单batch的C不能精确成为Iᴅ。</text></g></svg>
