<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc"><title id="title">共享网络，两方向各有一条停止目标边</title><desc id="desc">图示SimSiam接口；BYOL还为目标encoder/projector保存独立EMA参数。</desc><rect width="1200" height="805" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">共享网络，两方向各有一条停止目标边</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">图示SimSiam接口；BYOL还为目标encoder/projector保存独立EMA参数。</text><rect x="55" y="175" width="310" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">视图1 → f / g</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">z₁可导 → predictor → p₁</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">z₁另作为方向2停止目标</text><rect x="435" y="175" width="330" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="215" font-size="28" fill="#26372f" text-anchor="start">两方向loss平均</text><text x="455" y="257" font-size="22" fill="#26372f" text-anchor="start">p₁ 对 sg(z₂)</text><text x="455" y="289" font-size="22" fill="#26372f" text-anchor="start">p₂ 对 sg(z₁)</text><text x="455" y="321" font-size="22" fill="#26372f" text-anchor="start">两条prediction路径均回传</text><rect x="835" y="175" width="310" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="855" y="215" font-size="28" fill="#26372f" text-anchor="start">视图2 → f / g</text><text x="855" y="257" font-size="22" fill="#26372f" text-anchor="start">z₂可导 → predictor → p₂</text><text x="855" y="289" font-size="22" fill="#26372f" text-anchor="start">z₂另作为方向1停止目标</text><rect x="55" y="450" width="520" height="170" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="490" font-size="28" fill="#26372f" text-anchor="start">停止的是目标图边</text><text x="75" y="532" font-size="22" fill="#26372f" text-anchor="start">sg前向值不变，反向为0</text><text x="75" y="564" font-size="22" fill="#26372f" text-anchor="start">共享参数仍收到两侧预测梯度</text><text x="75" y="596" font-size="22" fill="#26372f" text-anchor="start">不是冻结某张视图整条网络</text><rect x="625" y="450" width="520" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="645" y="490" font-size="28" fill="#26372f" text-anchor="start">核查半梯度的差分</text><text x="645" y="532" font-size="22" fill="#26372f" text-anchor="start">本次forward生成目标快照</text><text x="645" y="564" font-size="22" fill="#26372f" text-anchor="start">改变输入/参数时保持快照</text><text x="645" y="596" font-size="22" fill="#26372f" text-anchor="start">重新生成目标测的是另一函数</text><text x="55" y="725" font-size="24" fill="#26372f" text-anchor="start">predictor、BN与loss归约是算法接口；同样的输出形状不代表同样的求导。</text></g></svg>
