<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="865" viewBox="0 0 1200 865" role="img" aria-labelledby="title desc"><title id="title">VICReg：一致、变化量、线性冗余分别约束</title><desc id="desc">两视图raw embedding都求导；本章采用作者固定代码的sum / mean。</desc><rect width="1200" height="865" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">VICReg：一致、变化量、线性冗余分别约束</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">两视图raw embedding都求导；本章采用作者固定代码的sum / mean。</text><rect x="55" y="180" width="335" height="270" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="220" font-size="28" fill="#26372f" text-anchor="start">invariance</text><text x="75" y="262" font-size="22" fill="#26372f" text-anchor="start">配对行：Aₙ 对 Bₙ</text><text x="75" y="294" font-size="22" fill="#26372f" text-anchor="start">逐元素平方差 / (ND)</text><text x="75" y="326" font-size="22" fill="#26372f" text-anchor="start">两侧梯度符号相反</text><text x="75" y="358" font-size="22" fill="#26372f" text-anchor="start">单独此项允许常数解</text><rect x="435" y="180" width="335" height="270" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="220" font-size="28" fill="#26372f" text-anchor="start">variance</text><text x="455" y="262" font-size="22" fill="#26372f" text-anchor="start">每侧样本std，分母N−1</text><text x="455" y="294" font-size="22" fill="#26372f" text-anchor="start">各维hinge：max(0,1−std)</text><text x="455" y="326" font-size="22" fill="#26372f" text-anchor="start">两侧mean再平均</text><text x="455" y="358" font-size="22" fill="#26372f" text-anchor="start">超过阈值不继续罚</text><rect x="815" y="180" width="330" height="270" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="220" font-size="28" fill="#26372f" text-anchor="start">covariance</text><text x="835" y="262" font-size="22" fill="#26372f" text-anchor="start">各侧Cov，排除对角</text><text x="835" y="294" font-size="22" fill="#26372f" text-anchor="start">全部off平方 / D</text><text x="835" y="326" font-size="22" fill="#26372f" text-anchor="start">两侧loss求和</text><text x="835" y="358" font-size="22" fill="#26372f" text-anchor="start">不单独保证跨视图对齐</text><rect x="55" y="540" width="1090" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="580" font-size="28" fill="#26372f" text-anchor="start">组合：25 × inv + 25 × var + 1 × cov</text><text x="75" y="622" font-size="22" fill="#26372f" text-anchor="start">常数两侧相同、epsilon1e−4：总loss24.75，却可有精确零梯度。</text><text x="75" y="654" font-size="22" fill="#26372f" text-anchor="start">惩罚常数值、消除驻点、改变稳定性，是需要分别核查的命题。</text><text x="55" y="785" font-size="24" fill="#26372f" text-anchor="start">raw尺度、hinge拐点、epsilon和完整归约必须连同权重一起保存。</text></g></svg>
