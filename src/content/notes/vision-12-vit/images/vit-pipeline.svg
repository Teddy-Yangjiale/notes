<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">ViT-B/16 整体数据流：从一张图到一个类别</title><desc id="desc">每个方块下面标出张量形状；batch 轴省略。</desc><rect width="1200" height="860" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">ViT-B/16 整体数据流：从一张图到一个类别</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">每个方块下面标出张量形状；batch 轴省略。</text><rect x="45" y="150" width="205" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="190" font-size="28" fill="#26372f" text-anchor="start">输入图像</text><text x="65" y="232" font-size="22" fill="#26372f" text-anchor="start">3×224×224</text><text x="65" y="264" font-size="22" fill="#26372f" text-anchor="start">RGB，已 normalize</text><line x1="255" y1="245" x2="290" y2="245" stroke="#26372f" stroke-width="3"/><path d="M 279 238 L 290 245 L 279 252" fill="none" stroke="#26372f" stroke-width="3"/><rect x="300" y="150" width="205" height="190" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="320" y="190" font-size="28" fill="#26372f" text-anchor="start">切块 + 展平</text><text x="320" y="232" font-size="22" fill="#26372f" text-anchor="start">196 × 768</text><text x="320" y="264" font-size="22" fill="#26372f" text-anchor="start">196 块，每块 16×16×3</text><line x1="510" y1="245" x2="545" y2="245" stroke="#26372f" stroke-width="3"/><path d="M 534 238 L 545 245 L 534 252" fill="none" stroke="#26372f" stroke-width="3"/><rect x="555" y="150" width="205" height="190" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="575" y="190" font-size="28" fill="#26372f" text-anchor="start">线性投影 E</text><text x="575" y="232" font-size="22" fill="#26372f" text-anchor="start">196 × 768</text><text x="575" y="264" font-size="22" fill="#26372f" text-anchor="start">E：768×768，共享</text><line x1="765" y1="245" x2="800" y2="245" stroke="#26372f" stroke-width="3"/><path d="M 789 238 L 800 245 L 789 252" fill="none" stroke="#26372f" stroke-width="3"/><rect x="810" y="150" width="345" height="190" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="830" y="190" font-size="28" fill="#26372f" text-anchor="start">拼 CLS，加位置表</text><text x="830" y="232" font-size="22" fill="#26372f" text-anchor="start">197 × 768</text><text x="830" y="264" font-size="22" fill="#26372f" text-anchor="start">c：768；P_pos：197×768</text><line x1="985" y1="345" x2="985" y2="390" stroke="#26372f" stroke-width="3"/><line x1="985" y1="390" x2="985" y2="400" stroke="#26372f" stroke-width="3"/><path d="M 974 393 L 985 400 L 974 407" fill="none" stroke="#26372f" stroke-width="3"/><rect x="45" y="410" width="1110" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="65" y="450" font-size="28" fill="#26372f" text-anchor="start">12 × Transformer 块：LN → 多头注意力 → 残差；LN → MLP(GELU, 3072) → 残差</text><text x="65" y="492" font-size="22" fill="#26372f" text-anchor="start">进 197 × 768，出 197 × 768；序列长度在 12 层里始终是 197，没有下采样。</text><line x1="600" y1="560" x2="600" y2="600" stroke="#26372f" stroke-width="3"/><line x1="600" y1="600" x2="600" y2="610" stroke="#26372f" stroke-width="3"/><path d="M 589 603 L 600 610 L 589 617" fill="none" stroke="#26372f" stroke-width="3"/><rect x="45" y="620" width="345" height="135" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="65" y="660" font-size="28" fill="#26372f" text-anchor="start">最终 LN，取第 0 行（CLS）</text><text x="65" y="702" font-size="22" fill="#26372f" text-anchor="start">768</text><line x1="395" y1="690" x2="430" y2="690" stroke="#26372f" stroke-width="3"/><path d="M 419 683 L 430 690 L 419 697" fill="none" stroke="#26372f" stroke-width="3"/><rect x="440" y="620" width="345" height="135" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="460" y="660" font-size="28" fill="#26372f" text-anchor="start">分类头 W：768×1000</text><text x="460" y="702" font-size="22" fill="#26372f" text-anchor="start">1000 个 logit → softmax</text><line x1="790" y1="690" x2="825" y2="690" stroke="#26372f" stroke-width="3"/><path d="M 814 683 L 825 690 L 814 697" fill="none" stroke="#26372f" stroke-width="3"/><rect x="835" y="620" width="320" height="135" rx="13" fill="#ffffff" stroke="#95a99b" stroke-width="2"/><text x="855" y="660" font-size="28" fill="#26372f" text-anchor="start">交叉熵损失</text><text x="855" y="702" font-size="22" fill="#26372f" text-anchor="start">标量；反传回到像素</text><text x="45" y="810" font-size="24" fill="#26372f" text-anchor="start">参数 86,567,656；矩阵乘加约 17.56 G MAC；形状链里唯一改变序列长度的是"拼 CLS"这一步。</text></g></svg>
