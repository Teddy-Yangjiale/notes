<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="785" viewBox="0 0 1200 785" role="img" aria-labelledby="title desc"><title id="title">位置表迁移：特殊token单独保留，patch恢复二维</title><desc id="desc">仅展示一个embedding通道；真实D个通道各自做空间插值，不混合通道。</desc><rect width="1200" height="785" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">位置表迁移：特殊token单独保留，patch恢复二维</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">仅展示一个embedding通道；真实D个通道各自做空间插值，不混合通道。</text><rect x="55" y="165" width="285" height="120" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="205" font-size="28" fill="#26372f" text-anchor="start">CLS位置值 99</text><text x="75" y="247" font-size="22" fill="#26372f" text-anchor="start">单独保留</text><rect x="55" y="340" width="102" height="102" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="105.5" y="400.5" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="160" y="340" width="102" height="102" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="210.5" y="400.5" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="55" y="445" width="102" height="102" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="105.5" y="505.5" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="160" y="445" width="102" height="102" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="210.5" y="505.5" font-size="23" fill="#26372f" text-anchor="middle">6</text><line x1="365" y1="415" x2="430" y2="415" stroke="#26372f" stroke-width="3"/><path d="M 419 408 L 430 415 L 419 422" fill="none" stroke="#26372f" stroke-width="3"/><rect x="450" y="320" width="260" height="205" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="470" y="360" font-size="28" fill="#26372f" text-anchor="start">二维插值</text><text x="470" y="402" font-size="22" fill="#26372f" text-anchor="start">2×2 → 3×3</text><text x="470" y="434" font-size="22" fill="#26372f" text-anchor="start">明确坐标/边界</text><text x="470" y="466" font-size="22" fill="#26372f" text-anchor="start">这里用双线性</text><line x1="735" y1="415" x2="800" y2="415" stroke="#26372f" stroke-width="3"/><path d="M 789 408 L 800 415 L 789 422" fill="none" stroke="#26372f" stroke-width="3"/><rect x="825" y="310" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="873" y="368" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="925" y="310" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="973" y="368" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="1025" y="310" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="1073" y="368" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="825" y="410" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="873" y="468" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="925" y="410" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="973" y="468" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="1025" y="410" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="1073" y="468" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="825" y="510" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="873" y="568" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="925" y="510" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="973" y="568" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="1025" y="510" width="97" height="97" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="1073" y="568" font-size="23" fill="#26372f" text-anchor="middle">6</text><line x1="350" y1="220" x2="1125" y2="220" stroke="#f3dfc4" stroke-width="3"/><text x="825" y="185" font-size="25" fill="#26372f" text-anchor="start">新CLS位置仍为99</text><text x="55" y="655" font-size="26" fill="#26372f" text-anchor="start">恢复网格需要源Gh/Gw与顺序；不能把含CLS的长度直接开平方。</text><text x="55" y="715" font-size="27" fill="#26372f" text-anchor="start">位置插值 ≠ 图像resize ≠ patch投影核resize。</text></g></svg>
