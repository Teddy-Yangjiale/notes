<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">迁移分清骨干、接口与训练范围</title><desc id="desc">预训练目标与目标任务可能不同；新head的类别和初始化要单独核对。</desc><rect width="1200" height="760" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">迁移分清骨干、接口与训练范围</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">预训练目标与目标任务可能不同；新head的类别和初始化要单独核对。</text><rect x="55" y="160" width="300" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="200" font-size="28" fill="#26372f" text-anchor="start">预训练骨干</text><text x="75" y="242" font-size="22" fill="#26372f" text-anchor="start">图像 → token编码</text><text x="75" y="274" font-size="22" fill="#26372f" text-anchor="start">保存权重与输入协议</text><text x="75" y="306" font-size="22" fill="#26372f" text-anchor="start">全局/patch接口明确</text><line x1="370" y1="245" x2="420" y2="245" stroke="#26372f" stroke-width="3"/><path d="M 409 238 L 420 245 L 409 252" fill="none" stroke="#26372f" stroke-width="3"/><rect x="440" y="160" width="315" height="180" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="460" y="200" font-size="28" fill="#26372f" text-anchor="start">替换任务头</text><text x="460" y="242" font-size="22" fill="#26372f" text-anchor="start">旧类别头移除或调整</text><text x="460" y="274" font-size="22" fill="#26372f" text-anchor="start">D → 新K类</text><text x="460" y="306" font-size="22" fill="#26372f" text-anchor="start">零初始化是可选协议</text><line x1="770" y1="245" x2="820" y2="245" stroke="#26372f" stroke-width="3"/><path d="M 809 238 L 820 245 L 809 252" fill="none" stroke="#26372f" stroke-width="3"/><rect x="840" y="160" width="300" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="860" y="200" font-size="28" fill="#26372f" text-anchor="start">目标数据与loss</text><text x="860" y="242" font-size="22" fill="#26372f" text-anchor="start">训练/验证/测试区分</text><text x="860" y="274" font-size="22" fill="#26372f" text-anchor="start">类别顺序与mask</text><text x="860" y="306" font-size="22" fill="#26372f" text-anchor="start">目标协议决定指标</text><rect x="55" y="430" width="495" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="470" font-size="28" fill="#26372f" text-anchor="start">Linear probe</text><text x="75" y="512" font-size="22" fill="#26372f" text-anchor="start">冻结骨干，只训练新头</text><text x="75" y="544" font-size="22" fill="#26372f" text-anchor="start">固定feature接口与提取模式</text><rect x="645" y="430" width="495" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="665" y="470" font-size="28" fill="#26372f" text-anchor="start">全量微调</text><text x="665" y="512" font-size="22" fill="#26372f" text-anchor="start">骨干也参与梯度更新</text><text x="665" y="544" font-size="22" fill="#26372f" text-anchor="start">分辨率、位置与预算一起记录</text><text x="55" y="680" font-size="24" fill="#26372f" text-anchor="start">零头第一步：头梯度可非零，骨干的该loss梯度为零；以后可回传。</text></g></svg>
