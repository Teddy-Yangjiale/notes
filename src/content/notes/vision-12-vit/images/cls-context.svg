<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">CLS与patch一起更新：全局槽位不是输入标签</title><desc id="desc">输入CLS是共享参数；读取图像之后，其输出状态才成为当前图像的全局表示。</desc><rect width="1200" height="760" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">CLS与patch一起更新：全局槽位不是输入标签</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">输入CLS是共享参数；读取图像之后，其输出状态才成为当前图像的全局表示。</text><rect x="55" y="175" width="300" height="145" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">共享CLS c</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">D个参数</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">每张图用同一起点</text><rect x="55" y="405" width="300" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="445" font-size="28" fill="#26372f" text-anchor="start">N个patch token</text><text x="75" y="487" font-size="22" fill="#26372f" text-anchor="start">来自当前图像</text><text x="75" y="519" font-size="22" fill="#26372f" text-anchor="start">每行D维局部表示</text><line x1="370" y1="250" x2="425" y2="250" stroke="#26372f" stroke-width="3"/><path d="M 414 243 L 425 250 L 414 257" fill="none" stroke="#26372f" stroke-width="3"/><line x1="370" y1="485" x2="425" y2="485" stroke="#26372f" stroke-width="3"/><path d="M 414 478 L 425 485 L 414 492" fill="none" stroke="#26372f" stroke-width="3"/><rect x="445" y="235" width="310" height="320" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="465" y="275" font-size="28" fill="#26372f" text-anchor="start">共同编码</text><text x="465" y="317" font-size="22" fill="#26372f" text-anchor="start">CLS与patch都产生Q/K/V</text><text x="465" y="349" font-size="22" fill="#26372f" text-anchor="start">位置表示加入各槽位</text><text x="465" y="381" font-size="22" fill="#26372f" text-anchor="start">L层attention + MLP</text><text x="465" y="413" font-size="22" fill="#26372f" text-anchor="start">各行获得上下文</text><line x1="770" y1="310" x2="815" y2="310" stroke="#26372f" stroke-width="3"/><path d="M 804 303 L 815 310 L 804 317" fill="none" stroke="#26372f" stroke-width="3"/><rect x="835" y="180" width="310" height="145" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="855" y="220" font-size="28" fill="#26372f" text-anchor="start">全局接口</text><text x="855" y="262" font-size="22" fill="#26372f" text-anchor="start">取最终LN后的CLS</text><text x="855" y="294" font-size="22" fill="#26372f" text-anchor="start">分类 / 检索头</text><line x1="770" y1="490" x2="815" y2="490" stroke="#26372f" stroke-width="3"/><path d="M 804 483 L 815 490 L 804 497" fill="none" stroke="#26372f" stroke-width="3"/><rect x="835" y="405" width="310" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="855" y="445" font-size="28" fill="#26372f" text-anchor="start">空间接口</text><text x="855" y="487" font-size="22" fill="#26372f" text-anchor="start">保留N个patch状态</text><text x="855" y="519" font-size="22" fill="#26372f" text-anchor="start">恢复原网格</text><text x="855" y="551" font-size="22" fill="#26372f" text-anchor="start">稠密头 / VLM连接器</text><text x="55" y="685" font-size="26" fill="#26372f" text-anchor="start">CLS不是目标类别one-hot；patch序列也不自动成为像素预测。</text></g></svg>
