<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">ViT输入：保留块内顺序，再使用共享线性投影</title><desc id="desc">4×4灰度图、P=2；第一块是1、2、5、6，不能把整图第一行当作一个块。</desc><rect width="1200" height="670" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">ViT输入：保留块内顺序，再使用共享线性投影</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">4×4灰度图、P=2；第一块是1、2、5、6，不能把整图第一行当作一个块。</text><rect x="55" y="180" width="65" height="65" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="87" y="222" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="123" y="180" width="65" height="65" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="155" y="222" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="191" y="180" width="65" height="65" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="223" y="222" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="259" y="180" width="65" height="65" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="291" y="222" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="55" y="248" width="65" height="65" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="87" y="290" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="123" y="248" width="65" height="65" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="155" y="290" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="191" y="248" width="65" height="65" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="223" y="290" font-size="23" fill="#26372f" text-anchor="middle">7</text><rect x="259" y="248" width="65" height="65" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="291" y="290" font-size="23" fill="#26372f" text-anchor="middle">8</text><rect x="55" y="316" width="65" height="65" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="87" y="358" font-size="23" fill="#26372f" text-anchor="middle">9</text><rect x="123" y="316" width="65" height="65" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="155" y="358" font-size="23" fill="#26372f" text-anchor="middle">10</text><rect x="191" y="316" width="65" height="65" rx="4" fill="#e6deee" stroke="#89998f" stroke-width="2"/><text x="223" y="358" font-size="23" fill="#26372f" text-anchor="middle">11</text><rect x="259" y="316" width="65" height="65" rx="4" fill="#e6deee" stroke="#89998f" stroke-width="2"/><text x="291" y="358" font-size="23" fill="#26372f" text-anchor="middle">12</text><rect x="55" y="384" width="65" height="65" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="87" y="426" font-size="23" fill="#26372f" text-anchor="middle">13</text><rect x="123" y="384" width="65" height="65" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="155" y="426" font-size="23" fill="#26372f" text-anchor="middle">14</text><rect x="191" y="384" width="65" height="65" rx="4" fill="#e6deee" stroke="#89998f" stroke-width="2"/><text x="223" y="426" font-size="23" fill="#26372f" text-anchor="middle">15</text><rect x="259" y="384" width="65" height="65" rx="4" fill="#e6deee" stroke="#89998f" stroke-width="2"/><text x="291" y="426" font-size="23" fill="#26372f" text-anchor="middle">16</text><line x1="340" y1="300" x2="415" y2="300" stroke="#26372f" stroke-width="3"/><path d="M 404 293 L 415 300 L 404 307" fill="none" stroke="#26372f" stroke-width="3"/><rect x="445" y="180" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="477" y="222" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="513" y="180" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="545" y="222" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="581" y="180" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="613" y="222" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="649" y="180" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="681" y="222" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="445" y="248" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="477" y="290" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="513" y="248" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="545" y="290" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="581" y="248" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="613" y="290" font-size="23" fill="#26372f" text-anchor="middle">7</text><rect x="649" y="248" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="681" y="290" font-size="23" fill="#26372f" text-anchor="middle">8</text><rect x="445" y="316" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="477" y="358" font-size="23" fill="#26372f" text-anchor="middle">9</text><rect x="513" y="316" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="545" y="358" font-size="23" fill="#26372f" text-anchor="middle">10</text><rect x="581" y="316" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="613" y="358" font-size="23" fill="#26372f" text-anchor="middle">13</text><rect x="649" y="316" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="681" y="358" font-size="23" fill="#26372f" text-anchor="middle">14</text><rect x="445" y="384" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="477" y="426" font-size="23" fill="#26372f" text-anchor="middle">11</text><rect x="513" y="384" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="545" y="426" font-size="23" fill="#26372f" text-anchor="middle">12</text><rect x="581" y="384" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="613" y="426" font-size="23" fill="#26372f" text-anchor="middle">15</text><rect x="649" y="384" width="65" height="65" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="681" y="426" font-size="23" fill="#26372f" text-anchor="middle">16</text><line x1="745" y1="300" x2="795" y2="300" stroke="#26372f" stroke-width="3"/><path d="M 784 293 L 795 300 L 784 307" fill="none" stroke="#26372f" stroke-width="3"/><rect x="825" y="180" width="320" height="270" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="845" y="220" font-size="28" fill="#26372f" text-anchor="start">共享投影 E</text><text x="845" y="262" font-size="22" fill="#26372f" text-anchor="start">每行4个输入槽位</text><text x="845" y="294" font-size="22" fill="#26372f" text-anchor="start">4×D权重 + D维bias</text><text x="845" y="326" font-size="22" fill="#26372f" text-anchor="start">四行各输出D维token</text><text x="55" y="530" font-size="27" fill="#26372f" text-anchor="start">切块展平是索引重排；投影是否丢失信息取决于维度与rank。</text><text x="55" y="590" font-size="26" fill="#26372f" text-anchor="start">相同E用于每块；kernel=P、stride=P卷积可实现同一投影。</text></g></svg>
