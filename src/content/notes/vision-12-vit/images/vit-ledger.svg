<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">ViT账本：更多token与更多参数不是同一件事</title><desc id="desc">标准B/16：D768、L12、M3072、一个CLS；矩阵MAC不等于实测延迟。</desc><rect width="1200" height="770" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">ViT账本：更多token与更多参数不是同一件事</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">标准B/16：D768、L12、M3072、一个CLS；矩阵MAC不等于实测延迟。</text><rect x="55" y="170" width="495" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">R224：14×14 patch + CLS</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">T=197；参数86,567,656</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">整网约17.564G MAC</text><text x="75" y="316" font-size="22" fill="#26372f" text-anchor="start">单张B1/H12/FP16 A：0.888MiB</text><rect x="645" y="170" width="495" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="665" y="210" font-size="28" fill="#26372f" text-anchor="start">R384：24×24 patch + CLS</text><text x="665" y="252" font-size="22" fill="#26372f" text-anchor="start">T=577；学习位置表需处理</text><text x="665" y="284" font-size="22" fill="#26372f" text-anchor="start">整网约55.484G MAC</text><text x="665" y="316" font-size="22" fill="#26372f" text-anchor="start">单张B1/H12/FP16 A：7.620MiB</text><rect x="55" y="465" width="1085" height="160" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="75" y="505" font-size="28" fill="#26372f" text-anchor="start">同R224改P32：token少，patch投影核更大</text><text x="75" y="547" font-size="22" fill="#26372f" text-anchor="start">T=50；参数88,224,232，略多于B/16；整网约4.409G MAC，明显更少。</text><text x="55" y="700" font-size="26" fill="#26372f" text-anchor="start">训练峰值还包含FFN激活、参数、梯度、优化器与工作区。</text></g></svg>
