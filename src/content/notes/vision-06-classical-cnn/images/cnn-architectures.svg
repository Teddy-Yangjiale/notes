<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">LeNet-5与AlexNet：尺寸变化、通道与分类头</title><desc id="desc">上：原LeNet通道连接；下：227输入、首层无padding的AlexNet教学尺寸。</desc><rect width="1200" height="900" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">LeNet-5与AlexNet：尺寸变化、通道与分类头</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">上：原LeNet通道连接；下：227输入、首层无padding的AlexNet教学尺寸。</text><text x="60" y="148" font-size="27" fill="#26372f" text-anchor="start">LeNet输入：1×32×32</text><rect x="60" y="180" width="160" height="115" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="80" y="220" font-size="28" fill="#26372f" text-anchor="start">C1</text><text x="80" y="262" font-size="22" fill="#26372f" text-anchor="start">6×28×28</text><line x1="222" y1="238" x2="237" y2="238" stroke="#26372f" stroke-width="3"/><path d="M 226 231 L 237 238 L 226 245" fill="none" stroke="#26372f" stroke-width="3"/><rect x="240" y="180" width="160" height="115" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="260" y="220" font-size="28" fill="#26372f" text-anchor="start">S2</text><text x="260" y="262" font-size="22" fill="#26372f" text-anchor="start">6×14×14</text><line x1="402" y1="238" x2="417" y2="238" stroke="#26372f" stroke-width="3"/><path d="M 406 231 L 417 238 L 406 245" fill="none" stroke="#26372f" stroke-width="3"/><rect x="420" y="180" width="160" height="115" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="440" y="220" font-size="28" fill="#26372f" text-anchor="start">C3 稀疏</text><text x="440" y="262" font-size="22" fill="#26372f" text-anchor="start">16×10×10</text><line x1="582" y1="238" x2="597" y2="238" stroke="#26372f" stroke-width="3"/><path d="M 586 231 L 597 238 L 586 245" fill="none" stroke="#26372f" stroke-width="3"/><rect x="600" y="180" width="160" height="115" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="620" y="220" font-size="28" fill="#26372f" text-anchor="start">S4</text><text x="620" y="262" font-size="22" fill="#26372f" text-anchor="start">16×5×5</text><line x1="762" y1="238" x2="777" y2="238" stroke="#26372f" stroke-width="3"/><path d="M 766 231 L 777 238 L 766 245" fill="none" stroke="#26372f" stroke-width="3"/><rect x="780" y="180" width="160" height="115" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="800" y="220" font-size="28" fill="#26372f" text-anchor="start">C5</text><text x="800" y="262" font-size="22" fill="#26372f" text-anchor="start">120×1×1</text><line x1="942" y1="238" x2="957" y2="238" stroke="#26372f" stroke-width="3"/><path d="M 946 231 L 957 238 L 946 245" fill="none" stroke="#26372f" stroke-width="3"/><rect x="960" y="180" width="160" height="115" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="980" y="220" font-size="28" fill="#26372f" text-anchor="start">F6</text><text x="980" y="262" font-size="22" fill="#26372f" text-anchor="start">84维</text><text x="60" y="345" font-size="25" fill="#26372f" text-anchor="start">距离输出：84维表示与类别模板比较；较小距离更匹配。</text><line x1="60" y1="380" x2="1135" y2="380" stroke="#95a99b" stroke-width="3" stroke-dasharray="9 7"/><text x="60" y="430" font-size="26" fill="#26372f" text-anchor="start">AlexNet输入：3×227×227（论文标注224，正文单独说明）</text><rect x="60" y="470" width="250" height="110" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="80" y="510" font-size="28" fill="#26372f" text-anchor="start">Conv1</text><text x="80" y="552" font-size="22" fill="#26372f" text-anchor="start">96×55×55</text><rect x="335" y="470" width="250" height="110" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="355" y="510" font-size="28" fill="#26372f" text-anchor="start">Pool1</text><text x="355" y="552" font-size="22" fill="#26372f" text-anchor="start">96×27×27</text><rect x="610" y="470" width="250" height="110" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="630" y="510" font-size="28" fill="#26372f" text-anchor="start">Conv2，g=2</text><text x="630" y="552" font-size="22" fill="#26372f" text-anchor="start">256×27×27</text><rect x="885" y="470" width="250" height="110" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="905" y="510" font-size="28" fill="#26372f" text-anchor="start">Pool2</text><text x="905" y="552" font-size="22" fill="#26372f" text-anchor="start">256×13×13</text><rect x="60" y="620" width="250" height="110" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="80" y="660" font-size="28" fill="#26372f" text-anchor="start">Conv3</text><text x="80" y="702" font-size="22" fill="#26372f" text-anchor="start">384×13×13</text><rect x="335" y="620" width="250" height="110" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="355" y="660" font-size="28" fill="#26372f" text-anchor="start">Conv4，g=2</text><text x="355" y="702" font-size="22" fill="#26372f" text-anchor="start">384×13×13</text><rect x="610" y="620" width="250" height="110" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="630" y="660" font-size="28" fill="#26372f" text-anchor="start">Conv5，g=2</text><text x="630" y="702" font-size="22" fill="#26372f" text-anchor="start">256×13×13</text><rect x="885" y="620" width="250" height="110" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="905" y="660" font-size="28" fill="#26372f" text-anchor="start">Pool5</text><text x="905" y="702" font-size="22" fill="#26372f" text-anchor="start">256×6×6</text><text x="60" y="795" font-size="24" fill="#26372f" text-anchor="start">空间路线：Conv1 → Pool1 → Conv2 → Pool2 → Conv3 → Conv4 → Conv5 → Pool5</text><text x="60" y="845" font-size="26" fill="#26372f" text-anchor="start">展开9216维 → FC4096 → FC4096 → FC1000 → softmax</text></g></svg>
