<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">反传：共享权重累计梯度，最大池化按选中位置路由</title><desc id="desc">对应算例M与N：左侧卷积无ReLU；右侧四个窗口都选择中心9。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">反传：共享权重累计梯度，最大池化按选中位置路由</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">对应算例M与N：左侧卷积无ReLU；右侧四个窗口都选择中心9。</text><text x="70" y="155" font-size="27" fill="#26372f" text-anchor="start">输入X</text><rect x="70" y="180" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="97" y="217" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="128" y="180" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="155" y="217" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="186" y="180" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="213" y="217" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="70" y="238" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="97" y="275" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="128" y="238" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="155" y="275" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="186" y="238" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="213" y="275" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="70" y="296" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="97" y="333" font-size="23" fill="#26372f" text-anchor="middle">7</text><rect x="128" y="296" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="155" y="333" font-size="23" fill="#26372f" text-anchor="middle">8</text><rect x="186" y="296" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="213" y="333" font-size="23" fill="#26372f" text-anchor="middle">9</text><text x="305" y="155" font-size="27" fill="#26372f" text-anchor="start">共享核W</text><rect x="305" y="180" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="332" y="217" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="363" y="180" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="390" y="217" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="305" y="238" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="332" y="275" font-size="23" fill="#26372f" text-anchor="middle">0</text><rect x="363" y="238" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="390" y="275" font-size="23" fill="#26372f" text-anchor="middle">-1</text><line x1="440" y1="240" x2="490" y2="240" stroke="#26372f" stroke-width="3"/><path d="M 479 233 L 490 240 L 479 247" fill="none" stroke="#26372f" stroke-width="3"/><rect x="515" y="180" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="542" y="217" font-size="23" fill="#26372f" text-anchor="middle">-4</text><rect x="573" y="180" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="600" y="217" font-size="23" fill="#26372f" text-anchor="middle">-4</text><rect x="515" y="238" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="542" y="275" font-size="23" fill="#26372f" text-anchor="middle">-4</text><rect x="573" y="238" width="55" height="55" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="600" y="275" font-size="23" fill="#26372f" text-anchor="middle">-4</text><text x="70" y="435" font-size="24" fill="#26372f" text-anchor="start">四个输出都参与核梯度：</text><text x="70" y="477" font-size="24" fill="#26372f" text-anchor="start">∂L/∂W₀₀ = −4 × (1+2+4+5) = −48</text><text x="70" y="519" font-size="24" fill="#26372f" text-anchor="start">同一输入被多处使用，也累计全部路径。</text><line x1="710" y1="140" x2="710" y2="570" stroke="#95a99b" stroke-width="3" stroke-dasharray="9 7"/><text x="780" y="155" font-size="27" fill="#26372f" text-anchor="start">重叠最大池化</text><rect x="800" y="180" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="831.5" y="221.5" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="867" y="180" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="898.5" y="221.5" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="934" y="180" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="965.5" y="221.5" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="800" y="247" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="831.5" y="288.5" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="867" y="247" width="64" height="64" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="898.5" y="288.5" font-size="23" fill="#26372f" text-anchor="middle">9</text><rect x="934" y="247" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="965.5" y="288.5" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="800" y="314" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="831.5" y="355.5" font-size="23" fill="#26372f" text-anchor="middle">7</text><rect x="867" y="314" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="898.5" y="355.5" font-size="23" fill="#26372f" text-anchor="middle">8</text><rect x="934" y="314" width="64" height="64" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="965.5" y="355.5" font-size="23" fill="#26372f" text-anchor="middle">5</text><text x="780" y="440" font-size="24" fill="#26372f" text-anchor="start">上游梯度为1、2、3、4</text><text x="780" y="482" font-size="24" fill="#26372f" text-anchor="start">中心9接收总梯度10</text><text x="780" y="524" font-size="24" fill="#26372f" text-anchor="start">其他位置接收0</text></g></svg>
