<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">HOG：局部方向统计 → 重叠块归一化 → 窗口向量</title><desc id="desc">示意4×4个cell；经典64×128窗口实际有8×16个cell。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">HOG：局部方向统计 → 重叠块归一化 → 窗口向量</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">示意4×4个cell；经典64×128窗口实际有8×16个cell。</text><rect x="70" y="165" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="106.5" y="211.5" font-size="23" fill="#26372f" text-anchor="middle">↑</text><rect x="147" y="165" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="183.5" y="211.5" font-size="23" fill="#26372f" text-anchor="middle">↗</text><rect x="224" y="165" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="260.5" y="211.5" font-size="23" fill="#26372f" text-anchor="middle">→</text><rect x="301" y="165" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="337.5" y="211.5" font-size="23" fill="#26372f" text-anchor="middle">↘</text><rect x="70" y="242" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="106.5" y="288.5" font-size="23" fill="#26372f" text-anchor="middle">↗</text><rect x="147" y="242" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="183.5" y="288.5" font-size="23" fill="#26372f" text-anchor="middle">↑</text><rect x="224" y="242" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="260.5" y="288.5" font-size="23" fill="#26372f" text-anchor="middle">↘</text><rect x="301" y="242" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="337.5" y="288.5" font-size="23" fill="#26372f" text-anchor="middle">→</text><rect x="70" y="319" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="106.5" y="365.5" font-size="23" fill="#26372f" text-anchor="middle">→</text><rect x="147" y="319" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="183.5" y="365.5" font-size="23" fill="#26372f" text-anchor="middle">↘</text><rect x="224" y="319" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="260.5" y="365.5" font-size="23" fill="#26372f" text-anchor="middle">↑</text><rect x="301" y="319" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="337.5" y="365.5" font-size="23" fill="#26372f" text-anchor="middle">↗</text><rect x="70" y="396" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="106.5" y="442.5" font-size="23" fill="#26372f" text-anchor="middle">↘</text><rect x="147" y="396" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="183.5" y="442.5" font-size="23" fill="#26372f" text-anchor="middle">→</text><rect x="224" y="396" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="260.5" y="442.5" font-size="23" fill="#26372f" text-anchor="middle">↗</text><rect x="301" y="396" width="74" height="74" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="337.5" y="442.5" font-size="23" fill="#26372f" text-anchor="middle">↑</text><rect x="66" y="161" width="155" height="155" fill="none" stroke="#28734c" stroke-width="6"/><rect x="145" y="240" width="155" height="155" fill="none" stroke="#386fa5" stroke-width="6"/><text x="70" y="520" font-size="25" fill="#26372f" text-anchor="start">绿框、蓝框重叠1个cell</text><text x="70" y="565" font-size="24" fill="#26372f" text-anchor="start">箭头仅示意梯度方向</text><line x1="410" y1="315" x2="480" y2="315" stroke="#26372f" stroke-width="3"/><path d="M 469 308 L 480 315 L 469 322" fill="none" stroke="#26372f" stroke-width="3"/><rect x="510" y="170" width="290" height="180" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="530" y="210" font-size="28" fill="#26372f" text-anchor="start">每个cell</text><text x="530" y="252" font-size="22" fill="#26372f" text-anchor="start">9个unsigned方向bin</text><text x="530" y="284" font-size="22" fill="#26372f" text-anchor="start">幅值与插值决定票重</text><rect x="850" y="170" width="285" height="180" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="870" y="210" font-size="28" fill="#26372f" text-anchor="start">每个block</text><text x="870" y="252" font-size="22" fill="#26372f" text-anchor="start">2×2个cell</text><text x="870" y="284" font-size="22" fill="#26372f" text-anchor="start">拼接并归一化：36维</text><rect x="510" y="390" width="625" height="175" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="530" y="430" font-size="28" fill="#26372f" text-anchor="start">全部block按固定次序拼接</text><text x="530" y="472" font-size="22" fill="#26372f" text-anchor="start">7列 × 15行 × 36维 = 3780维</text><text x="530" y="504" font-size="22" fill="#26372f" text-anchor="start">一个cell可参与多个block的归一化</text></g></svg>
