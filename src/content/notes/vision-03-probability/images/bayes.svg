<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">罕见事件：高命中率不等于高阳性真实性</title><desc id="desc">1000个工件、1%缺陷、命中90%、正常误报5%；分支数是期望数量。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">罕见事件：高命中率不等于高阳性真实性</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">1000个工件、1%缺陷、命中90%、正常误报5%；分支数是期望数量。</text><rect x="55" y="180" width="240" height="150" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="220" font-size="28" fill="#26372f" text-anchor="start">1000个工件</text><text x="75" y="262" font-size="22" fill="#26372f" text-anchor="start">缺陷10 / 正常990</text><line x1="310" y1="250" x2="395" y2="250" stroke="#26372f" stroke-width="3"/><path d="M 384 243 L 395 250 L 384 257" fill="none" stroke="#26372f" stroke-width="3"/><rect x="425" y="145" width="300" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="445" y="185" font-size="28" fill="#26372f" text-anchor="start">缺陷分支</text><text x="445" y="227" font-size="22" fill="#26372f" text-anchor="start">报阳性：10×0.9=9</text><text x="445" y="259" font-size="22" fill="#26372f" text-anchor="start">报阴性：1</text><rect x="425" y="350" width="300" height="170" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="445" y="390" font-size="28" fill="#26372f" text-anchor="start">正常分支</text><text x="445" y="432" font-size="22" fill="#26372f" text-anchor="start">误报：990×0.05=49.5</text><text x="445" y="464" font-size="22" fill="#26372f" text-anchor="start">正确阴性：940.5</text><rect x="820" y="235" width="310" height="240" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="840" y="275" font-size="28" fill="#26372f" text-anchor="start">只看阳性</text><text x="840" y="317" font-size="22" fill="#26372f" text-anchor="start">真缺陷：9</text><text x="840" y="349" font-size="22" fill="#26372f" text-anchor="start">总阳性：58.5</text><text x="840" y="381" font-size="22" fill="#26372f" text-anchor="start">9/58.5 ≈ 15.38%</text><text x="50" y="600" font-size="23" fill="#26372f" text-anchor="start">后验比例取决于条件性能与先验发生率；不能把命中率当作后验概率。</text></g></svg>
