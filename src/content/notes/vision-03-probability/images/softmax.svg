<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">三类别手算：logits → 概率 → loss → 梯度</title><desc id="desc">目标第二类，q=(0,1,0)；自然对数和归一化分母不可省略。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">三类别手算：logits → 概率 → loss → 梯度</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">目标第二类，q=(0,1,0)；自然对数和归一化分母不可省略。</text><rect x="50" y="170" width="260" height="220" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="70" y="210" font-size="28" fill="#26372f" text-anchor="start">分数z</text><text x="70" y="252" font-size="22" fill="#26372f" text-anchor="start">(2,1,0)</text><text x="70" y="284" font-size="22" fill="#26372f" text-anchor="start">先减max=2</text><text x="70" y="316" font-size="22" fill="#26372f" text-anchor="start">变为(0,−1,−2)</text><line x1="325" y1="275" x2="390" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 379 268 L 390 275 L 379 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="415" y="170" width="340" height="220" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="435" y="210" font-size="28" fill="#26372f" text-anchor="start">softmax概率p</text><text x="435" y="252" font-size="22" fill="#26372f" text-anchor="start">0.66524</text><text x="435" y="284" font-size="22" fill="#26372f" text-anchor="start">0.24473</text><text x="435" y="316" font-size="22" fill="#26372f" text-anchor="start">0.09003</text><line x1="770" y1="275" x2="835" y2="275" stroke="#26372f" stroke-width="3"/><path d="M 824 268 L 835 275 L 824 282" fill="none" stroke="#26372f" stroke-width="3"/><rect x="860" y="170" width="290" height="220" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="880" y="210" font-size="28" fill="#26372f" text-anchor="start">目标类loss</text><text x="880" y="252" font-size="22" fill="#26372f" text-anchor="start">−ln(0.24473)</text><text x="880" y="284" font-size="22" fill="#26372f" text-anchor="start">≈1.40761</text><text x="55" y="475" font-size="27" fill="#26372f" text-anchor="start">对logits梯度：p−q = (0.66524, −0.75527, 0.09003)</text><text x="55" y="535" font-size="24" fill="#26372f" text-anchor="start">下降更新降低错误类分数、提高目标类分数；它还需链式传到网络参数。</text></g></svg>
