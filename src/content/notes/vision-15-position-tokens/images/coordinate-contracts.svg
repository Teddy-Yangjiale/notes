<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">同一个位置：像素中心、边界与patch坐标</title><desc id="desc">位置数值必须连同原点、单位和映射保存；图中采用整数像素中心。</desc><rect width="1200" height="690" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">同一个位置：像素中心、边界与patch坐标</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">位置数值必须连同原点、单位和映射保存；图中采用整数像素中心。</text><rect x="55" y="165" width="325" height="200" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="205" font-size="28" fill="#26372f" text-anchor="start">第一块16个像素</text><text x="75" y="247" font-size="22" fill="#26372f" text-anchor="start">像素中心：0 … 15</text><text x="75" y="279" font-size="22" fill="#26372f" text-anchor="start">patch中心：7.5</text><text x="75" y="311" font-size="22" fill="#26372f" text-anchor="start">边界坐标的中心：8</text><rect x="435" y="165" width="325" height="200" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="205" font-size="28" fill="#26372f" text-anchor="start">矩形网格：14×20</text><text x="455" y="247" font-size="22" fill="#26372f" text-anchor="start">第19号：(311.5, 7.5)</text><text x="455" y="279" font-size="22" fill="#26372f" text-anchor="start">第20号：(7.5, 23.5)</text><text x="455" y="311" font-size="22" fill="#26372f" text-anchor="start">序列邻近不等于空间邻近</text><rect x="815" y="165" width="330" height="200" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="205" font-size="28" fill="#26372f" text-anchor="start">crop + resize</text><text x="835" y="247" font-size="22" fill="#26372f" text-anchor="start">原中心350，crop左端200</text><text x="835" y="279" font-size="22" fill="#26372f" text-anchor="start">放大2倍：新中心300.5</text><text x="835" y="311" font-size="22" fill="#26372f" text-anchor="start">半像素逆变换回到350</text><line x1="80" y1="465" x2="1080" y2="465" stroke="#26372f" stroke-width="3"/><line x1="100" y1="447" x2="100" y2="483" stroke="#26372f" stroke-width="3"/><text x="100" y="525" font-size="25" fill="#26372f" text-anchor="middle">像素</text><line x1="320" y1="447" x2="320" y2="483" stroke="#26372f" stroke-width="3"/><text x="320" y="525" font-size="25" fill="#26372f" text-anchor="middle">patch</text><line x1="540" y1="447" x2="540" y2="483" stroke="#26372f" stroke-width="3"/><text x="540" y="525" font-size="25" fill="#26372f" text-anchor="middle">crop局部</text><line x1="760" y1="447" x2="760" y2="483" stroke="#26372f" stroke-width="3"/><text x="760" y="525" font-size="25" fill="#26372f" text-anchor="middle">tile来源</text><line x1="980" y1="447" x2="980" y2="483" stroke="#26372f" stroke-width="3"/><text x="980" y="525" font-size="25" fill="#26372f" text-anchor="middle">原图</text><text x="55" y="615" font-size="24" fill="#26372f" text-anchor="start">网格(x,y)、图像像素、归一化坐标、帧与秒是不同单位；回投必须沿原映射。</text></g></svg>
