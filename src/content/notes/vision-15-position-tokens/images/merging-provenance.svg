<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">多对一合并：保存质量、来源与近似边界</title><desc id="desc">示意固定匹配，不求选择操作的导数；保护CLS与DIST，两个source共用一个destination。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">多对一合并：保存质量、来源与近似边界</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">示意固定匹配，不求选择操作的导数；保护CLS与DIST，两个source共用一个destination。</text><rect x="55" y="165" width="129" height="129" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="119" y="239" font-size="23" fill="#26372f" text-anchor="middle">CLS</text><rect x="187" y="165" width="129" height="129" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="251" y="239" font-size="23" fill="#26372f" text-anchor="middle">DIST</text><rect x="319" y="165" width="129" height="129" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="383" y="239" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="451" y="165" width="129" height="129" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="515" y="239" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="583" y="165" width="129" height="129" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="647" y="239" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="715" y="165" width="129" height="129" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="779" y="239" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="847" y="165" width="129" height="129" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="911" y="239" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="979" y="165" width="129" height="129" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="1043" y="239" font-size="23" fill="#26372f" text-anchor="middle">7</text><text x="55" y="360" font-size="26" fill="#26372f" text-anchor="start">选择边：2→3，4→3，6→7；8个输入成为5个代表。</text><rect x="55" y="425" width="335" height="210" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="465" font-size="28" fill="#26372f" text-anchor="start">合并组 {2,3,4}</text><text x="75" y="507" font-size="22" fill="#26372f" text-anchor="start">质量：1 + 3 + 2 = 6</text><text x="75" y="539" font-size="22" fill="#26372f" text-anchor="start">特征：(2,10),(8,−2),(4,6)</text><text x="75" y="571" font-size="22" fill="#26372f" text-anchor="start">加权均值：(17/3, 8/3)</text><rect x="435" y="425" width="335" height="210" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="465" font-size="28" fill="#26372f" text-anchor="start">保留协议</text><text x="455" y="507" font-size="22" fill="#26372f" text-anchor="start">来源索引与质量继续传递</text><text x="455" y="539" font-size="22" fill="#26372f" text-anchor="start">代表坐标可取加权质心</text><text x="455" y="571" font-size="22" fill="#26372f" text-anchor="start">下次合并不能忽略旧质量</text><rect x="815" y="425" width="330" height="210" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="465" font-size="28" fill="#26372f" text-anchor="start">不能保证的恢复</text><text x="835" y="507" font-size="22" fill="#26372f" text-anchor="start">unmerge复制代表到来源</text><text x="835" y="539" font-size="22" fill="#26372f" text-anchor="start">shape恢复不等于细节恢复</text><text x="835" y="571" font-size="22" fill="#26372f" text-anchor="start">logsize仅在限定条件精确</text><text x="55" y="735" font-size="24" fill="#26372f" text-anchor="start">先旋转再平均与在质心旋转一般不同；保存质心不能保留全部相位分布。</text></g></svg>
