<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">旋转通道对：轴向、混合与三轴教学例</title><desc id="desc">每两项是一对旋转通道；角度由坐标与对应频率决定，不由序列长度自动确定。</desc><rect width="1200" height="820" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">旋转通道对：轴向、混合与三轴教学例</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">每两项是一对旋转通道；角度由坐标与对应频率决定，不由序列长度自动确定。</text><rect x="55" y="175" width="335" height="250" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="215" font-size="28" fill="#26372f" text-anchor="start">二维axial</text><text x="75" y="257" font-size="22" fill="#26372f" text-anchor="start">一部分对只用x</text><text x="75" y="289" font-size="22" fill="#26372f" text-anchor="start">另一部分对只用y</text><text x="75" y="321" font-size="22" fill="#26372f" text-anchor="start">角度分别为ωx / ωy</text><text x="75" y="353" font-size="22" fill="#26372f" text-anchor="start">配置需定义通道分配</text><rect x="435" y="175" width="335" height="250" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="455" y="215" font-size="28" fill="#26372f" text-anchor="start">二维mixed</text><text x="455" y="257" font-size="22" fill="#26372f" text-anchor="start">每对读取x与y</text><text x="455" y="289" font-size="22" fill="#26372f" text-anchor="start">φ = fₓx + fᵧy</text><text x="455" y="321" font-size="22" fill="#26372f" text-anchor="start">不同对可有不同方向</text><text x="455" y="353" font-size="22" fill="#26372f" text-anchor="start">频率可连续学习</text><rect x="815" y="175" width="330" height="250" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="835" y="215" font-size="28" fill="#26372f" text-anchor="start">三轴教学d6</text><text x="835" y="257" font-size="22" fill="#26372f" text-anchor="start">第1对读取时间t</text><text x="835" y="289" font-size="22" fill="#26372f" text-anchor="start">第2对读取纵向y</text><text x="835" y="321" font-size="22" fill="#26372f" text-anchor="start">第3对读取横向x</text><text x="835" y="353" font-size="22" fill="#26372f" text-anchor="start">帧/秒改变须同步频率</text><rect x="55" y="505" width="1090" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="545" font-size="28" fill="#26372f" text-anchor="start">相对点积恒等式</text><text x="75" y="587" font-size="22" fill="#26372f" text-anchor="start">[R(p)q]ᵀ[R(p′)k] = qᵀR(p′−p)k（线性相位、同一频率政策）</text><text x="75" y="619" font-size="22" fill="#26372f" text-anchor="start">共同坐标平移可抵消相位；它不证明完整网络尺度或旋转等变。</text><text x="55" y="745" font-size="24" fill="#26372f" text-anchor="start">范数保持；分数随相位周期变化，不保证随每一对位置距离单调下降。</text></g></svg>
