<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">位置信息加在哪里：三条不同计算路径</title><desc id="desc">相同位置名称不代表相同函数；内容交叉项、V路径与mask需分别核对。</desc><rect width="1200" height="810" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">位置信息加在哪里：三条不同计算路径</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">相同位置名称不代表相同函数；内容交叉项、V路径与mask需分别核对。</text><rect x="55" y="170" width="340" height="270" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="75" y="210" font-size="28" fill="#26372f" text-anchor="start">输入加法位置</text><text x="75" y="252" font-size="22" fill="#26372f" text-anchor="start">输入：X + P</text><text x="75" y="284" font-size="22" fill="#26372f" text-anchor="start">再生成Q、K、V</text><text x="75" y="316" font-size="22" fill="#26372f" text-anchor="start">QK含内容与位置交叉项</text><text x="75" y="348" font-size="22" fill="#26372f" text-anchor="start">位置可进入FFN与残差</text><rect x="430" y="170" width="340" height="270" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="450" y="210" font-size="28" fill="#26372f" text-anchor="start">相对logit bias</text><text x="450" y="252" font-size="22" fill="#26372f" text-anchor="start">输入先投影Q、K、V</text><text x="450" y="284" font-size="22" fill="#26372f" text-anchor="start">logit：QKᵀ/√d + B</text><text x="450" y="316" font-size="22" fill="#26372f" text-anchor="start">B按query / key位移查表</text><text x="450" y="348" font-size="22" fill="#26372f" text-anchor="start">不能吸收任意内容交叉项</text><rect x="805" y="170" width="340" height="270" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="825" y="210" font-size="28" fill="#26372f" text-anchor="start">旋转Q与K</text><text x="825" y="252" font-size="22" fill="#26372f" text-anchor="start">Qᵢ → R(pᵢ)Qᵢ</text><text x="825" y="284" font-size="22" fill="#26372f" text-anchor="start">Kⱼ → R(pⱼ)Kⱼ</text><text x="825" y="316" font-size="22" fill="#26372f" text-anchor="start">点积含相对相位</text><text x="825" y="348" font-size="22" fill="#26372f" text-anchor="start">本章V不做同样旋转</text><rect x="55" y="520" width="1090" height="130" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="75" y="560" font-size="28" fill="#26372f" text-anchor="start">允许关系另有职责</text><text x="75" y="602" font-size="22" fill="#26372f" text-anchor="start">mask决定能否读取；位置bias或旋转决定合法位置之间的分数。</text><text x="55" y="735" font-size="24" fill="#26372f" text-anchor="start">特殊token、投影前后次序、配对布局与频率都是checkpoint协议的一部分。</text></g></svg>
