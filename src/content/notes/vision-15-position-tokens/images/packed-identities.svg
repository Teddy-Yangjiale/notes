"267" font-size="22" fill="#26372f" text-anchor="start">输出A的分类loss；不按容器把A与B混成一图。</text><rect x="500" y="375" width="640" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="520" y="415" font-size="28" fill="#26372f" text-anchor="start">pool B：只读取第2 / 3 / 4项</text><text x="520" y="457" font-size="22" fill="#26372f" text-anchor="start">输出B的分类loss；pad不作为图或对比负例。</text><rect x="60" y="625" width="1080" height="135" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="80" y="665" font-size="28" fill="#26372f" text-anchor="start">数学隔离 ≠ 自动节省稠密乘法</text><text x="80" y="707" font-size="22" fill="#26372f" text-anchor="start">真实对数：2²+3²=13；加入pad自读共15；稠密L7仍存49个分数。</text><text x="60" y="835" font-size="24" fill="#26372f" text-anchor="start">编码器隔离不消除对比loss的跨样本负例耦合；需核对完整计算图。</text></g></svg>
