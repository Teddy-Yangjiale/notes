<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="605" viewBox="0 0 1200 605" role="img" aria-labelledby="title desc"><title id="title">位置从哪里来，又在哪里失效？</title><desc id="desc">按核心问题串联本讲论文与技术的路线图。</desc><rect width="1200" height="605" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">位置从哪里来，又在哪里失效？</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">按核心问题串联本讲论文与技术的路线图。</text><rect x="45" y="155" width="250" height="215" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="195" font-size="24" fill="#26372f" text-anchor="start">像素与 patch 坐标</text><text x="65" y="237" font-size="18" fill="#26372f" text-anchor="start">先定义坐标原点</text><text x="65" y="267" font-size="18" fill="#26372f" text-anchor="start"></text><line x1="300" y1="260" x2="330" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 319 253 L 330 260 L 319 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="335" y="155" width="250" height="215" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="355" y="195" font-size="24" fill="#26372f" text-anchor="start">绝对与相对位置</text><text x="355" y="237" font-size="18" fill="#26372f" text-anchor="start">再问模型怎样读取</text><text x="355" y="267" font-size="18" fill="#26372f" text-anchor="start"></text><line x1="590" y1="260" x2="620" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 609 253 L 620 260 L 609 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="625" y="155" width="250" height="215" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="645" y="195" font-size="24" fill="#26372f" text-anchor="start">RoPE 的旋转</text><text x="645" y="237" font-size="18" fill="#26372f" text-anchor="start">相加或加入注意力偏置</text><text x="645" y="267" font-size="18" fill="#26372f" text-anchor="start"></text><line x1="880" y1="260" x2="910" y2="260" stroke="#26372f" stroke-width="3"/><path d="M 899 253 L 910 260 L 899 267" fill="none" stroke="#26372f" stroke-width="3"/><rect x="915" y="155" width="250" height="215" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="935" y="195" font-size="24" fill="#26372f" text-anchor="start">打包与合并边界</text><text x="935" y="237" font-size="18" fill="#26372f" text-anchor="start">相对位移进入相位差</text><text x="935" y="267" font-size="18" fill="#26372f" text-anchor="start">重排时检查位置语义</text><rect x="45" y="430" width="1115" height="125" rx="13" fill="#ffffff" stroke="#95a99b" stroke-width="2"/><text x="65" y="470" font-size="28" fill="#26372f" text-anchor="start">阅读方式</text><text x="65" y="512" font-size="22" fill="#26372f" text-anchor="start">沿箭头追问：上一步解决了什么？留下什么限制？</text><text x="65" y="544" font-size="22" fill="#26372f" text-anchor="start">下一篇论文改动的是目标、结构、数据，还是训练过程？</text></g></svg>
