<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">训练更新与验证选模必须分开</title><desc id="desc">train参与梯度更新；validation用于选模；test应保留独立评估角色。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">训练更新与验证选模必须分开</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">train参与梯度更新；validation用于选模；test应保留独立评估角色。</text><rect x="50" y="165" width="260" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="70" y="205" font-size="28" fill="#26372f" text-anchor="start">训练数据</text><text x="70" y="247" font-size="22" fill="#26372f" text-anchor="start">前处理 → forward</text><text x="70" y="279" font-size="22" fill="#26372f" text-anchor="start">loss → backward</text><line x1="325" y1="250" x2="390" y2="250" stroke="#26372f" stroke-width="3"/><path d="M 379 243 L 390 250 L 379 257" fill="none" stroke="#26372f" stroke-width="3"/><rect x="415" y="165" width="315" height="170" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="435" y="205" font-size="28" fill="#26372f" text-anchor="start">optimizer更新</text><text x="435" y="247" font-size="22" fill="#26372f" text-anchor="start">梯度 + 历史状态</text><text x="435" y="279" font-size="22" fill="#26372f" text-anchor="start">参数变为下一步</text><line x1="745" y1="250" x2="810" y2="250" stroke="#26372f" stroke-width="3"/><path d="M 799 243 L 810 250 L 799 257" fill="none" stroke="#26372f" stroke-width="3"/><rect x="835" y="165" width="310" height="170" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="855" y="205" font-size="28" fill="#26372f" text-anchor="start">保存checkpoint</text><text x="855" y="247" font-size="22" fill="#26372f" text-anchor="start">权重 / 状态 / step</text><text x="855" y="279" font-size="22" fill="#26372f" text-anchor="start">可恢复训练轨迹</text><rect x="95" y="405" width="470" height="150" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="115" y="445" font-size="28" fill="#26372f" text-anchor="start">验证：eval + 不追踪梯度</text><text x="115" y="487" font-size="22" fill="#26372f" text-anchor="start">按固定协议计算指标、选择配置</text><rect x="630" y="405" width="475" height="150" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="650" y="445" font-size="28" fill="#26372f" text-anchor="start">测试：独立最终评估</text><text x="650" y="487" font-size="22" fill="#26372f" text-anchor="start">反复据test修改会造成选择偏差</text></g></svg>
