<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">BN与LN：归约轴不同，结果语义也不同</title><desc id="desc">示意B×D矩阵；CNN的BN通常还在空间轴上统计。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">BN与LN：归约轴不同，结果语义也不同</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">示意B×D矩阵；CNN的BN通常还在空间轴上统计。</text><text x="80" y="170" font-size="28" fill="#26372f" text-anchor="start">BN：每特征跨样本</text><rect x="90" y="215" width="82" height="82" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="130.5" y="265.5" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="175" y="215" width="82" height="82" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="215.5" y="265.5" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="90" y="300" width="82" height="82" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="130.5" y="350.5" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="175" y="300" width="82" height="82" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="215.5" y="350.5" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="90" y="385" width="82" height="82" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="130.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="175" y="385" width="82" height="82" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="215.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">9</text><text x="630" y="170" font-size="28" fill="#26372f" text-anchor="start">LN：每样本跨特征</text><rect x="640" y="215" width="82" height="82" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="680.5" y="265.5" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="725" y="215" width="82" height="82" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="765.5" y="265.5" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="640" y="300" width="82" height="82" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="680.5" y="350.5" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="725" y="300" width="82" height="82" rx="4" fill="#dce8f4" stroke="#89998f" stroke-width="2"/><text x="765.5" y="350.5" font-size="23" fill="#26372f" text-anchor="middle">6</text><rect x="640" y="385" width="82" height="82" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="680.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="725" y="385" width="82" height="82" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="765.5" y="435.5" font-size="23" fill="#26372f" text-anchor="middle">9</text><text x="80" y="535" font-size="24" fill="#26372f" text-anchor="start">训练batch影响BN统计；eval常用running统计。</text><text x="630" y="535" font-size="24" fill="#26372f" text-anchor="start">[1,3] → 均值2、方差1 → [−1,1]</text><text x="80" y="600" font-size="24" fill="#26372f" text-anchor="start">γ和β可学习；ε控制数值稳定；轴定义必须对应实际模块接口。</text></g></svg>
