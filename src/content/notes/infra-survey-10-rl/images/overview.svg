<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6C6157"/></marker>
  </defs>
  <rect width="1060" height="560" fill="#F6F2E8"/>
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#2E2822">RL 后训练基础设施：三阶段循环</text>
  <line x1="30" y1="56" x2="1030" y2="56" stroke="#CFC4AC" stroke-width="2"/>

  <!-- 循环 -->
  <rect x="60" y="100" width="280" height="120" rx="14" fill="#92B7D1" opacity="0.9"/>
  <text x="200" y="145" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFDF7">① Rollout 生成</text>
  <text x="200" y="178" text-anchor="middle" font-size="14" fill="#FFFDF7">推理引擎出轨迹</text>
  <text x="200" y="202" text-anchor="middle" font-size="14" fill="#FFFDF7">长尾：短的等长的</text>

  <rect x="400" y="100" width="280" height="120" rx="14" fill="#A8BE86" opacity="0.9"/>
  <text x="540" y="145" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFDF7">② 训练更新</text>
  <text x="540" y="178" text-anchor="middle" font-size="14" fill="#FFFDF7">GRPO / PPO 策略优化</text>
  <text x="540" y="202" text-anchor="middle" font-size="14" fill="#FFFDF7">权重同步回推理引擎</text>

  <rect x="740" y="100" width="280" height="120" rx="14" fill="#E9C97E" opacity="0.95"/>
  <text x="880" y="145" text-anchor="middle" font-size="19" font-weight="bold" fill="#2E2822">③ 奖励评估</text>
  <text x="880" y="178" text-anchor="middle" font-size="14" fill="#2E2822">RLVR 可验证奖励</text>
  <text x="880" y="202" text-anchor="middle" font-size="14" fill="#2E2822">奖励 = 代码执行</text>

  <line x1="340" y1="160" x2="400" y2="160" stroke="#6C6157" stroke-width="2.5" marker-end="url(#arrA)"/>
  <line x1="680" y1="160" x2="740" y2="160" stroke="#6C6157" stroke-width="2.5" marker-end="url(#arrA)"/>
  <path d="M 880 220 C 880 280, 200 280, 200 220" fill="none" stroke="#C0522E" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="540" y="272" text-anchor="middle" font-size="14" fill="#C0522E">权重同步（NCCL 广播 / 共享内存 / 参数服务器）</text>

  <!-- 痛点 -->
  <text x="30" y="330" font-size="17" font-weight="bold" fill="#2E2822">系统痛点</text>
  <rect x="30" y="346" width="240" height="90" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="150" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0522E">GPU 利用率极低</text>
  <text x="150" y="410" text-anchor="middle" font-size="13" fill="#2E2822">rollout 与 train 互相等待</text>
  <rect x="290" y="346" width="240" height="90" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="410" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0522E">权重同步开销</text>
  <text x="410" y="410" text-anchor="middle" font-size="13" fill="#2E2822">多模型共存（actor/critic/reward）</text>
  <rect x="550" y="346" width="240" height="90" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="670" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0522E">长尾 rollout</text>
  <text x="670" y="410" text-anchor="middle" font-size="13" fill="#2E2822">response 长度方差大</text>
  <rect x="810" y="346" width="220" height="90" rx="12" fill="#FFFDF7" stroke="#E0D8C6" stroke-width="2"/>
  <text x="920" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0522E">多策略并发</text>
  <text x="920" y="410" text-anchor="middle" font-size="13" fill="#2E2822">adapter 流转 18.3×</text>

  <!-- 2026 -->
  <rect x="30" y="462" width="1000" height="68" rx="12" fill="#EDE7D9" stroke="#CFC4AC" stroke-width="2"/>
  <text x="55" y="490" font-size="15" font-weight="bold" fill="#C0522E">2026 交叉热点</text>
  <text x="55" y="516" font-size="14" fill="#2E2822">MinT 基座驻留+适配器流转 · 异构 RL（弱卡 rollout 强卡训练）· 投机解码加速 rollout 长尾 · Agent 式多轮 rollout</text>
</svg>
