<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">广播陷阱：逐样本误差变成两两配对</title><desc id="desc">示意B=3；target:(B,1)，prediction:(B,)会广播到(B,B)。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">广播陷阱：逐样本误差变成两两配对</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">示意B=3；target:(B,1)，prediction:(B,)会广播到(B,B)。</text><rect x="65" y="160" width="480" height="130" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="85" y="200" font-size="28" fill="#26372f" text-anchor="start">期望：同一个样本配对</text><text x="85" y="242" font-size="22" fill="#26372f" text-anchor="start">样本1↔1，样本2↔2，样本3↔3</text><rect x="100" y="350" width="67" height="67" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="133" y="393" font-size="23" fill="#26372f" text-anchor="middle">1↔1</text><rect x="100" y="420" width="67" height="67" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="133" y="463" font-size="23" fill="#26372f" text-anchor="middle">2↔2</text><rect x="100" y="490" width="67" height="67" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="133" y="533" font-size="23" fill="#26372f" text-anchor="middle">3↔3</text><text x="235" y="410" font-size="26" fill="#26372f" text-anchor="start">只应有3个误差项</text><rect x="630" y="160" width="490" height="130" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="650" y="200" font-size="28" fill="#26372f" text-anchor="start">错误：所有样本两两配对</text><text x="650" y="242" font-size="22" fill="#26372f" text-anchor="start">shape=(3,3)，出现9个误差项</text><rect x="660" y="335" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="705.5" y="390.5" font-size="23" fill="#26372f" text-anchor="middle">1↔1</text><rect x="755" y="335" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="800.5" y="390.5" font-size="23" fill="#26372f" text-anchor="middle">1↔2</text><rect x="850" y="335" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="895.5" y="390.5" font-size="23" fill="#26372f" text-anchor="middle">1↔3</text><rect x="660" y="430" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="705.5" y="485.5" font-size="23" fill="#26372f" text-anchor="middle">2↔1</text><rect x="755" y="430" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="800.5" y="485.5" font-size="23" fill="#26372f" text-anchor="middle">2↔2</text><rect x="850" y="430" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="895.5" y="485.5" font-size="23" fill="#26372f" text-anchor="middle">2↔3</text><rect x="660" y="525" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="705.5" y="580.5" font-size="23" fill="#26372f" text-anchor="middle">3↔1</text><rect x="755" y="525" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="800.5" y="580.5" font-size="23" fill="#26372f" text-anchor="middle">3↔2</text><rect x="850" y="525" width="92" height="92" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="895.5" y="580.5" font-size="23" fill="#26372f" text-anchor="middle">3↔3</text><text x="70" y="600" font-size="23" fill="#26372f" text-anchor="start">先统一预测和标签shape，再核对轴语义；程序不报错不等于任务正确。</text></g></svg>
