<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">一次完整反向传播：前向值与梯度必须区分</title><desc id="desc">x=(1,2)，w=(1,−1)，b=3，v=2，c=0，目标y=1。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">一次完整反向传播：前向值与梯度必须区分</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">x=(1,2)，w=(1,−1)，b=3，v=2，c=0，目标y=1。</text><rect x="45" y="190" width="215" height="165" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="65" y="230" font-size="28" fill="#26372f" text-anchor="start">线性汇总</text><text x="65" y="272" font-size="22" fill="#26372f" text-anchor="start">a = 1−2+3 = 2</text><line x1="275" y1="270" x2="320" y2="270" stroke="#26372f" stroke-width="3"/><path d="M 309 263 L 320 270 L 309 277" fill="none" stroke="#26372f" stroke-width="3"/><rect x="335" y="190" width="215" height="165" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="355" y="230" font-size="28" fill="#26372f" text-anchor="start">ReLU</text><text x="355" y="272" font-size="22" fill="#26372f" text-anchor="start">h = 2</text><line x1="565" y1="270" x2="610" y2="270" stroke="#26372f" stroke-width="3"/><path d="M 599 263 L 610 270 L 599 277" fill="none" stroke="#26372f" stroke-width="3"/><rect x="625" y="190" width="215" height="165" rx="13" fill="#d9e8de" stroke="#95a99b" stroke-width="2"/><text x="645" y="230" font-size="28" fill="#26372f" text-anchor="start">输出层</text><text x="645" y="272" font-size="22" fill="#26372f" text-anchor="start">预测 = 2×2 = 4</text><line x1="855" y1="270" x2="900" y2="270" stroke="#26372f" stroke-width="3"/><path d="M 889 263 L 900 270 L 889 277" fill="none" stroke="#26372f" stroke-width="3"/><rect x="915" y="190" width="240" height="165" rx="13" fill="#f3dfc4" stroke="#95a99b" stroke-width="2"/><text x="935" y="230" font-size="28" fill="#26372f" text-anchor="start">平方损失</text><text x="935" y="272" font-size="22" fill="#26372f" text-anchor="start">L = (4−1)²/2</text><text x="935" y="304" font-size="22" fill="#26372f" text-anchor="start">L = 4.5</text><text x="55" y="430" font-size="25" fill="#a34435" text-anchor="start">到预测的梯度：3</text><text x="55" y="472" font-size="25" fill="#a34435" text-anchor="start">到h的梯度：3×v=6</text><text x="55" y="514" font-size="25" fill="#a34435" text-anchor="start">到a的梯度：6×1=6</text><text x="590" y="430" font-size="25" fill="#a34435" text-anchor="start">∂L/∂v = 3×h = 6</text><text x="590" y="472" font-size="25" fill="#a34435" text-anchor="start">∂L/∂w₁ = 6×1 = 6</text><text x="590" y="514" font-size="25" fill="#a34435" text-anchor="start">∂L/∂w₂ = 6×2 = 12</text><text x="50" y="600" font-size="23" fill="#26372f" text-anchor="start">全部梯度在旧参数下计算；统一更新后重新做完整前向。</text></g></svg>
