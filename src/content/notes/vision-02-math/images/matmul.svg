nchor="start">C₁₁ = 1×1 + 2×0 + 3×1 = 4</text><text x="75" y="515" font-size="27" fill="#26372f" text-anchor="start">C₁₂ = 1×0 + 2×1 + 3×1 = 5</text><text x="730" y="505" font-size="27" fill="#26372f" text-anchor="start">不是逐元素相乘</text></g></svg>
