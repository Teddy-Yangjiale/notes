<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">矩阵乘法：每项输出是一行与一列的点积</title><desc id="desc">A:2×3，B:3×2，C=AB:2×2；公共轴3被求和。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">矩阵乘法：每项输出是一行与一列的点积</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">A:2×3，B:3×2，C=AB:2×2；公共轴3被求和。</text><rect x="75" y="175" width="62" height="62" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="105.5" y="215.5" font-size="23" fill="#26372f" text-anchor="middle">1</text><rect x="140" y="175" width="62" height="62" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="170.5" y="215.5" font-size="23" fill="#26372f" text-anchor="middle">2</text><rect x="205" y="175" width="62" height="62" rx="4" fill="#f3dfc4" stroke="#89998f" stroke-width="2"/><text x="235.5" y="215.5" font-size="23" fill="#26372f" text-anchor="middle">3</text><rect x="75" y="240" width="62" height="62" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="105.5" y="280.5" font-size="23" fill="#26372f" text-anchor="middle">4</text><rect x="140" y="240" width="62" height="62" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="170.5" y="280.5" font-size="23" fill="#26372f" text-anchor="middle">5</text><rect x="205" y="240" width="62" height="62" rx="4" fill="#ffffff" stroke="#89998f" stroke-width="2"/><text x="235.5" y="280.5" font-size="23" fill="#26372f" text-anchor="middle">6</text><text x="130" y="370" font-size="30" fill="#26372f" text-anchor="start">A</text><text x="305" y="270" font-size="40" fill="#26372f" text-anchor="start">×</text><rect x="405" y="145" width="62" height="62" rx="4" fill="#d9e8de" stroke="#89998f" stroke-width="2"/><text x="435.5" y="185.5" font-size="23" fill="#26372f" text-anchor