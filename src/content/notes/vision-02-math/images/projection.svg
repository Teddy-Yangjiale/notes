<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">投影：保留沿u方向的信息</title><desc id="desc">x=(3,4)，u=(1,0)；投影=(3,0)，残差=(0,4)。</desc><rect width="1200" height="640" fill="#f7f5ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="45" y="58" font-size="34" fill="#26372f" text-anchor="start">投影：保留沿u方向的信息</text><text x="45" y="100" font-size="22" fill="#5b6b62" text-anchor="start">x=(3,4)，u=(1,0)；投影=(3,0)，残差=(0,4)。</text><line x1="110" y1="460" x2="730" y2="460" stroke="#26372f" stroke-width="3"/><line x1="160" y1="510" x2="160" y2="140" stroke="#26372f" stroke-width="3"/><line x1="160" y1="460" x2="530" y2="160" stroke="#26372f" stroke-width="3"/><line x1="160" y1="460" x2="530" y2="460" stroke="#3b7e57" stroke-width="3"/><line x1="530" y1="460" x2="530" y2="160" stroke="#a34435" stroke-width="3" stroke-dasharray="9 7"/><text x="550" y="155" font-size="28" fill="#26372f" text-anchor="start">x=(3,4)</text><text x="330" y="500" font-size="27" fill="#3b7e57" text-anchor="start">投影=(3,0)</text><text x="550" y="320" font-size="25" fill="#a34435" text-anchor="start">残差</text><rect x="510" y="440" width="20" height="20" rx="13" fill="none" stroke="#95a99b" stroke-width="2"/><rect x="795" y="190" width="340" height="250" rx="13" fill="#dce8f4" stroke="#95a99b" stroke-width="2"/><text x="815" y="230" font-size="28" fill="#26372f" text-anchor="start">正交条件</text><text x="815" y="272" font-size="22" fill="#26372f" text-anchor="start">uᵀ(x−au)=0</text><text x="815" y="304" font-size="22" fill="#26372f" text-anchor="start">a=(uᵀx)/(uᵀu)</text><text x="815" y="336" font-size="22" fill="#26372f" text-anchor="start">本例a=3</text><text x="100" y="570" font-size="25" fill="#26372f" text-anchor="start">残差与u点积为0；投影是保留指定方向，不是无损压缩。</text></g></svg>
